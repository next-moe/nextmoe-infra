# Deadman registry for /root/lib/watchdog.sh
#
#   <name>  <success-stamp file>  <max age in hours>
#
# The limit is one full cycle plus a day of slack, so a single missed run is
# reported the day after it should have happened, and normal jitter is not.
# Weekly jobs therefore get 192h (8 days).
bgm-refresh	/root/bgm-refresh/state/last-success	192
vndb-refresh	/root/vndb-refresh/state/last-success	192
playtime-aggregate	/root/playtime-aggregate/state/last-success	48
refresh-tag-counts	/root/refresh-tag-counts/state/last-success	6
reindex-catalog	/root/reindex-catalog/state/last-success	48
intromt-nightly	/root/intromt-nightly/state/last-success	48
image-grade-nightly	/root/image-grade-nightly/state/last-success	48
tag-vocab-backlog	/root/tag-vocab-backlog/state/last-success	768
work-dedup-watch	/root/work-dedup-watch/state/last-success	192
work-dedup-nightly	/root/work-dedup-nightly/state/last-success	48
ymgal-pending-watch	/root/ymgal-pending-watch/state/last-success	48
