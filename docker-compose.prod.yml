# nextmoe-infra — PRODUCTION compose (Dokploy + GHCR prebuilt images).
# Compose `name:` is frozen: volumes, networks and container names hang off it.
#
# Differs from docker-compose.yml (local/dev):
#   1. `image: ghcr.io/next-moe/infra-*` — NOT `build:`. CI builds+pushes; Dokploy PULLS.
#   2. `expose:` (container-network only) not `ports:` — Traefik routes internally.
#   3. network = `dokploy-network` (external) — shared by the 3 Dokploy apps.
#   4. **NO `env_file`** — all runtime config is inline `environment:` here, so Dokploy
#      needs no `docker/*.env` files on disk. Non-secret/structural values are literal;
#      secrets + deploy-specifics come from **Dokploy's Environment panel** via `${VAR}`.
#
# Set these in the infra app's Dokploy **Environment**:
#   POSTGRES_PASSWORD  JWT_SECRET  MINIO_ROOT_USER  MINIO_ROOT_PASSWORD
#   KUN_IMAGE_S3_ENDPOINT  KUN_IMAGE_S3_ACCESS_KEY  KUN_IMAGE_S3_SECRET_KEY   (R2/MinIO)
#   KUN_VISUAL_NOVEL_EMAIL_PASSWORD                                          (SMTP, 可选)
# Within infra, oauth/image/galgame all read the SAME ${JWT_SECRET}/${POSTGRES_PASSWORD}
# → intra-app consistency is automatic.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#     ↳ the migrate-* jobs auto-run FIRST; the services gate on them
#       (depends_on: service_completed_successfully) — no manual migrate step.
#   # full data cutover (16-data-cutover.md): docker compose ... --profile jobs run --rm tools <job> ...
name: kun-galgame-infra

# A steady-state check is a container exec; at 10s across ~30 containers the
# box ran 279 exec/min. start_interval keeps the deploy path fast (2s
# granularity until the first success) while the steady cadence drops 6x, and
# nothing here restarts on unhealthy, so a slower steady interval costs
# observability lag only.
# Do NOT attribute dockerd CPU to this block. The 1.16 -> 2.85 cores it was
# first blamed for were leaked `docker logs` readers spinning in tailfile;
# killing the hung clients on 2026-09-07 took dockerd to 0.03 cores at an
# unchanged 226 exec/min. At this scale the exec rate is not a measurable
# dockerd cost, so tune these for observability, never for CPU.
x-svc-health: &svc-health
  interval: 60s
  timeout: 5s
  retries: 3
  start_period: 30s
  start_interval: 2s

# ── shared backend env (union; services ignore keys they don't read) ──────────
# Literal = non-secret/structural. ${VAR:?} = required secret (set in Dokploy).
# ${VAR:-default} = optional override.
x-infra-env: &infra-env
  KUN_ENV: production
  # Postgres (one server, 5 DBs)
  KUN_PG_HOST: postgres
  KUN_PG_PORT: "5432"
  KUN_PG_USER: postgres
  KUN_PG_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in Dokploy Environment}
  KUN_PG_DATABASE: kun_galgame_infra
  KUN_PG_SSLMODE: disable
  KUN_PG_TIMEZONE: Asia/Shanghai
  # W1 (wiki retirement, doc 19): the galgame content body lives in kun_catalog
  # — full byte-verified move on 2026-07-16. The frozen rollback copy was
  # archived + renamed to kun_galgame_wiki_retired_w1 on 2026-07-29 (final dump
  # at /root/retired/); DROP it after 2026-08-15 (the >=30d retention).
  KUN_GALGAME_PG_DATABASE: kun_catalog
  KUN_IMAGES_PG_DATABASE: kun_images
  KUN_CATALOG_PG_DATABASE: kun_catalog
  KUN_COMMUNITY_PG_DATABASE: kun_community
  KUN_TRUST_PG_DATABASE: kun_trust
  KUN_AI_PG_DATABASE: kun_ai
  KUN_NEWS_PG_DATABASE: kun_news
  # Redis
  REDIS_ENABLED: "true"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  # JWT — oauth signs access_token (HS256), image/galgame verify locally. Same secret.
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in Dokploy Environment (shared by oauth/image/galgame)}
  # OIDC asymmetric verification (docs/auth/03 Phase 1). The five resource-side
  # verifiers (galgame/image/artifact/catalog/trust) fetch the OP's JWK Set from
  # this INTERNAL url to accept ES256/RS256 tokens alongside legacy HS256.
  # Warm-up is async + failure-tolerant: before the OP has signing keys (KEK
  # unset) they just log a degraded warm-up and stay HS256-only — safe to wire
  # unconditionally. oauth itself ignores it (verifies from its local key set).
  KUN_OIDC_JWKS_URL: http://oauth:9277/oauth/jwks
  # CORS — real https web origins
  KUN_FRONTEND_CORS_ORIGIN: https://oauth.kungal.com,https://www.kungal.com,https://kungal.com,https://www.moyu.moe,https://moyu.moe
  # oauth identity URLs
  KUN_SITE_URL: https://oauth.kungal.com
  KUN_FRONTEND_URL: https://oauth.kungal.com
  # image_service S3 — Cloudflare R2 in prod (keys/endpoint from Dokploy). For
  # self-hosted MinIO set ENDPOINT=http://minio:9000 / FORCE_PATH_STYLE=true.
  # image 服务空 key/secret/bucket 会 os.Exit(1) → 崩溃重启,所以这三个 fail-fast。
  # 自托管 MinIO:ENDPOINT=http://minio:9000、key/secret=MINIO_ROOT_*、FORCE_PATH_STYLE=true。
  KUN_IMAGE_S3_ENDPOINT: ${KUN_IMAGE_S3_ENDPOINT:?R2/MinIO 端点,如 https://<acct>.r2.cloudflarestorage.com 或 http://minio:9000}
  KUN_IMAGE_S3_REGION: ${KUN_IMAGE_S3_REGION:-auto}
  KUN_IMAGE_S3_ACCESS_KEY: ${KUN_IMAGE_S3_ACCESS_KEY:?image 服务必填(空则启动即退出)}
  KUN_IMAGE_S3_SECRET_KEY: ${KUN_IMAGE_S3_SECRET_KEY:?image 服务必填}
  KUN_IMAGE_S3_BUCKET: ${KUN_IMAGE_S3_BUCKET:-kun-images}
  KUN_IMAGE_S3_FORCE_PATH_STYLE: ${KUN_IMAGE_S3_FORCE_PATH_STYLE:-false}
  KUN_IMAGE_PUBLIC_BASE_URL: https://image.kungal.iloveren.link
  KUN_IMAGE_CLIENT_BASE_URL: http://image:9278
  # artifact service B2 storage + dedicated metadata DB (host/user/pass fall back
  # to KUN_PG_* above). In the SHARED anchor — not just the artifact service —
  # because the OAUTH process needs them too: the daily artifact-gc job and the
  # admin「立即回收」(reclaim) run inside oauth, and both no-op/503 while
  # KUN_ARTIFACT_S3_ACCESS_KEY is empty (RunArtifactGC's unconfigured guard).
  KUN_ARTIFACTS_PG_DATABASE: kun_artifacts
  KUN_ARTIFACT_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
  KUN_ARTIFACT_S3_REGION: us-east-005
  KUN_ARTIFACT_S3_BUCKET: kungal-artifact-v1
  KUN_ARTIFACT_S3_ACCESS_KEY: ${KUN_ARTIFACT_S3_ACCESS_KEY:?set KUN_ARTIFACT_S3_ACCESS_KEY in Dokploy (kun-artifact-prod keyID)}
  KUN_ARTIFACT_S3_SECRET_KEY: ${KUN_ARTIFACT_S3_SECRET_KEY:?set KUN_ARTIFACT_S3_SECRET_KEY in Dokploy (kun-artifact-prod appKey)}
  KUN_ARTIFACT_S3_FORCE_PATH_STYLE: "false"
  # Optional least-privilege delete-only B2 key for GC/reclaim (docs/artifact 决策 6).
  # Empty → code falls back to the presigner key above; create the scoped key in
  # B2 and set the two vars in Dokploy when convenient.
  KUN_ARTIFACT_S3_CLEANUP_ACCESS_KEY: ${KUN_ARTIFACT_S3_CLEANUP_ACCESS_KEY:-}
  KUN_ARTIFACT_S3_CLEANUP_SECRET_KEY: ${KUN_ARTIFACT_S3_CLEANUP_SECRET_KEY:-}
  # Mail — oauth uses; PASSWORD is the only secret
  KUN_VISUAL_NOVEL_EMAIL_FROM: 鲲 Galgame OAuth
  KUN_VISUAL_NOVEL_EMAIL_HOST: tuesday.mxrouting.net
  KUN_VISUAL_NOVEL_EMAIL_PORT: "587"
  KUN_VISUAL_NOVEL_EMAIL_ACCOUNT: auth@kungal.com
  KUN_VISUAL_NOVEL_EMAIL_PASSWORD: ${KUN_VISUAL_NOVEL_EMAIL_PASSWORD:-}

services:
  # ───────────────────────── shared backing services ─────────────────────────
  postgres:
    image: postgres:18-alpine
    # Tuned for the 24 GB host (defaults are sized for a tiny box). These are the
    # version-controlled source of truth; the same values were applied live via
    # ALTER SYSTEM (work_mem / effective_cache_size / maintenance_work_mem reload
    # without a restart; shared_buffers needs one). On the next postgres restart
    # the command-line flags below take over. Rationale:
    #   shared_buffers 2GB     — PG's own page cache (default 128MB is tiny); ~8%
    #                            of host RAM, leaves plenty for OS cache + the
    #                            capped web containers. (restart-only)
    #   work_mem 64MB          — per-sort/-hash; sized for the tag-list sorts
    #                            (default 4MB spilled GBs of temp). Originally
    #                            for the wiki tag lists, whose perf indexes
    #                            retired with the family at wave 161.
    #   effective_cache_size 12GB — planner hint (no allocation); favors index scans.
    #   maintenance_work_mem 512MB — faster VACUUM / CREATE INDEX.
    #   max_connections 200    — the default 100 was exhausted on 2026-08-09 by
    #                            services running UNBOUNDED pools (catalog alone
    #                            held 66) and nothing else could connect for ~1.5h.
    #                            The pools are capped now (config.PoolConfig, 10
    #                            per pool), so this is headroom rather than the
    #                            fix: ~9 infra pools + forum/patch + the deploy's
    #                            migrate job + one-off tools. Not higher, because
    #                            work_mem is per sort node and 200 is already a
    #                            generous worst case on a 24GB host. (restart-only)
    #   superuser_reserved_connections 5 — so a saturated server can still be
    #                            DIAGNOSED. At the default 3 the incident above
    #                            locked out psql itself, including on the local
    #                            socket. (restart-only)
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - superuser_reserved_connections=5
      - -c
      - shared_buffers=2GB
      - -c
      - work_mem=64MB
      - -c
      - effective_cache_size=12GB
      - -c
      - maintenance_work_mem=512MB
    # Parallel-query dynamic shared memory lives in /dev/shm, and docker's
    # default cap is 64MB — one parallel hash join at work_mem=64MB exhausts it
    # (SQLSTATE 53100 "could not resize shared memory segment", hit 2026-07-22
    # by a catalog batch job). 1GB matches the parallel budget; costs nothing
    # when idle (tmpfs pages allocate on use). Applying requires the postgres
    # container to be RECREATED (brief DB outage) — deploy in a quiet window.
    shm_size: 1gb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in Dokploy (must match the app KUN_PG_PASSWORD / DATABASE_URL)}
      POSTGRES_DB: kun_galgame_infra
    volumes:
      - pg:/var/lib/postgresql # pg18: VOLUME moved here (was /data on <=17)
      - ./docker/initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kun_galgame_infra"]
      <<: *svc-health
      # Three services gate on this with `condition: service_healthy`, so the
      # start period has to outlast a crash-recovery boot. Failures inside it do
      # not count against `retries` and start_interval holds 2s granularity, so
      # this is strictly more tolerant than the 5s x 20 it replaces.
      start_period: 120s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    # volatile-lru, not allkeys: sessions carry no TTL and must never be
    # evicted; only TTL'd cache entries (forum nmcache, quotas) are fair game.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "1gb", "--maxmemory-policy", "volatile-lru"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *svc-health
      # redis-cli ping answers LOADING while a large appendonly file replays,
      # so redis takes the same widened start period as postgres.
      start_period: 120s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in Dokploy}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in Dokploy}
    volumes: ["minio:/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      <<: *svc-health
    restart: unless-stopped
    # Prod usually serves images from Cloudflare R2; this MinIO is only needed when
    # self-hosting blobs. Safe to leave running unused.

  # Catalog search engine (OpenSearch since 2026-09-01; Meilisearch retired
  # 2026-09-02). Image = docker/opensearch/Dockerfile, OS + icu/kuromoji/
  # pinyin analysis plugins. Security plugin stays disabled BECAUSE the port
  # never leaves the project-scoped `search` network below — do not attach this
  # service to the shared dokploy-network, that is the whole isolation model.
  opensearch:
    image: ghcr.io/next-moe/infra-opensearch:2.19.6
    environment:
      discovery.type: single-node
      cluster.name: kun-infra-os
      node.name: prod
      bootstrap.memory_lock: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI: "true"
      # ~2 GiB RSS at this heap on the full corpus (bench-measured); do not
      # raise the heap without re-measuring — 62% utilisation was the plateau.
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes: ["opensearch:/usr/share/opensearch/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9200/_cluster/health"]
      <<: *svc-health
    networks: [search]
    deploy:
      resources:
        limits:
          memory: 3g
    restart: unless-stopped

  # ───────────────────────────── Go services ─────────────────────────────────
  oauth:
    image: ghcr.io/next-moe/infra-oauth:latest
    pull_policy: always
    environment:
      <<: *infra-env
      KUN_FIBER_SERVER_HOST: 0.0.0.0
      KUN_FIBER_SERVER_PORT: "9277"
      # Image-service client for AVATAR uploads (POST /auth/me/avatar,
      # /admin/users/:uuid/avatar). Without these the oauth process builds no
      # imgClient, so the avatar route isn't even registered → 404 "无法更改头像".
      # DEDICATED client (own Dokploy vars, NOT galgame's ${KUN_IMAGE_CLIENT_ID})
      # so avatars get their own site_key + quota. The client must be
      # image_enabled with "avatar" in image_allowed_presets — set via SQL, the
      # oauth-clients admin UI does not write the image_* columns.
      KUN_IMAGE_CLIENT_ID: ${KUN_OAUTH_IMAGE_CLIENT_ID:-}
      KUN_IMAGE_CLIENT_SECRET: ${KUN_OAUTH_IMAGE_CLIENT_SECRET:-}
      # galgame-image-refping runs in THIS container's scheduler, but galgame
      # covers were uploaded under site=galgame_wiki and reference-ping is
      # site-scoped — so the job must authenticate as the galgame_wiki client,
      # not the account client above. Reuse the galgame service's existing creds
      # (.env KUN_IMAGE_CLIENT_ID/SECRET = galgame-wiki-admin); no new secret.
      # Without this the job pings as account → 0 updated / 60k not_found →
      # banners frozen → GC soft-deletes them ~365d later.
      KUN_GALGAME_IMAGE_CLIENT_ID: ${KUN_IMAGE_CLIENT_ID:-}
      KUN_GALGAME_IMAGE_CLIENT_SECRET: ${KUN_IMAGE_CLIENT_SECRET:-}
      # catalog-image-refping (daily 04:15, step 48) keeps character-portrait
      # references alive so image GC never freezes them (the 66k-freeze lesson:
      # reference-ping is site-scoped, so this MUST be the catalog image client
      # — site_key='catalog' — never the avatar/galgame ones above). Empty →
      # the job soft-skips until the client is provisioned.
      KUN_CATALOG_IMAGE_CLIENT_ID: ${KUN_CATALOG_IMAGE_CLIENT_ID:-}
      KUN_CATALOG_IMAGE_CLIENT_SECRET: ${KUN_CATALOG_IMAGE_CLIENT_SECRET:-}
      KUN_CATALOG_IMAGE_CLIENT_BASE_URL: http://image:9278
      # Same story for the news-scope sweep: the partner images we re-host are
      # written once and never touched, so only news-image-refping keeps them
      # alive — as the NEWS image client, never galgame_wiki. Empty → soft-skip.
      KUN_NEWS_IMAGE_CLIENT_ID: ${KUN_NEWS_IMAGE_CLIENT_ID:-}
      KUN_NEWS_IMAGE_CLIENT_SECRET: ${KUN_NEWS_IMAGE_CLIENT_SECRET:-}
      KUN_NEWS_IMAGE_CLIENT_BASE_URL: http://image:9278
      # 月幕 Galgame OpenAPI, for the ymgal-news poll/sweep jobs that run on this
      # scheduler host. MUST be the dedicated client 苍麟 issued us — the
      # credentials on their public developer page share one rate-limit bucket
      # with every other developer. Empty => both jobs soft-skip.
      KUN_YMGAL_CLIENT_ID: ${KUN_YMGAL_CLIENT_ID:-}
      KUN_YMGAL_CLIENT_SECRET: ${KUN_YMGAL_CLIENT_SECRET:-}
      # store-stats-sync runs in THIS container's scheduler, not catalog's. The
      # 08-26/08-29 catalog fixes put the shortlink vars only in the catalog
      # block, so this job soft-skipped hourly and store_link_daily_stats sat
      # empty while the shortener counted 3.3k real clicks (2026-08-30). The
      # first configured run backfills from the earliest mint day, so nothing
      # is lost — but every service that reads a store var needs it listed in
      # ITS OWN block. Base URL literal for the same reason as catalog's: only
      # the `shortlink-api` alias serves the S2S face.
      KUN_STORE_SHORTLINK_BASE_URL: http://shortlink-api:7845
      KUN_STORE_SHORTLINK_API_KEY: ${KUN_STORE_SHORTLINK_API_KEY:-}
      # Where the news-moderate job reaches Tier0 and the AI adviser. Both are
      # spelled out because the AI client's built-in default is 127.0.0.1:9284,
      # which resolves to this container itself rather than the ai service.
      # The job authenticates as the news image client above (same oauth_clients
      # row), and that row must carry catalog_site='news': trust and ai both
      # derive the caller's site from it and answer 403 without one.
      KUN_NEWS_TRUST_BASE_URL: http://trust:9283
      KUN_NEWS_AI_BASE_URL: http://ai:9284
      # OIDC OP signing keys (docs/auth/03 §4/§5.4). KEK encrypts the ES256/
      # RS256 private keys at rest; first boot with a KEK bootstraps the key
      # pair and turns on /oauth/jwks + discovery. Unset => bootstrap skipped,
      # endpoints absent (today's behavior). SIGN_ASYMMETRIC flips access-token
      # signing HS256 -> ES256; flip ONLY after /oauth/jwks returns 200 and all
      # five verifiers run with KUN_OIDC_JWKS_URL wired (else new tokens 401).
      KUN_OIDC_KEY_ENC_KEY: ${KUN_OIDC_KEY_ENC_KEY:-}
      KUN_OIDC_SIGN_ASYMMETRIC: ${KUN_OIDC_SIGN_ASYMMETRIC:-false}
      # Developer-platform client fence (docs/developer-platform/03). CSV of the
      # OAuth client ids allowed to reach the /dev/* self-service face with a user
      # token — set this to the developer portal's own confidential client id once
      # it is registered (the portal logs users in as that client via auth-code +
      # PKCE). Empty is fail-closed: only first-party /auth/login tokens pass, so
      # the portal's own users would be 403'd until this is set. Any OTHER
      # third-party app's user token is always 403 (confused-deputy guard).
      KUN_DEV_PORTAL_CLIENT_IDS: ${KUN_DEV_PORTAL_CLIENT_IDS:-}
    expose: ["9277"]
    labels:
      # Traefik routing for this service on oauth.kungal.com — OWNED HERE, not
      # in the Dokploy domain panel. Compose-level labels REPLACE Dokploy's
      # injected domain labels on a service (learned the hard way: adding only
      # the OIDC metadata router silently dropped the panel's /api/v1 routing
      # and 404'd the public oauth API). Every route of this service must live
      # in this block; the host catch-all (account-center web) stays in the
      # panel — its service carries no compose labels.
      traefik.enable: "true"
      # /api/v1 — the public oauth API (replaces the old panel domain rule),
      # with the same http→https redirect parity the panel generated.
      traefik.http.routers.infra-oauth-api.rule: Host(`oauth.kungal.com`) && PathPrefix(`/api/v1`)
      traefik.http.routers.infra-oauth-api.entrypoints: websecure
      traefik.http.routers.infra-oauth-api.tls.certresolver: letsencrypt
      traefik.http.routers.infra-oauth-api.service: infra-oauth
      traefik.http.routers.infra-oauth-api-http.rule: Host(`oauth.kungal.com`) && PathPrefix(`/api/v1`)
      traefik.http.routers.infra-oauth-api-http.entrypoints: web
      traefik.http.routers.infra-oauth-api-http.middlewares: redirect-to-https@file
      traefik.http.routers.infra-oauth-api-http.service: infra-oauth
      # Public OIDC metadata at the HOST ROOT (iss = https://oauth.kungal.com —
      # issuer, discovery URL, and jwks_uri must share that base). Exposes
      # exactly the two world-readable metadata paths — nothing else at the
      # root leaves the account-center web.
      traefik.http.routers.infra-oauth-oidc-meta.rule: Host(`oauth.kungal.com`) && (Path(`/oauth/jwks`) || Path(`/.well-known/openid-configuration`))
      traefik.http.routers.infra-oauth-oidc-meta.priority: "30"
      traefik.http.routers.infra-oauth-oidc-meta.entrypoints: websecure
      traefik.http.routers.infra-oauth-oidc-meta.tls.certresolver: letsencrypt
      traefik.http.routers.infra-oauth-oidc-meta.service: infra-oauth
      traefik.http.services.infra-oauth.loadbalancer.server.port: "9277"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "/app/app", "healthcheck"]
      <<: *svc-health
    networks:
      # Stable cross-project s2s name for the developer portal (its own Dokploy
      # Compose project): survives a recreation of THIS project (container-name
      # prefixes change, compose aliases don't) and is distinctive enough that
      # no other project would accidentally claim it on dokploy-network.
      #
      # The alias hangs on the `dokploy-network` KEY, not `default`: at deploy
      # time Dokploy REWRITES this file and appends `dokploy-network: {}` to a
      # routed service's networks. With the alias on `default`, the service ends
      # up on two keys resolving to the same physical network and the alias-less
      # injected key wins the single connect — the alias silently never registers
      # (bitten in production, 2026-07-23). Declaring the exact key Dokploy
      # injects makes its (existence-checked) injection a no-op and keeps the
      # alias on the one real attachment. Same physical network either way, so
      # in-stack `oauth` service-name DNS is unaffected.
      dokploy-network:
        aliases: [infra-oauth]
    restart: unless-stopped

  image:
    image: ghcr.io/next-moe/infra-image:latest
    pull_policy: always
    environment:
      <<: *infra-env
      KUN_IMAGE_SERVICE_HOST: 0.0.0.0
      KUN_IMAGE_SERVICE_PORT: "9278"
    expose: ["9278"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "/app/app", "healthcheck"]
      <<: *svc-health
    restart: unless-stopped

  # (W3, wiki retirement) The standalone galgame service (:9280) RETIRED here on
  # 2026-07-16: the catalog service below hosts the full galgame surface
  # (galgameapp.Mount, W2 — prod replay 80/80 byte-identical) and every consumer
  # was flipped to catalog:9281 and verified before removal. The `galgame` DNS
  # name is gone from dokploy-network on purpose — any straggler dialing it fails
  # loudly instead of silently misrouting. The galgame binary, its CI image
  # target, and the separate migrate-galgame entry point were removed in W5.

  artifact:
    image: ghcr.io/next-moe/infra-artifact:latest
    pull_policy: always
    environment:
      <<: *infra-env
      # The artifacts DB + B2 creds (KUN_ARTIFACTS_PG_DATABASE / KUN_ARTIFACT_S3_*)
      # come from *infra-env — shared with the oauth process (artifact-gc/reclaim).
      KUN_ARTIFACT_HOST: 0.0.0.0
      KUN_ARTIFACT_PORT: "9279"
    # In-cluster consumers (moyu/forum backends) still reach it at
    # http://artifact:9279 over dokploy-network. The one public path is the S2S
    # upload face routed below: letmoe-resource-forge runs off-box and cannot
    # join dokploy-network. Bytes still never cross this face — clients PUT
    # straight to B2 with presigned URLs, so the routed traffic is JSON only.
    expose: ["9279"]
    labels:
      # Traefik routing for the artifact S2S UPLOAD FACE on api.nextmoe.dev —
      # OWNED HERE, not in the Dokploy domain panel. Compose-level labels REPLACE
      # Dokploy's injected domain labels on a service (see the catalog block for
      # how oauth learned that). This service had zero labels and no panel
      # domain, so there was nothing to preserve — but from now on every route it
      # serves must live in this block.
      #
      # ONLY PathPrefix(`/api/v1/artifacts`) is routed. The admin face
      # (/api/v1/admin/artifact/*), /healthz and /openapi.json are deliberately
      # absent. Everything routed here sits behind the service's ClientAuth:
      # Basic client_id:secret, plus artifact_enabled and a non-empty
      # artifact_site_key on the oauth_clients row.
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.routers.infra-artifact-s2s.rule: Host(`api.nextmoe.dev`) && PathPrefix(`/api/v1/artifacts`)
      traefik.http.routers.infra-artifact-s2s.entrypoints: websecure
      traefik.http.routers.infra-artifact-s2s.tls.certresolver: letsencrypt
      traefik.http.routers.infra-artifact-s2s.service: infra-artifact-s2s
      # No http->https twin, unlike every other block here: this face carries
      # credentials on every request, and a redirect fires only after the client
      # has already put the Basic header on the wire in plaintext. Port 80
      # answering Traefik's 404 is the correct answer to a missing scheme.
      traefik.http.services.infra-artifact-s2s.loadbalancer.server.port: "9279"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      <<: *svc-health
    restart: unless-stopped

  catalog:
    image: ghcr.io/next-moe/infra-catalog:latest
    pull_policy: always
    environment:
      <<: *infra-env
      # kun_catalog DB name comes from *infra-env (KUN_CATALOG_PG_DATABASE);
      # host/user/pass fall back to KUN_PG_*. The service reads oauth_clients
      # from kun_galgame_infra for S2S Basic auth + admin JWT identities.
      KUN_CATALOG_HOST: 0.0.0.0
      KUN_CATALOG_PORT: "9281"
      # W2 (wiki retirement): this process also co-hosts the full galgame HTTP
      # surface via galgameapp.Mount, so it needs the SAME image-service +
      # catalog S2S client credentials the galgame service above gets — without
      # them the co-hosted face logs "image client not configured" and rejects
      # multipart banner uploads. Same Dokploy vars, same fallback chain.
      KUN_IMAGE_CLIENT_ID: ${KUN_IMAGE_CLIENT_ID:-}
      KUN_IMAGE_CLIENT_SECRET: ${KUN_IMAGE_CLIENT_SECRET:-}
      KUN_CATALOG_CLIENT_ID: ${KUN_CATALOG_CLIENT_ID:-${KUN_IMAGE_CLIENT_ID:-}}
      KUN_CATALOG_CLIENT_SECRET: ${KUN_CATALOG_CLIENT_SECRET:-${KUN_IMAGE_CLIENT_SECRET:-}}
      # Wave 169-E: the edit-face byte upload leg stores editor covers/
      # screenshots under the catalog SITE's image identity (the scope the
      # daily refping keeps alive) — same Dokploy vars the oauth service's
      # refping job already reads, no new secret.
      KUN_CATALOG_IMAGE_CLIENT_ID: ${KUN_CATALOG_IMAGE_CLIENT_ID:-}
      KUN_CATALOG_IMAGE_CLIENT_SECRET: ${KUN_CATALOG_IMAGE_CLIENT_SECRET:-}
      KUN_CATALOG_IMAGE_CLIENT_BASE_URL: http://image:9278
      KUN_OPENSEARCH_HOST: http://opensearch:9200
      # The /v1/news face reads kun_news from this same process (a second DB
      # connection, no second container). An unreachable kun_news degrades that
      # face to 503 and leaves catalog serving.
      KUN_NEWS_IMAGE_CLIENT_BASE_URL: http://image:9278
      # w02 (store face) first deploy 2026-08-26: the two shortlink vars were
      # set in the Dokploy panel and never reached the container — panel vars
      # only exist inside a service whose compose interpolates them. The base
      # URL is a deliberate literal: the shortener exposes its S2S face only as
      # the `shortlink-api` alias on dokploy-network (its web proxy forwards
      # /api and /s, not /s2s), so the public short-link origin is not a
      # working value here.
      KUN_STORE_SHORTLINK_BASE_URL: http://shortlink-api:7845
      KUN_STORE_SHORTLINK_API_KEY: ${KUN_STORE_SHORTLINK_API_KEY:-}
      # 2026-08-29, the same trap a second time: the affiliate templates and the
      # quota were filled in the panel alone and the redeployed container came
      # back without them. EVERY store var has to be listed here, not just the
      # two the first fix happened to need.
      KUN_STORE_DLSITE_AFF_URL_TMPL_MANIAX: ${KUN_STORE_DLSITE_AFF_URL_TMPL_MANIAX:-}
      KUN_STORE_DLSITE_AFF_URL_TMPL_PRO: ${KUN_STORE_DLSITE_AFF_URL_TMPL_PRO:-}
      KUN_STORE_PRICE_ENABLED: ${KUN_STORE_PRICE_ENABLED:-true}
      KUN_STORE_PRICE_USER_AGENT: "${KUN_STORE_PRICE_USER_AGENT:-NextMoe-PriceBot/1.0 (+https://www.kungal.com)}"
      KUN_STORE_PRICE_STEAM_REGIONS: ${KUN_STORE_PRICE_STEAM_REGIONS:-jp,cn,us}
      KUN_STORE_PRICE_DLSITE_CURRENCIES: ${KUN_STORE_PRICE_DLSITE_CURRENCIES:-CNY,USD,TWD,HKD,KRW,EUR}
      KUN_STORE_PRICE_DLSITE_BASE: ${KUN_STORE_PRICE_DLSITE_BASE:-}
      KUN_STORE_PRICE_DLSITE_PROXY: ${KUN_STORE_PRICE_DLSITE_PROXY:-}
    # S2S read/admin face stays internal — product backends (wiki/forum/moyu)
    # reach it at http://catalog:9281 over dokploy-network. The ONLY public path
    # is the open-API /v1/catalog projection routed by the labels block below.
    expose: ["9281"]
    labels:
      # Traefik routing for the NextMoe OPEN-API PUBLIC FACE on api.nextmoe.dev —
      # OWNED HERE, not in the Dokploy domain panel. Compose-level labels REPLACE
      # Dokploy's injected domain labels on a service (oauth learned this the hard
      # way: adding one router silently dropped the panel's routing → 404). This
      # service used to be internal-only (zero labels), so there is nothing to
      # preserve — but from now on every route it serves must live in this block.
      # ONLY PathPrefix(`/v1/catalog`) is routed here; the host's other paths do
      # NOT reach this service, and the internal read/S2S face never touches the
      # api.nextmoe.dev domain (it stays on http://catalog:9281 / dokploy-network).
      traefik.enable: "true"
      # /v1/catalog — the open-API catalog public projection (websecure + LE),
      # with the same http→https redirect twin the oauth block carries.
      traefik.http.routers.infra-catalog-pub.rule: Host(`api.nextmoe.dev`) && PathPrefix(`/v1/catalog`)
      traefik.http.routers.infra-catalog-pub.entrypoints: websecure
      traefik.http.routers.infra-catalog-pub.tls.certresolver: letsencrypt
      traefik.http.routers.infra-catalog-pub.service: infra-catalog-pub
      traefik.http.routers.infra-catalog-pub-http.rule: Host(`api.nextmoe.dev`) && PathPrefix(`/v1/catalog`)
      traefik.http.routers.infra-catalog-pub-http.entrypoints: web
      traefik.http.routers.infra-catalog-pub-http.middlewares: redirect-to-https@file
      traefik.http.routers.infra-catalog-pub-http.service: infra-catalog-pub
      # /v1/galgame — moved here from the galgame block (W3): the open-API
      # galgame projection was served by THIS process (galgameapp.Mount, W2).
      # Same router names as before, now targeting the shared infra-catalog-pub
      # loadbalancer (:9281) — two routers, one service.
      #
      # The projection itself was DELISTED at wave 146 (2026-07-30) and the
      # prefix now answers 410 Gone. These routers deliberately STAY: without
      # them Traefik would answer its own 404 for the whole prefix, and a stale
      # client would learn "wrong path" instead of "this face was retired, here
      # is the successor". Retiring them is a separate, later decision.
      traefik.http.routers.infra-galgame-pub.rule: Host(`api.nextmoe.dev`) && PathPrefix(`/v1/galgame`)
      traefik.http.routers.infra-galgame-pub.entrypoints: websecure
      traefik.http.routers.infra-galgame-pub.tls.certresolver: letsencrypt
      traefik.http.routers.infra-galgame-pub.service: infra-catalog-pub
      traefik.http.routers.infra-galgame-pub-http.rule: Host(`api.nextmoe.dev`) && PathPrefix(`/v1/galgame`)
      traefik.http.routers.infra-galgame-pub-http.entrypoints: web
      traefik.http.routers.infra-galgame-pub-http.middlewares: redirect-to-https@file
      traefik.http.routers.infra-galgame-pub-http.service: infra-catalog-pub
      # The infra-wiki-api routers (wiki.kungal.com/api → this service) were
      # RETIRED here in open-api phase 2 wave 05 (A3): every consumer reads the
      # internal devapi face over the docker network, and a 15.5h production log
      # necropsy found zero external consumers on the domain (1 Googlebot probe).
      # The wiki.kungal.com DNS record is removed separately (user action, C5).
      # /v1/news — the partner news feed, served by this same process. A new
      # public prefix on this service reaches nobody until it is routed HERE:
      # the labels block replaces Dokploy's injected labels wholesale, so a
      # prefix absent from it 404s at Traefik, not at the app.
      traefik.http.routers.infra-news-pub.rule: Host(`api.nextmoe.dev`) && PathPrefix(`/v1/news`)
      traefik.http.routers.infra-news-pub.entrypoints: websecure
      traefik.http.routers.infra-news-pub.tls.certresolver: letsencrypt
      traefik.http.routers.infra-news-pub.service: infra-catalog-pub
      traefik.http.routers.infra-news-pub-http.rule: Host(`api.nextmoe.dev`) && PathPrefix(`/v1/news`)
      traefik.http.routers.infra-news-pub-http.entrypoints: web
      traefik.http.routers.infra-news-pub-http.middlewares: redirect-to-https@file
      traefik.http.routers.infra-news-pub-http.service: infra-catalog-pub
      # /v1/store — the DLsite distribution face (w02) shipped without claiming
      # its prefix here despite the warning three comments up; post-deploy
      # probes on 2026-08-26 answered Traefik's own "404 page not found".
      # Reachability only; the face's key + store:read gate is the access
      # control.
      traefik.http.routers.infra-store-pub.rule: Host(`api.nextmoe.dev`) && PathPrefix(`/v1/store`)
      traefik.http.routers.infra-store-pub.entrypoints: websecure
      traefik.http.routers.infra-store-pub.tls.certresolver: letsencrypt
      traefik.http.routers.infra-store-pub.service: infra-catalog-pub
      traefik.http.routers.infra-store-pub-http.rule: Host(`api.nextmoe.dev`) && PathPrefix(`/v1/store`)
      traefik.http.routers.infra-store-pub-http.entrypoints: web
      traefik.http.routers.infra-store-pub-http.middlewares: redirect-to-https@file
      traefik.http.routers.infra-store-pub-http.service: infra-catalog-pub
      # /v1/playtime — documented on the developer portal since launch, but no
      # router ever claimed the prefix. Probes on 2026-08-17 answered Traefik's
      # own "404 page not found". Reachability only; the face's JWT gate is the
      # access control.
      traefik.http.routers.infra-playtime-pub.rule: Host(`api.nextmoe.dev`) && PathPrefix(`/v1/playtime`)
      traefik.http.routers.infra-playtime-pub.entrypoints: websecure
      traefik.http.routers.infra-playtime-pub.tls.certresolver: letsencrypt
      traefik.http.routers.infra-playtime-pub.service: infra-catalog-pub
      traefik.http.routers.infra-playtime-pub-http.rule: Host(`api.nextmoe.dev`) && PathPrefix(`/v1/playtime`)
      traefik.http.routers.infra-playtime-pub-http.entrypoints: web
      traefik.http.routers.infra-playtime-pub-http.middlewares: redirect-to-https@file
      traefik.http.routers.infra-playtime-pub-http.service: infra-catalog-pub
      # /api/v1/user/catalog — Traefik grants reachability only; auth stays in
      # the face's own gate chain (JWT + catalog:edit + client-bound tenant).
      # The whole prefix is routed so the list cannot drift. S2S
      # (/api/v1/catalog) and admin stay unrouted on purpose.
      traefik.http.routers.infra-user-catalog-pub.rule: Host(`api.nextmoe.dev`) && PathPrefix(`/api/v1/user/catalog`)
      traefik.http.routers.infra-user-catalog-pub.entrypoints: websecure
      traefik.http.routers.infra-user-catalog-pub.tls.certresolver: letsencrypt
      traefik.http.routers.infra-user-catalog-pub.service: infra-catalog-pub
      traefik.http.routers.infra-user-catalog-pub-http.rule: Host(`api.nextmoe.dev`) && PathPrefix(`/api/v1/user/catalog`)
      traefik.http.routers.infra-user-catalog-pub-http.entrypoints: web
      traefik.http.routers.infra-user-catalog-pub-http.middlewares: redirect-to-https@file
      traefik.http.routers.infra-user-catalog-pub-http.service: infra-catalog-pub
      # /v2 — public API v2 (preview). One prefix covers catalog, news, me,
      # moderation, problems and vocabularies; all live on this process.
      traefik.http.routers.infra-v2-pub.rule: Host(`api.nextmoe.dev`) && PathPrefix(`/v2`)
      traefik.http.routers.infra-v2-pub.entrypoints: websecure
      traefik.http.routers.infra-v2-pub.tls.certresolver: letsencrypt
      traefik.http.routers.infra-v2-pub.service: infra-catalog-pub
      traefik.http.routers.infra-v2-pub-http.rule: Host(`api.nextmoe.dev`) && PathPrefix(`/v2`)
      traefik.http.routers.infra-v2-pub-http.entrypoints: web
      traefik.http.routers.infra-v2-pub-http.middlewares: redirect-to-https@file
      traefik.http.routers.infra-v2-pub-http.service: infra-catalog-pub
      traefik.http.services.infra-catalog-pub.loadbalancer.server.port: "9281"
    depends_on:
      postgres: { condition: service_healthy }
      opensearch: { condition: service_healthy } # catalog search
      migrate: { condition: service_completed_successfully }         # reads oauth_clients from kun_galgame_infra
      # migrate-catalog owns the catalog schema this process serves (it also
      # carried the galgame wiki family until wave 161 retired it). This gate is
      # what keeps the deploy-migration-gap closed — without a dependent, the
      # migration job never runs on deploy.
      migrate-catalog: { condition: service_completed_successfully }
      # Same gate for the news schema this process also serves.
      migrate-news: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      <<: *svc-health
    networks: [default, search]
    restart: unless-stopped

  # Community primitive (kun_community). The multi-tenant discussion service the
  # product backends (letmoe first) reach over S2S; it reads oauth_clients from
  # kun_galgame_infra for S2S Basic auth + the per-client `catalog_site` tenant.
  community:
    image: ghcr.io/next-moe/infra-community:latest
    pull_policy: always
    environment:
      <<: *infra-env
      # kun_community DB name comes from *infra-env (KUN_COMMUNITY_PG_DATABASE);
      # host/user/pass fall back to KUN_PG_*.
      KUN_COMMUNITY_HOST: 0.0.0.0
      KUN_COMMUNITY_PORT: "9282"
      # Trust wiring (step 03; POWERED ON 2026-07-16 Tier0 runbook). The client id
      # is the purpose-built "Community Trust Forwarder (S2S)" oauth_clients row;
      # its secret lives ONLY in Dokploy env (KUN_TRUST_CLIENT_SECRET — plaintext
      # staged in /root/community-trust-client-secret.txt on the host, hash already
      # in the DB). Callback secret stays empty until enforcement callbacks are
      # provisioned (inbound callbacks 401 = fail-closed). Base URL defaults to
      # http://trust:9283 (dokploy-network service name).
      KUN_TRUST_CLIENT_ID: "ac2b8856594baed9c9ee6792eec082e3"
      KUN_TRUST_CLIENT_SECRET: ${KUN_TRUST_CLIENT_SECRET:-}
      KUN_TRUST_CALLBACK_SECRET: ${KUN_TRUST_CALLBACK_SECRET:-}
    # Internal only — product backends (letmoe/...) reach it at
    # http://community:9282 over dokploy-network.
    expose: ["9282"]
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }           # reads oauth_clients from kun_galgame_infra
      migrate-community: { condition: service_completed_successfully }  # kun_community schema
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      <<: *svc-health
    restart: unless-stopped

  # Trust & Safety platform (kun_trust). Universal report intake + the unified
  # review inbox; product backends (kungal first) reach it over S2S. It reads
  # oauth_clients from kun_galgame_infra for S2S Basic auth + the per-client
  # `catalog_site` tenant, and users/roles for the reporter-weight lookup. A
  # background goroutine dispatches enforcement callbacks (HMAC + retry + dead-letter).
  trust:
    image: ghcr.io/next-moe/infra-trust:latest
    pull_policy: always
    environment:
      <<: *infra-env
      # kun_trust DB name comes from *infra-env (KUN_TRUST_PG_DATABASE);
      # host/user/pass fall back to KUN_PG_*.
      KUN_TRUST_HOST: 0.0.0.0
      KUN_TRUST_PORT: "9283"
      # Forward-face allowlist (step 03 ruling 3): comma-separated client ids
      # permitted to relay for other sites on the forward/scan/check faces (wire
      # `site` + this allowlist as the counterweight). Set 2026-07-16 (Tier0
      # power-on) to the community service's client id — the same value as the
      # community block's KUN_TRUST_CLIENT_ID.
      KUN_TRUST_FORWARDER_CLIENT_IDS: "ac2b8856594baed9c9ee6792eec082e3"
      # AI shadow-scoring pipeline (step 03; wired 2026-07-16 AI-tier power-on):
      # the scan worker scores pending trust_scan_result rows via the AI gateway's
      # moderate-text route over S2S Basic. The client is the purpose-built
      # "AI Gateway - Trust Scan Worker" oauth_clients row (catalog_site=trust —
      # the gateway 403s clients without a site binding, so the community forwarder
      # client can NOT be reused here). Its secret lives ONLY in Dokploy env
      # (plaintext staged in /root/trust-ai-client-secret.txt on the host, hash in
      # the DB). SECRET empty → the worker keeps draining rows to degraded without
      # dialing (fail-closed) — tier0_matched still records.
      KUN_AI_CLIENT_BASE_URL: http://ai:9284
      KUN_AI_CLIENT_ID: "ba21dfba94274c134e01ede5eaa7c391"
      KUN_AI_CLIENT_SECRET: ${KUN_AI_CLIENT_SECRET:-}
      # Share of CLEAN verdicts drawn into the human queue as calibration items
      # (source=6). This is the ONLY instrument that measures false negatives —
      # what the pipeline misses is otherwise invisible, since a subject nobody
      # flags produces no evidence of its own. Default 0 (off): it spends human
      # review capacity, so turning it on is a deliberate act. Capped at 0.05 in
      # code; anything higher or negative degrades to off. It must be named here
      # to reach the container at all — compose forwards only the variables it
      # lists (2026-08-06: a panel-only KUN_TRUST_SCAN_MODE=live was a silent
      # no-op).
      KUN_TRUST_SCAN_SAMPLE_RATE: ${KUN_TRUST_SCAN_SAMPLE_RATE:-0}
    # Internal only — product backends reach it at http://trust:9283 over
    # dokploy-network.
    expose: ["9283"]
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }        # reads oauth_clients from kun_galgame_infra
      migrate-trust: { condition: service_completed_successfully }  # kun_trust schema
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      <<: *svc-health
    restart: unless-stopped

  # AI-gateway semantic layer (kun_ai). Fronts all ecosystem AI calls behind
  # named routes (v0: moderate-text), holds the upstream credential single-point,
  # meters per tenant×route usage, and enforces per-route daily budget fuses. It
  # reads oauth_clients from kun_galgame_infra for S2S Basic auth + the per-client
  # `catalog_site` tenant. Its ONLY view of the channel layer is the two upstream
  # envs below; empty (the default) = degraded mode: moderate-text is fail-open
  # (never blocks) and the service starts fine WITHOUT a channel layer (doc 20 §9).
  ai:
    image: ghcr.io/next-moe/infra-ai:latest
    pull_policy: always
    environment:
      <<: *infra-env
      # kun_ai DB name comes from *infra-env (KUN_AI_PG_DATABASE); host/user/pass
      # fall back to KUN_PG_*.
      KUN_AI_HOST: 0.0.0.0
      KUN_AI_PORT: "9284"
      # Tier2 LLM upstream (one-api/new-api or a direct dpsk/mimo key). Default
      # empty = that tier off (fail-open, no upstream dialled). Set both in Dokploy
      # when the LLM tier is ready; KUN_AI_UPSTREAM_MODEL is the moderate-text
      # route→model mapping.
      KUN_AI_UPSTREAM_BASE_URL: ${KUN_AI_UPSTREAM_BASE_URL:-}
      KUN_AI_UPSTREAM_TOKEN: ${KUN_AI_UPSTREAM_TOKEN:-}
      KUN_AI_UPSTREAM_MODEL: ${KUN_AI_UPSTREAM_MODEL:-deepseek-chat}
      # Tier1 omni-moderation coarse pass (spec 09). KUN_AI_OMNI_TOKEN empty (the
      # default) = Tier1 off: moderate-text runs the Tier2 LLM path only. Fill the
      # token in Dokploy (plaintext staged at kungal-neo:/root/openai-omni-api-key.txt)
      # to light Tier1 up; base URL / model default to OpenAI's public API.
      KUN_AI_OMNI_BASE_URL: ${KUN_AI_OMNI_BASE_URL:-https://api.openai.com}
      KUN_AI_OMNI_TOKEN: ${KUN_AI_OMNI_TOKEN:-}
      KUN_AI_OMNI_MODEL: ${KUN_AI_OMNI_MODEL:-omni-moderation-latest}
      # Tier1→Tier2 cascade tuning (spec 09 ruling 3). relevantScore ≥ threshold
      # → LLM final adjudication; below-threshold verdicts are LLM-sampled at the
      # negative rate for shadow calibration (only when the LLM tier is configured).
      KUN_AI_ESCALATE_THRESHOLD: ${KUN_AI_ESCALATE_THRESHOLD:-0.4}
      KUN_AI_NEGATIVE_SAMPLE_RATE: ${KUN_AI_NEGATIVE_SAMPLE_RATE:-0.05}
    # Internal only — product/platform backends reach it at http://ai:9284 over
    # dokploy-network.
    expose: ["9284"]
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }     # reads oauth_clients from kun_galgame_infra
      migrate-ai: { condition: service_completed_successfully }  # kun_ai schema
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      <<: *svc-health
    restart: unless-stopped

  # ───────────────────────────── Nuxt frontends ──────────────────────────────
  # Public (browser) config is BAKED into the image at CI build time (build-args in
  # .github/workflows/build.yml). Only the SSR base (service name) is injected here.
  web:
    image: ghcr.io/next-moe/infra-web:latest
    pull_policy: always
    environment:
      NUXT_API_BASE_SSR: http://oauth:9277/api/v1
      NUXT_CATALOG_API_BASE_SSR: http://catalog:9281/api/v1
      NUXT_TRUST_API_BASE_SSR: http://trust:9283/api/v1
      NUXT_AI_API_BASE_SSR: http://ai:9284/api/v1
    expose: ["3000"]
    depends_on:
      oauth: { condition: service_started }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      <<: *svc-health
    restart: unless-stopped
    # Safety cap for the upstream Nuxt 4.2.2 SSR leak (nuxt#34071). infra-web
    # (oauth frontend) is low-traffic (~75 MiB working set), so 1g is generous
    # headroom; it just prevents an unbounded leak from starving the box, OOM-
    # recycling via restart: unless-stopped if it ever grows that far.
    deploy:
      resources:
        limits:
          memory: 1g

  # wiki (apps/wiki galgame-wiki frontend on wiki.kungal.com) RETIRED at E3b/W4;
  # the last /api router on that host (infra-wiki-api) RETIRED at open-api
  # phase 2 wave 05 (A3) — wiki.kungal.com now serves nothing and its DNS record
  # is removed separately (C5, user action). The galgame-wiki-admin OAuth client
  # is kept (image site-key identity rule — NOT a data-API artifact).
  # Recovery: git revert + ghcr.io/kunmoe/infra-wiki:latest still in GHCR
  # (retired image, never republished under next-moe).

  # developer (NextMoe developer portal on developer.nextmoe.dev) MOVED OUT of this
  # stack into its OWN Dokploy "Compose" project — see docker-compose.developer.yml.
  # It deploys MANUALLY, independent of this stack's push→CI→auto-redeploy webhook,
  # so portal releases don't ride the main cadence. Routing stays compose-owned in
  # that file (labels, never the Dokploy domain panel); its /api/** relay reaches
  # oauth by EXACT container name (cross-project bare aliases round-robin).
  # Recovery: the full service block lives on in docker-compose.developer.yml;
  # image unchanged (ghcr.io/next-moe/infra-developer:latest, still in GHCR).

  # ─── schema migrations (auto-run on deploy) + one-off jobs (profile: jobs) ───
  # The migrate-* jobs below are NOT in the jobs profile — they run on every
  # `up` and gate the services. Only `tools` (data cutover) stays manual.
  # Auto-applied on every deploy: dependent services wait for this to complete
  # (depends_on: service_completed_successfully) so no service ever serves an
  # un-migrated schema — this is what closes the "deploy doesn't run migrate →
  # silent column drift" gap. cmd/migrate is idempotent + additive-only
  # (AutoMigrate, CREATE INDEX IF NOT EXISTS, existence-guarded seeds), so a
  # per-deploy re-run is a fast no-op when nothing changed. Built in lockstep
  # with the go services (build.yml), so :latest never lags the code.
  # Manual run still works: docker compose -f docker-compose.prod.yml run --rm migrate
  migrate:
    image: ghcr.io/next-moe/infra-migrate:latest
    pull_policy: always
    environment: { <<: *infra-env }
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # Auto-applied on every deploy (catalog waits for it). The migration entry
  # point for the catalog models via KUN_CATALOG_PG_DATABASE. Idempotent:
  # AutoMigrate + guarded raw-SQL (constraints, indexes, generated columns, FKs
  # — all IF NOT EXISTS / drop-then-add) + seed upserts.
  #
  # It absorbed cmd/migrate-galgame at W5 and re-created the 27 wiki tables on
  # every deploy; wave 161 deleted that half. KUN_GALGAME_PG_DATABASE is no
  # longer read by this job — had it stayed, the deploy after the N5 DROP would
  # have recreated the whole family as empty shells.
  migrate-catalog:
    image: ghcr.io/next-moe/infra-migrate:latest
    command: ["catalog"]
    pull_policy: always
    environment: { <<: *infra-env }
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # Auto-applied on every deploy (community waits for it). `migrate community`
  # is the single migration entry point against kun_community (the service itself
  # never migrates on startup).
  migrate-community:
    image: ghcr.io/next-moe/infra-migrate:latest
    command: ["community"]
    pull_policy: always
    environment: { <<: *infra-env }
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # Auto-applied on every deploy (trust waits for it). `migrate trust` is the
  # single migration entry point against kun_trust (the service never migrates
  # on startup); idempotent AutoMigrate + raw SQL + reason seed.
  migrate-trust:
    image: ghcr.io/next-moe/infra-migrate:latest
    command: ["trust"]
    pull_policy: always
    environment: { <<: *infra-env }
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # Auto-applied on every deploy (ai waits for it). `migrate ai` is the single
  # migration entry point against kun_ai (the service never migrates on startup);
  # idempotent AutoMigrate + CREATE INDEX IF NOT EXISTS, no seed.
  migrate-ai:
    image: ghcr.io/next-moe/infra-migrate:latest
    command: ["ai"]
    pull_policy: always
    environment: { <<: *infra-env }
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # Auto-applied on every deploy (catalog waits for it, because catalog serves
  # the /v1/news face). `migrate news` is the single migration entry point
  # against kun_news: idempotent AutoMigrate + IF NOT EXISTS raw section + the
  # news_source seed. ⚠️ kun_news must EXIST first — the first deploy needs a
  # manual `CREATE DATABASE kun_news` (initdb only runs on an empty data dir).
  migrate-news:
    image: ghcr.io/next-moe/infra-migrate:latest
    command: ["news"]
    pull_policy: always
    environment: { <<: *infra-env }
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # All cmd/* binaries (data cutover). Run a job by name (see 16-data-cutover.md):
  #   docker compose -f docker-compose.prod.yml --profile jobs run --rm tools reindex-catalog --batch=5000
  #   docker compose -f docker-compose.prod.yml --profile jobs run --rm tools migrate-moemoepoint
  tools:
    image: ghcr.io/next-moe/infra-tools:latest
    pull_policy: always
    environment: { <<: *infra-env }
    profiles: ["jobs"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

volumes:
  pg:
  redis:
  minio:
  opensearch:

networks:
  default:
    name: dokploy-network
    external: true
  # Project-scoped, no external reach: the only members are opensearch and the
  # catalog service. No explicit name, so the runtime name carries the Dokploy
  # project prefix (kun-visual-novel-infra-vqvqbc_search), not this file's
  # basename. The prod reindex cron does not join this network by name — it
  # joins the catalog container's netns (--network container:<catalog>), which
  # reaches postgres and opensearch at once.
  search:
    internal: true
  # Same physical network under the key Dokploy injects at deploy time — must
  # exist so the oauth service can hang its cross-project alias on that key
  # (see the oauth networks block for the full story).
  dokploy-network:
    name: dokploy-network
    external: true
