components:
  schemas:
    AccessKeyInput:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/AccessKeyInput.json
          format: uri
          readOnly: true
          type: string
        allowed_models:
          items:
            type: string
          maxItems: 64
          type: array
        daily_budget_micro:
          format: int64
          minimum: 0
          type: integer
        enabled:
          type: boolean
        name:
          maxLength: 64
          type: string
      type: object
    AccessKeyView:
      additionalProperties: false
      properties:
        allowed_models:
          items:
            type: string
          type: array
        created_at:
          format: date-time
          type: string
        daily_budget_micro:
          description: Micro-USD this key may spend per day (China Standard Time); 0 is unlimited.
          format: int64
          type: integer
        enabled:
          type: boolean
        id:
          format: int64
          type: integer
        last_used_at:
          format: date-time
          type:
            - string
            - "null"
        name:
          type: string
        prefix:
          type: string
        spent_today_nano:
          format: int64
          type: integer
      required:
        - id
        - name
        - prefix
        - allowed_models
        - enabled
        - daily_budget_micro
        - spent_today_nano
        - last_used_at
        - created_at
      type: object
    AdoptInput:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/AdoptInput.json
          format: uri
          readOnly: true
          type: string
        kind:
          description: Defaults to the catalog kind.
          enum:
            - chat
            - embedding
            - moderation
            - search
            - image
          type: string
        model_key:
          description: Gateway model to attach the route to; created when missing. Defaults to the upstream id, lower-cased with / turned into -.
          maxLength: 64
          type: string
        price:
          $ref: "#/components/schemas/Price"
        priority:
          format: int64
          type: integer
        weight:
          format: int64
          maximum: 10000
          minimum: 1
          type: integer
      type: object
    AdoptResult:
      additionalProperties: false
      properties:
        model:
          $ref: "#/components/schemas/ModelView"
        model_created:
          type: boolean
        route:
          $ref: "#/components/schemas/RouteView"
      required:
        - model
        - route
        - model_created
      type: object
    BudgetView:
      additionalProperties: false
      properties:
        daily_cost_cap_micro:
          format: int64
          type:
            - integer
            - "null"
        route:
          type: string
        site:
          type: string
        updated_at:
          type: string
      required:
        - route
        - site
        - daily_cost_cap_micro
        - updated_at
      type: object
    CatalogProbe:
      additionalProperties: false
      properties:
        at:
          format: date-time
          type: string
        error_kind:
          type: string
        kind:
          type: string
        latency_ms:
          format: int64
          type: integer
        message:
          type: string
        ok:
          type: boolean
      required:
        - kind
        - ok
        - latency_ms
        - error_kind
        - message
        - at
      type: object
    CatalogRoute:
      additionalProperties: false
      properties:
        model_key:
          type: string
        route_id:
          format: int64
          type: integer
        status:
          enum:
            - active
            - disabled
          type: string
      required:
        - route_id
        - model_key
        - status
      type: object
    ConfigAccessKey:
      additionalProperties: false
      properties:
        allowed_models:
          items:
            type: string
          type:
            - array
            - "null"
        daily_budget_micro:
          format: int64
          type: integer
        enabled:
          type: boolean
        name:
          type: string
      required:
        - name
        - allowed_models
        - enabled
        - daily_budget_micro
      type: object
    ConfigModel:
      additionalProperties: false
      properties:
        context_tokens:
          format: int64
          type: integer
        enabled:
          type: boolean
        key:
          type: string
        kind:
          type: string
        max_output:
          format: int64
          type: integer
        reasoning:
          type: boolean
        tool_call:
          type: boolean
        vision:
          type: boolean
      required:
        - key
        - kind
        - context_tokens
        - max_output
        - tool_call
        - vision
        - reasoning
        - enabled
      type: object
    ConfigProvider:
      additionalProperties: false
      properties:
        base_url:
          type: string
        enabled:
          type: boolean
        headers:
          additionalProperties:
            type: string
          type: object
        name:
          type: string
        price_multiplier_ppm:
          format: int64
          type: integer
      required:
        - name
        - base_url
        - headers
        - price_multiplier_ppm
        - enabled
      type: object
    ConfigRoute:
      additionalProperties: false
      properties:
        max_in_flight:
          format: int64
          type: integer
        model:
          type: string
        price:
          anyOf:
            - $ref: "#/components/schemas/Price"
            - type: "null"
        priority:
          format: int64
          type: integer
        provider:
          type: string
        rpm:
          format: int64
          type: integer
        status:
          type: string
        thinking_control:
          type: string
        upstream_id:
          type: string
        weight:
          format: int64
          type: integer
      required:
        - model
        - provider
        - upstream_id
        - priority
        - weight
        - status
        - max_in_flight
        - rpm
        - price
      type: object
    ConfigScene:
      additionalProperties: false
      properties:
        class:
          type: string
        content_fallback:
          items:
            type: string
          type:
            - array
            - "null"
        context_fallback:
          items:
            type: string
          type:
            - array
            - "null"
        daily_budget_micro:
          format: int64
          type: integer
        fallbacks:
          items:
            type: string
          type:
            - array
            - "null"
        idle_ms:
          format: int64
          type: integer
        key:
          type: string
        max_output:
          format: int64
          type: integer
        model:
          type: string
        reasoning:
          type: string
        strategy:
          type: string
        temperature:
          format: double
          type:
            - number
            - "null"
        total_ms:
          format: int64
          type: integer
        ttft_ms:
          format: int64
          type: integer
      required:
        - key
        - model
        - fallbacks
        - context_fallback
        - content_fallback
        - strategy
        - daily_budget_micro
        - class
        - temperature
        - max_output
        - ttft_ms
        - idle_ms
