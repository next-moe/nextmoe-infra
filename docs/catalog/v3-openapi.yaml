info:
  title: NextMoe Catalog v3
  version: 0.1.0
openapi: 3.1.0
paths:
  /v3/catalog/changes:
    get:
      description: Every committed change in order, named by the public entity it shows on. Mirrors and indexes follow it and refetch the entity.
      operationId: listChanges
      parameters:
        - description: next_cursor of the previous page; empty starts from the beginning.
          explode: false
          in: query
          name: cursor
          schema:
            description: next_cursor of the previous page; empty starts from the beginning.
            type: string
        - description: Only changes shown on this kind of entity.
          explode: false
          in: query
          name: entity
          schema:
            description: Only changes shown on this kind of entity.
            enum:
              - work
              - work_part
              - release
              - person
              - org
              - ""
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 100
            format: int64
            maximum: 500
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeList"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Change feed
      tags:
        - changes
  /v3/catalog/commits:
    post:
      description: "Needs canon.edit. The values are yours: agents may only propose others. A new work, name or organization resembling an existing one answers 409 IDENTITY_UNSURE with the candidates."
      operationId: commitChanges
      parameters:
        - description: Bearer access token; each operation names the canon permission it needs.
          in: header
          name: Authorization
          schema:
            description: Bearer access token; each operation names the canon permission it needs.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditOutputBody"
          description: Created
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Write a set of changes, all or none
      tags:
        - editing
  /v3/catalog/commits/{batch}/undo:
    post:
      description: Needs canon.edit. Restores every field it changed and removes what it created; refused when anything was written, referenced or kept by a user since. Fields you restore are locked against agents.
      operationId: undoCommit
      parameters:
        - description: Bearer access token; each operation names the canon permission it needs.
          in: header
          name: Authorization
          schema:
            description: Bearer access token; each operation names the canon permission it needs.
            type: string
        - in: path
          name: batch
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UndoInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoneOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Take back a commit
      tags:
        - editing
  /v3/catalog/lookup:
    get:
      description: Needs canon.edit. Matches titles, person names or organization names, exact first.
      operationId: lookupNames
      parameters:
        - description: Bearer access token; each operation names the canon permission it needs.
          in: header
          name: Authorization
          schema:
            description: Bearer access token; each operation names the canon permission it needs.
            type: string
        - explode: false
          in: query
          name: entity
          required: true
          schema:
            enum:
              - work
              - person
              - person_alias
              - org
            type: string
        - explode: false
          in: query
          name: q
          required: true
          schema:
            maxLength: 100
            minLength: 1
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 15
            format: int64
            maximum: 50
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LookupOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Find what to cite by name
      tags:
        - editing
  /v3/catalog/merges:
    post:
      description: Needs canon.merge. The loser's id redirects to the survivor; undoing restores both.
      operationId: mergeEntities
      parameters:
        - description: Bearer access token; each operation names the canon permission it needs.
          in: header
          name: Authorization
          schema:
            description: Bearer access token; each operation names the canon permission it needs.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedOutputBody"
          description: Created
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Merge two entities into one
      tags:
        - curation
  /v3/catalog/merges/{id}/undo:
    post:
      description: Needs canon.merge.
      operationId: undoMerge
      parameters:
        - description: Bearer access token; each operation names the canon permission it needs.
          in: header
          name: Authorization
          schema:
            description: Bearer access token; each operation names the canon permission it needs.
            type: string
        - in: path
          name: id
          required: true
          schema:
            format: int64
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoneOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Undo a merge
      tags:
        - curation
  /v3/catalog/orgs:
    get:
      operationId: listOrgs
      parameters:
        - description: Only organizations of this kind.
          explode: false
          in: query
          name: kind
          schema:
            description: Only organizations of this kind.
            enum:
              - company
              - brand
              - label
              - magazine
              - platform
              - circle
              - translation_group
              - ""
            type: string
        - description: Comma-separated ids, at most 100; does not paginate.
          explode: false
          in: query
          name: ids
          schema:
            description: Comma-separated ids, at most 100; does not paginate.
            type: string
        - explode: false
          in: query
          name: cursor
          schema:
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 100
            format: int64
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgList"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "422":
