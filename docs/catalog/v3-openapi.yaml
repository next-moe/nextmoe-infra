components:
  schemas:
    Alias:
      additionalProperties: false
      properties:
        id:
          type: string
        lang:
          type: string
        latin:
          type: string
        name:
          type: string
      required:
        - id
        - name
        - latin
        - lang
      type: object
    AliasRef:
      additionalProperties: false
      properties:
        id:
          description: The person alias id; legacy credit-name ids are alias ids (D19).
          type: string
        latin:
          type: string
        name:
          type: string
        person_id:
          type: string
      required:
        - id
        - name
        - latin
        - person_id
      type: object
    BookRelease:
      additionalProperties: false
      properties:
        isbn13:
          type:
            - string
            - "null"
        jan:
          type:
            - string
            - "null"
        label_id:
          type:
            - string
            - "null"
        label_number:
          type: string
        pages:
          format: int64
          type:
            - integer
            - "null"
        publisher_id:
          type:
            - string
            - "null"
      required:
        - isbn13
        - jan
        - label_number
        - pages
        - publisher_id
        - label_id
      type: object
    BookWork:
      additionalProperties: false
      properties:
        category:
          type: string
      required:
        - category
      type: object
    Change:
      additionalProperties: false
      properties:
        action:
          description: create, update, undo, remove, merged_into, absorbed, unmerge, takedown or restore.
          type: string
        at:
          format: date-time
          type: string
        entity:
          description: "The public entity the change shows on: a title edit names its work."
          type: string
        entity_id:
          type: string
        seq:
          type: string
      required:
        - seq
        - entity
        - entity_id
        - action
        - at
      type: object
    ChangeList:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ChangeList.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/Change"
          type:
            - array
            - "null"
        next_cursor:
          description: Always set; poll with it to follow the feed.
          type: string
      required:
        - items
        - next_cursor
      type: object
    Content:
      additionalProperties: false
      properties:
        part_id:
          type:
            - string
            - "null"
        portion:
          type: string
        work_id:
          type: string
      required:
        - work_id
        - part_id
        - portion
      type: object
    CreatedOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreatedOutputBody.json
          format: uri
          readOnly: true
          type: string
        id:
          type: string
      required:
        - id
      type: object
    Credit:
      additionalProperties: false
      properties:
        alias:
          $ref: "#/components/schemas/AliasRef"
        id:
          type: string
        org_id:
          type:
            - string
            - "null"
        part_id:
          type:
            - string
            - "null"
        release_id:
          type:
            - string
            - "null"
        role:
          type: string
        work_id:
          type:
            - string
            - "null"
      required:
        - id
        - role
        - work_id
        - part_id
        - release_id
        - alias
        - org_id
      type: object
    DimensionSummary:
      additionalProperties: false
      properties:
        count:
          format: int64
          type: integer
        key:
          type: string
        mean:
          format: double
          type: number
      required:
        - key
        - count
        - mean
      type: object
    DoneOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DoneOutputBody.json
          format: uri
          readOnly: true
          type: string
        state:
          type: string
      required:
        - state
      type: object
    EditChange:
      additionalProperties: false
      properties:
        adopt_id:
          description: The legacy id a new entity takes over.
          type: string
        distinct:
          description: Candidate tokens this new entity is not.
          items:
            type: string
          type:
            - array
            - "null"
        entity:
          type: string
        expect_version:
          description: The version this edit was made against.
          format: int64
          type: integer
        id:
          description: Absent creates the entity.
          type: string
        ref:
          description: Names a new entity for later changes, which point at it as ref:<ref>.
          type: string
        remove:
          description: Takes out a title, an organization name, a credit or a content row.
          type: boolean
        values:
          additionalProperties: {}
          type: object
      required:
        - entity
      type: object
    EditInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/EditInputBody.json
          format: uri
          readOnly: true
          type: string
        changes:
          items:
            $ref: "#/components/schemas/EditChange"
          maxItems: 200
          minItems: 1
          type:
            - array
            - "null"
        note:
          maxLength: 2000
          minLength: 1
          type: string
      required:
        - note
        - changes
      type: object
    EditOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/EditOutputBody.json
          format: uri
          readOnly: true
          type: string
        batch:
          type: string
        ids:
          additionalProperties:
            type: string
          type: object
      required:
        - batch
        - ids
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    FieldState:
      additionalProperties: false
      properties:
        at:
          type: string
        by:
          enum:
            - agent
            - human
            - system
          type: string
        evidence:
          description: The words the value was read from.
          items:
            type: string
          type:
            - array
            - "null"
        key:
          type: string
        reviewed_by:
          type: string
        source:
          type: string
        tier:
          type: string
      required:
        - by
        - key
        - tier
        - source
        - reviewed_by
        - at
        - evidence
      type: object
    LookupItem:
      additionalProperties: false
      properties:
        id:
          type: string
        label:
          type: string
      required:
        - id
        - label
      type: object
    LookupOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/LookupOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/LookupItem"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    MeChange:
      additionalProperties: false
      properties:
        at:
          format: date-time
          type: string
        kind:
          enum:
            - work_state
            - part_progress
            - rating
          type: string
        rating:
          $ref: "#/components/schemas/MyRating"
          description: The rating as it is now; absent when removed.
        state:
          description: null when removed, and always for a rating.
          type:
            - string
            - "null"
        subject_id:
          description: The work for work_state and rating, the part for part_progress.
          type: string
      required:
        - kind
        - subject_id
        - state
        - at
      type: object
    MeChangeList:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/MeChangeList.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/MeChange"
          type:
            - array
            - "null"
        next_cursor:
          type: string
      required:
        - items
        - next_cursor
      type: object
    MergeInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/MergeInputBody.json
          format: uri
          readOnly: true
          type: string
        entity:
          enum:
            - work
            - work_part
            - release
            - person
            - org
          type: string
        loser:
          description: The id that will redirect to the survivor.
          type: string
        reason:
          maxLength: 2000
          minLength: 1
          type: string
        survivor:
          type: string
      required:
        - entity
        - loser
        - survivor
        - reason
      type: object
    MyRating:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/MyRating.json
          format: uri
          readOnly: true
          type: string
        dimensions:
          additionalProperties:
            format: int64
            type: integer
          type: object
        overall:
          format: int64
          type: integer
        recommend:
          type: string
        short_summary:
          type: string
        short_summary_has_spoiler:
          type: boolean
        short_summary_html:
          type: string
        short_summary_text:
          type: string
        spoiler_level:
          type: string
        updated_at:
          format: date-time
          type: string
        work_id:
          type: string
      required:
        - work_id
        - overall
        - dimensions
        - recommend
        - spoiler_level
        - short_summary
        - short_summary_html
        - short_summary_text
        - short_summary_has_spoiler
        - updated_at
      type: object
    Org:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Org.json
          format: uri
          readOnly: true
          type: string
        id:
          type: string
        kind:
          type: string
        names:
          items:
            $ref: "#/components/schemas/OrgName"
          type:
            - array
            - "null"
        parent_id:
          type:
            - string
            - "null"
      required:
        - id
        - kind
        - parent_id
        - names
      type: object
    OrgList:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/OrgList.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/Org"
          type:
            - array
            - "null"
        next_cursor:
          type: string
      required:
        - items
      type: object
    OrgName:
      additionalProperties: false
      properties:
        lang:
          type: string
        text:
          type: string
      required:
        - text
        - lang
      type: object
    Part:
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          type: string
        label:
          type: string
        ordinal:
          format: double
          type:
            - number
            - "null"
        parent_id:
          type:
            - string
            - "null"
        release_ids:
          items:
            type: string
          type:
            - array
            - "null"
        released:
          description: YYYY, YYYY-MM, YYYY-MM-DD or unknown; precision as stated.
          type:
            - string
            - "null"
      required:
        - id
        - parent_id
        - kind
        - ordinal
        - label
        - released
        - release_ids
      type: object
    PartProgress:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/PartProgress.json
          format: uri
          readOnly: true
          type: string
        part_id:
          type: string
        state:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - part_id
        - state
        - updated_at
      type: object
    PatrolItem:
      additionalProperties: false
      properties:
        at:
          format: date-time
          type: string
        batch:
          type: string
        program:
          type: string
        reviewed_by:
          type: string
        revisions:
          items:
            $ref: "#/components/schemas/RevisionItem"
          type:
            - array
            - "null"
      required:
        - batch
        - program
        - reviewed_by
        - at
        - revisions
      type: object
    PatrolOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/PatrolOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/PatrolItem"
          type:
            - array
            - "null"
        next_cursor:
          type: string
      required:
        - items
      type: object
    Person:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Person.json
          format: uri
          readOnly: true
          type: string
        aliases:
          items:
            $ref: "#/components/schemas/Alias"
          type:
            - array
            - "null"
        credits:
          items:
            $ref: "#/components/schemas/Credit"
          type:
            - array
            - "null"
        id:
          type: string
        primary_alias_id:
          type:
            - string
            - "null"
      required:
        - id
        - primary_alias_id
        - aliases
        - credits
      type: object
    PersonList:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/PersonList.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/Person"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    ProgramItem:
      additionalProperties: false
      properties:
        commits:
          description: Commits this program has made.
          format: int64
          type: integer
        doc:
          type: string
        key:
          type: string
        last_write:
          format: date-time
          type:
            - string
            - "null"
        medium:
          type: string
        mode:
          enum:
            - review
            - auto
            - stopped
          type: string
        note:
          type: string
        set_at:
          format: date-time
          type:
            - string
            - "null"
        set_by:
          type: string
        todos:
          additionalProperties:
            format: int64
            type: integer
          description: Todos by state.
          type: object
        undone:
          description: Of those, taken back by a person.
          format: int64
          type: integer
        unpatrolled:
          description: Of those, not looked at yet.
          format: int64
          type: integer
      required:
        - key
        - medium
        - doc
        - mode
        - set_by
        - note
        - set_at
        - todos
        - commits
        - undone
        - unpatrolled
        - last_write
      type: object
    ProgramModeInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ProgramModeInputBody.json
          format: uri
          readOnly: true
          type: string
        mode:
          enum:
            - review
            - auto
            - stopped
          type: string
        note:
          maxLength: 2000
          minLength: 1
          type: string
      required:
        - mode
        - note
      type: object
    ProgramsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ProgramsOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/ProgramItem"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    PutProgressInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/PutProgressInputBody.json
          format: uri
          readOnly: true
          type: string
        state:
          description: none removes the progress.
          enum:
            - done
            - none
          type: string
      required:
        - state
      type: object
    PutStateInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/PutStateInputBody.json
          format: uri
          readOnly: true
          type: string
        observed_at:
          description: When the client last saw this work's state; a later server write wins and answers 409 with it.
          format: date-time
          type: string
        state:
          enum:
            - wish
            - in_progress
            - done
            - on_hold
            - dropped
          type: string
      required:
        - state
      type: object
    RatingBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/RatingBody.json
          format: uri
          readOnly: true
          type: string
        dimensions:
          additionalProperties:
            format: int64
            type: integer
          description: Sub-scores of the work's medium (GET /v3/catalog/rating-dimensions), each 1 to 10; an absent one is unrated.
          type: object
        observed_at:
          description: When the client last saw this rating; a later server write wins and answers 409 with it.
          format: date-time
          type: string
        overall:
          format: int64
          maximum: 10
          minimum: 1
          type: integer
        recommend:
          enum:
            - strong_no
            - "no"
            - neutral
            - "yes"
            - strong_yes
          type: string
        short_summary:
          description: Markdown, the dialect v2 takes; rendered into short_summary_html and short_summary_text.
          maxLength: 2000
          type: string
        spoiler_level:
          default: none
          enum:
            - none
            - portion
            - serious
          type: string
      required:
        - overall
        - recommend
      type: object
    RatingDimension:
      additionalProperties: false
      properties:
        key:
          type: string
        name_en:
          type: string
        name_zh:
          type: string
      required:
        - key
        - name_zh
        - name_en
      type: object
    RatingSummary:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/RatingSummary.json
          format: uri
          readOnly: true
          type: string
        count:
          format: int64
          type: integer
        dimensions:
          description: In the medium's order; a dimension nobody rated is absent.
          items:
            $ref: "#/components/schemas/DimensionSummary"
          type:
            - array
            - "null"
        distribution:
          description: Ratings per overall score, index 0 being 1.
          items:
            format: int64
            type: integer
          type:
            - array
            - "null"
        mean:
          description: The plain mean of overall; 0 with no ratings.
          format: double
          type: number
        recommend:
          additionalProperties:
            format: int64
            type: integer
          type: object
        work_id:
          type: string
      required:
        - work_id
        - count
        - mean
        - distribution
        - recommend
        - dimensions
      type: object
    Record:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Record.json
          format: uri
          readOnly: true
          type: string
        called:
          description: What a person would call it; empty when it has no name.
          type: string
        children:
          additionalProperties:
            items:
              $ref: "#/components/schemas/Record"
            type:
              - array
              - "null"
          type: object
        entity:
          type: string
        held:
          type: boolean
        id:
          type: string
        is:
          additionalProperties:
            type: string
          description: What each cited id is called.
          type: object
        state:
          additionalProperties:
            $ref: "#/components/schemas/FieldState"
          type: object
        values:
          additionalProperties: {}
          type: object
        version:
          format: int64
          type: integer
      required:
        - entity
        - id
        - version
        - values
        - state
        - called
        - is
        - held
      type: object
    Release:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Release.json
          format: uri
          readOnly: true
          type: string
        book:
          $ref: "#/components/schemas/BookRelease"
        contents:
          items:
            $ref: "#/components/schemas/Content"
          type:
            - array
            - "null"
        edition_kind:
          type: string
        format:
          type: string
        id:
          type: string
        lang:
          type: string
        official_url:
          type: string
        release_status:
          type: string
        released:
          type:
            - string
            - "null"
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - lang
        - edition_kind
        - format
        - released
        - release_status
        - official_url
        - book
        - contents
        - updated_at
      type: object
    ReleaseList:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ReleaseList.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/Release"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    RestoreInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/RestoreInputBody.json
          format: uri
          readOnly: true
          type: string
        note:
          description: Why, e.g. the counter-notice.
          maxLength: 2000
          minLength: 1
          type: string
      required:
        - note
      type: object
    RevisionItem:
      additionalProperties: false
      properties:
        action:
          type: string
        actor_key:
          type: string
        actor_kind:
          type: string
        at:
          format: date-time
          type: string
        batch:
          description: The commit; undo takes back all of it.
          type: string
        changes:
          additionalProperties: {}
          type: object
        entity:
