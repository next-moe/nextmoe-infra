components:
  schemas:
    AmendProposalInputBody:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/AmendProposalInputBody.json
          format: uri
          readOnly: true
          type: string
        note:
          description: Must not be used as a discriminant.
          maxLength: 2000
          type: string
        set:
          additionalProperties: {}
          description: Field-key to corrected value.
          type: object
        unset:
          description: Field keys to drop, at most 100.
          items:
            type: string
          maxItems: 100
          type: array
      type: object
    Amendment:
      additionalProperties: true
      properties:
        amender_uid:
          description: The claiming site's own user id of the amender. Not a catalog id.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        created_at:
          description: RFC 3339 UTC.
          format: date-time
          maxLength: 32
          type: string
        id:
          description: Amendment id.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        note:
          description: Amender's own summary. Must not be used as a discriminant.
          maxLength: 2000
          type: string
        object:
          description: Type discriminant. Always amendment.
          enum:
            - amendment
          type: string
          x-vocabulary-closed: true
        seq:
          description: Position in this proposal's amendment chain.
          format: int64
          minimum: 1
          type: integer
      required:
        - object
        - id
        - seq
        - amender_uid
        - note
        - created_at
      type: object
    Appearance:
      additionalProperties: true
      properties:
        identity:
          description: Opaque roster row identity for a catalog.work.roster.suppressed proposal on THIS work; echo it back, never rebuild it. The same key the mirror-image works/{id}.characters[] row publishes. Absent when the work is reached only through a voice credit, where roster_role is unknown and spoiler is none. Must not be used as a discriminant.
          maxLength: 64
          type: string
        object:
          description: Type discriminant. Always appearance.
          enum:
            - appearance
          type: string
          x-vocabulary-closed: true
        roster_role:
          description: Appearance strength on this work.
          enum:
            - main
            - secondary
            - appears
            - unknown
          type: string
          x-vocabulary-closed: true
        spoiler:
          description: Spoiler level of this appearance.
          enum:
            - none
            - minor
            - major
          type: string
          x-vocabulary-closed: true
        voices:
          description: Voice credits on this appearance. Empty array, never null.
          items:
            $ref: "#/components/schemas/CreditName"
          type: array
        work:
          $ref: "#/components/schemas/Work"
          description: Work this character appears on. view=basic.
      required:
        - object
        - work
        - roster_role
        - spoiler
        - voices
      type: object
    BatchPlaytimesInputBody:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/BatchPlaytimesInputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          description: At most 100 items.
          items:
            $ref: "#/components/schemas/Item"
          maxItems: 100
          type: array
      required:
        - items
      type: object
    CalendarList:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/CalendarList.json
          format: uri
          readOnly: true
          type: string
        facets:
          additionalProperties:
            items:
              $ref: "#/components/schemas/FacetValue"
            type:
              - array
              - "null"
          description: Named facet buckets. Present only when facets= is requested.
          type: object
        items:
          description: Members of this page. Empty array, never null.
          items:
            $ref: "#/components/schemas/Work"
          type: array
        meta:
          $ref: "#/components/schemas/CalendarMeta"
          description: Calendar navigation block. Always present on this collection.
        missing:
          description: ids requested but not visible. Present only on the ids=/refs= batch lane.
          items:
            type: string
          type: array
        next_cursor:
          description: Opaque keyset cursor. Omitted on the last page.
          maxLength: 512
          pattern: ^cur_[A-Za-z0-9._~-]+$
          type: string
        object:
          description: Type discriminant. Always list.
          enum:
            - list
          type: string
          x-vocabulary-closed: true
        total:
          description: Present only when include_total=true. Same visibility gate as items.
          format: int64
          minimum: 0
          type: integer
      required:
        - meta
        - object
        - items
      type: object
    CalendarMeta:
      additionalProperties: true
      properties:
        has_next:
          description: Whether a month after the requested one has dated releases. Only the dated month window carries it; null on the year-only and undated windows.
          type:
            - boolean
            - "null"
        has_prev:
          description: Whether a month before the requested one has dated releases. Only the dated month window carries it; null on the year-only and undated windows.
          type:
            - boolean
            - "null"
        max_month:
          description: Latest month with a dated release under the same filters. Only the dated month window carries it; null when that window's population has no dated release at all.
          maxLength: 7
          pattern: ^[0-9]{4}-[0-9]{2}$
          type:
            - string
            - "null"
        min_month:
          description: Earliest month with a dated release under the same filters. Only the dated month window carries it; null when that window's population has no dated release at all.
          maxLength: 7
          pattern: ^[0-9]{4}-[0-9]{2}$
          type:
            - string
            - "null"
        today:
          description: Today in Asia/Tokyo, the calendar's home timezone.
          format: date
          maxLength: 10
          type: string
      required:
        - today
        - min_month
        - max_month
        - has_prev
        - has_next
      type: object
    CatalogStats:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/CatalogStats.json
          format: uri
          readOnly: true
          type: string
        characters:
          description: Live characters.
          format: int64
          minimum: 0
          type: integer
        companies:
          description: Company registry rows.
          format: int64
          minimum: 0
          type: integer
        credit_names:
          description: Live credit names.
          format: int64
          minimum: 0
          type: integer
        object:
          description: Type discriminant. Always catalog_stats.
          enum:
            - catalog_stats
          type: string
          x-vocabulary-closed: true
        persons:
          description: Live persons.
          format: int64
          minimum: 0
          type: integer
        works:
          description: Live works.
          format: int64
          minimum: 0
          type: integer
      required:
        - object
        - works
        - companies
        - characters
        - credit_names
        - persons
      type: object
    Change:
      additionalProperties: true
      properties:
        gone:
          description: "Present and true when the id has left the public population: merged away, or otherwise no longer served. Absent means the id is still live — never sent as false. Drop the mirrored row; if it was merged, /v2/catalog/redirects names the id that replaced it."
          type: boolean
        id:
          description: Catalog id of the changed row.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        object:
          description: Type discriminant. Always change.
          enum:
            - change
          type: string
          x-vocabulary-closed: true
        target_object:
          description: Family of the row that changed.
          enum:
            - work
            - release
            - character
            - credit_name
            - person
            - company
            - tag
            - engine
          type: string
          x-vocabulary-closed: true
        updated_at:
          description: RFC 3339 UTC. The moment the row last changed, and the value the cursor resumes from.
          format: date-time
          maxLength: 32
          type: string
      required:
        - object
        - target_object
        - id
        - updated_at
      type: object
    Character:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/Character.json
          format: uri
          readOnly: true
          type: string
        aliases:
          description: Alternate spellings of THIS character name. Present when include=aliases, detail face only. Empty array if none.
          items:
            $ref: "#/components/schemas/EntityName"
          type: array
        birthday:
          description: "MM-DD. Present on view=full. null if unrecorded. Not a date: there is no year."
          maxLength: 5
          pattern: ^[0-1][0-9]-[0-3][0-9]$
          type: string
        blood_type:
          description: Present on view=full. null if unrecorded.
          enum:
            - a
            - b
            - ab
            - o
          type: string
          x-vocabulary-closed: true
        display_name:
          description: Must not be used as a discriminant.
          maxLength: 512
          type: string
        figure:
          $ref: "#/components/schemas/Image"
          description: Present only when include=figure and this character has a full-body figure cutout; absent otherwise. Detail face only.
        gender:
          description: Present on view=full. null if unrecorded.
          enum:
            - male
            - female
            - other
          type: string
          x-vocabulary-closed: true
        height_cm:
          description: Present on view=full. null if unrecorded.
          format: int64
          minimum: 0
          type: integer
        id:
          description: Catalog character id.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        image:
          $ref: "#/components/schemas/Image"
          description: Present only when include=image and this character has an image; absent otherwise. Detail face only.
        instance_of_id:
          description: Another character this row is an instance of. Present on view=full. null if none.
          maxLength: 20
          pattern: ^[0-9]+$
          type: string
        intros:
          description: Character descriptions, one per language. Present when include=intros, detail face only. Empty array if none.
          items:
            $ref: "#/components/schemas/Intro"
          type: array
        lang:
          description: BCP-47 language tag of display_name. null if unrecorded. Must not be used as a discriminant.
          format: bcp47
          maxLength: 32
          type:
            - string
            - "null"
        latin:
          description: null if unrecorded. Must not be used as a discriminant.
          maxLength: 512
          type:
            - string
            - "null"
        localized:
          additionalProperties:
            $ref: "#/components/schemas/LocalizedText"
          description: BCP-47 keys. Empty object if none. Must not be used as a discriminant.
          type: object
        measurements:
          $ref: "#/components/schemas/Measurements"
          description: Present on view=full. null if unrecorded.
        object:
          description: Type discriminant. Always character.
          enum:
            - character
          type: string
          x-vocabulary-closed: true
        refs:
          description: Exact upstream anchors of this character. Present when include=refs, detail face only. Empty array if none.
          items:
            $ref: "#/components/schemas/Ref"
          type: array
        traits:
          description: Present when include=traits, detail face only. Empty array if none.
          items:
            $ref: "#/components/schemas/CharacterTrait"
          type: array
        weight_kg:
          description: Present on view=full. null if unrecorded.
          format: int64
          minimum: 0
          type: integer
      required:
        - object
        - id
        - display_name
        - latin
        - lang
        - localized
      type: object
    CharacterTrait:
      additionalProperties: true
      properties:
        display_name:
          description: Must not be used as a discriminant.
          maxLength: 512
          type: string
        group:
          description: Root trait group name. null for a root trait. Must not be used as a discriminant.
          maxLength: 512
          type:
            - string
            - "null"
        group_localized:
          additionalProperties:
            $ref: "#/components/schemas/LocalizedText"
          description: Localized names of the root group, BCP-47 keys. Empty object if none. Must not be used as a discriminant.
          type: object
        id:
          description: Catalog trait id.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        is_lie:
          description: Whether this trait is an in-story deception.
          type: boolean
        is_sexual:
          description: Whether this trait is in the sexual family.
          type: boolean
        localized:
          additionalProperties:
            $ref: "#/components/schemas/LocalizedText"
          description: BCP-47 keys. Empty object if none. Must not be used as a discriminant.
          type: object
        object:
          description: Type discriminant. Always character_trait.
          enum:
            - character_trait
          type: string
          x-vocabulary-closed: true
        spoiler:
          description: Spoiler level of this trait on this character.
          enum:
            - none
            - minor
            - major
          type: string
          x-vocabulary-closed: true
      required:
        - object
        - id
        - display_name
        - group
        - localized
        - group_localized
        - spoiler
        - is_sexual
        - is_lie
      type: object
    Claim:
      additionalProperties: true
      properties:
        content_limit:
          description: Editorial display axis for this claim.
          enum:
            - sfw
            - nsfw
          type: string
          x-vocabulary-closed: true
        site:
          description: Claiming site key.
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]*$
          type: string
        site_work_id:
          description: The site's own work id, not the catalog id.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        state:
          description: Claim lifecycle state.
          enum:
            - live
            - draft
            - pending
            - declined
            - hidden
          type: string
          x-vocabulary-closed: true
      required:
        - site
        - site_work_id
        - state
        - content_limit
      type: object
    ClaimDecisionRecord:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ClaimDecisionRecord.json
          format: uri
          readOnly: true
          type: string
        decision:
          description: approve publishes a pending claim, decline sends it back, ban hides it from any state, unban restores the state it was hidden from.
          enum:
            - approve
            - decline
            - ban
            - unban
          type: string
          x-vocabulary-closed: true
        from_state:
          description: Claim state before this decision. null when the claim had none.
          enum:
            - none
            - live
            - draft
            - pending
            - declined
            - hidden
          type:
            - string
            - "null"
          x-vocabulary-closed: true
        id:
          description: Claim event id issued by this decision.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        note:
          description: Must not be used as a discriminant.
          maxLength: 2000
          type: string
        object:
          description: Type discriminant. Always decision.
          enum:
            - decision
          type: string
          x-vocabulary-closed: true
        to_state:
          description: Claim state after this decision. The authoritative outcome; do not derive it from decision, because unban has no fixed target.
          enum:
            - none
            - live
            - draft
            - pending
            - declined
            - hidden
          type: string
          x-vocabulary-closed: true
      required:
        - object
        - id
        - decision
        - note
        - from_state
        - to_state
      type: object
    ClaimEvent:
      additionalProperties: true
      properties:
        actor_uid:
          description: The claiming site's own user id of the actor. Not a catalog id.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        created_at:
          description: RFC 3339 UTC.
          format: date-time
          maxLength: 32
          type: string
        from_state:
          description: State before the event. null on the event that created the claim.
          enum:
            - none
            - live
            - draft
            - pending
            - declined
            - hidden
          type:
            - string
            - "null"
          x-vocabulary-closed: true
        id:
          description: Claim event id. Ascending; the watermark a mirror stores.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        object:
          description: Type discriminant. Always claim_event.
          enum:
            - claim_event
          type: string
          x-vocabulary-closed: true
        product_work_id:
          description: The claim's CURRENT product-side id — a snapshot, not the value at event time. null when the work is unclaimed or gone.
          maxLength: 20
          pattern: ^[0-9]+$
          type:
            - string
            - "null"
        reason:
          description: Actor's note, usually a decline reason. null when none was given. Must not be used as a discriminant.
          maxLength: 2000
          type:
            - string
            - "null"
        site:
          description: Tenant the event was recorded under. Open vocabulary; must not be used as a discriminant.
          maxLength: 64
          type: string
        to_state:
          description: State after the event.
          enum:
            - none
            - live
            - draft
            - pending
            - declined
            - hidden
          type: string
          x-vocabulary-closed: true
        work_id:
          description: Catalog work id the event is on.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
      required:
        - object
        - id
        - work_id
        - from_state
        - to_state
        - reason
        - actor_uid
        - site
        - product_work_id
        - created_at
      type: object
    ClaimEventRef:
      additionalProperties: true
      properties:
        actor_uid:
          description: The claiming site's own user id of the actor — a moderator on a decision event, not necessarily the claim owner.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        created_at:
          description: RFC 3339 UTC.
          format: date-time
          maxLength: 32
          type: string
        from_state:
          description: State before the event. null on the event that created the claim.
          enum:
            - none
            - live
            - draft
            - pending
            - declined
            - hidden
          type:
            - string
            - "null"
          x-vocabulary-closed: true
        id:
          description: Claim event id. Same id space as /v2/catalog/claim-events.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        object:
          description: Type discriminant. Always claim_event.
          enum:
            - claim_event
          type: string
          x-vocabulary-closed: true
        reason:
          description: Actor's note, usually a decline reason. null when none was given. Must not be used as a discriminant.
          maxLength: 2000
          type:
            - string
            - "null"
        to_state:
          description: State after the event.
          enum:
            - none
            - live
            - draft
            - pending
            - declined
            - hidden
          type: string
          x-vocabulary-closed: true
      required:
        - object
        - id
        - from_state
        - to_state
        - reason
        - actor_uid
        - created_at
      type: object
    ClaimRecord:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ClaimRecord.json
          format: uri
          readOnly: true
          type: string
        acted_count:
          description: How many times the bearer acted on this work, within the site= scope when given. Present on the me faces.
          format: int64
          minimum: 0
          type: integer
        display_name:
          description: Must not be used as a discriminant.
          maxLength: 512
          type: string
        first_acted_at:
          description: RFC 3339 UTC of the bearer's first action on this work. Present on the me faces.
          format: date-time
          maxLength: 32
          type: string
        id:
          description: Catalog work id this claim is on.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        last_event:
          $ref: "#/components/schemas/ClaimEventRef"
          description: The newest claim event on this work, whoever acted. Present on the me faces and single-claim reads; absent on the moderation queue rows.
        object:
          description: Type discriminant. Always claim.
          enum:
            - claim
          type: string
          x-vocabulary-closed: true
        product_work_id:
          description: The claiming site's own work id. null when unclaimed.
          maxLength: 20
          pattern: ^[0-9]+$
          type:
            - string
            - "null"
        site:
          description: Claiming site key, empty when unclaimed. Open vocabulary; must not be used as a discriminant.
          maxLength: 64
          type: string
        state:
          description: Claim lifecycle state. none means the work is not currently claimed by any site.
          enum:
            - none
            - live
            - draft
            - pending
            - declined
            - hidden
          type: string
          x-vocabulary-closed: true
      required:
        - object
        - id
        - state
        - display_name
        - site
        - product_work_id
      type: object
    ClaimRefBody:
      additionalProperties: true
      properties:
        external_id:
          description: Verbatim upstream id. Must not be used as a discriminant beyond exact match.
          maxLength: 256
          minLength: 1
          type: string
        source:
          description: Open vocabulary source key such as vndb. Must not be used as a discriminant.
          maxLength: 64
          minLength: 1
          type: string
          x-vocabulary: sources
          x-vocabulary-closed: false
      required:
        - source
        - external_id
      type: object
    Company:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/Company.json
          format: uri
          readOnly: true
          type: string
        aliases:
          description: Present when include=aliases. Empty array if none.
          items:
            $ref: "#/components/schemas/EntityName"
          type: array
        company_kind:
          description: Company registry class. No other.
          enum:
            - game_brand
            - bunko
            - publisher
            - anime_studio
            - doujin_circle
            - group
          type: string
          x-vocabulary-closed: true
        display_name:
          description: Must not be used as a discriminant.
          maxLength: 512
          type: string
        id:
          description: Catalog company id.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        intros:
          description: Present when include=intros on the detail and batch lanes; the cursor list lane does not carry it. Empty array if none.
          items:
            $ref: "#/components/schemas/Intro"
          type: array
        lang:
          description: BCP-47 language tag of display_name. null if unrecorded. Must not be used as a discriminant.
          format: bcp47
          maxLength: 32
          type:
            - string
            - "null"
        latin:
          description: null if unrecorded. Must not be used as a discriminant.
          maxLength: 512
          type:
            - string
            - "null"
        links:
          description: Present when include=links on the detail and batch lanes; the cursor list lane does not carry it. Empty array if none.
          items:
            $ref: "#/components/schemas/WorkLink"
          type: array
        localized:
          additionalProperties:
            $ref: "#/components/schemas/LocalizedText"
          description: BCP-47 keys. Empty object if none. Must not be used as a discriminant.
          type: object
        logo:
          $ref: "#/components/schemas/Image"
          description: Present only when include=logo and this company has a logo; absent otherwise.
        object:
          description: Type discriminant. Always company.
          enum:
            - company
          type: string
          x-vocabulary-closed: true
        work_count:
          description: Works visible under the same NSFW gate.
          format: int64
          minimum: 0
          type: integer
      required:
        - object
        - id
        - display_name
        - latin
        - lang
        - localized
        - company_kind
        - work_count
      type: object
    CompanyGraph:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/CompanyGraph.json
          format: uri
          readOnly: true
          type: string
        edges:
          description: Directed relations among nodes. Empty array, never null. Inverse relations are not emitted.
          items:
            $ref: "#/components/schemas/CompanyGraphEdge"
          type: array
        nodes:
          description: Companies in this family. Empty array, never null.
          items:
            $ref: "#/components/schemas/CompanyGraphNode"
          type: array
        object:
          description: Type discriminant. Always company_graph.
          enum:
            - company_graph
          type: string
          x-vocabulary-closed: true
        truncated:
          description: The walk is bounded at 60 nodes and 4 hops from the requested company. true means the family continues past what nodes[] carries and this is a partial graph; false means nodes[] is the complete connected family.
          type: boolean
      required:
        - object
        - nodes
        - edges
        - truncated
      type: object
    CompanyGraphEdge:
      additionalProperties: true
      properties:
        from_id:
          description: Source company id. to_id is the named relation of from_id.
          maxLength: 20
