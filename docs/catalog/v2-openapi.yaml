            - minor
            - major
          type: string
          x-vocabulary-closed: true
        tag_kind:
          description: Tag vocabulary class. null if unmapped.
          enum:
            - content
            - meta
          type:
            - string
            - "null"
          x-vocabulary-closed: true
        tier:
          description: Tag inventory tier. null if unmapped.
          enum:
            - core
            - longtail
            - hidden
          type:
            - string
            - "null"
          x-vocabulary-closed: true
        work_count:
          description: Works visible under the same NSFW gate. null if unmapped.
          format: int64
          minimum: 0
          type:
            - integer
            - "null"
      required:
        - id
        - display_name
        - source
        - tier
        - tag_kind
        - spoiler
        - is_sexual
        - work_count
      type: object
    WorkTitle:
      additionalProperties: true
      properties:
        is_machine:
          description: Whether this title is machine-translated.
          type: boolean
        lang:
          description: BCP-47 language tag.
          format: bcp47
          maxLength: 32
          type: string
        latin:
          description: Romanization. null if unrecorded. Must not be used as a discriminant.
          maxLength: 512
          type:
            - string
            - "null"
        title:
          description: Must not be used as a discriminant.
          maxLength: 512
          type: string
        title_kind:
          description: search_hint is internal and never appears on this type.
          enum:
            - official
            - alias
            - abbreviation
          type: string
          x-vocabulary-closed: true
      required:
        - lang
        - title
        - latin
        - title_kind
        - is_machine
      type: object
  securitySchemes:
    applicationKey:
      description: An application key (nmk_...) minted in the developer portal. Required scopes are named in each operation's description; a key without them answers 403 SCOPE_REQUIRED.
      scheme: bearer
      type: http
    userToken:
      description: "An OAuth user access token, obtained with the authorization code grant plus PKCE. An application key sent to /v2/me or /v2/moderation is refused: those faces act as a person, not as an app. On the /v2/catalog read surface it is an alternative to an application key — send one or the other, never both — and the token must carry the catalog:read scope; requests are counted against the user's own quota, pooled across every application that person has authorised."
      scheme: bearer
      type: http
info:
  description: "NextMoe public API v2. Public since 2026-08-25: any application mints its own nmk_ key in the developer portal, no approval required. The shape evolves additively; a breaking change to this document fails CI."
