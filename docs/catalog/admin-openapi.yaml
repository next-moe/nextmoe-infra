components:
  schemas:
    CandidateBucketCount:
      additionalProperties: false
      properties:
        count:
          format: int64
          type: integer
        entity_type:
          format: int32
          type: integer
        status:
          format: int32
          type: integer
      required:
        - entity_type
        - status
        - count
      type: object
    CandidateItem:
      additionalProperties: false
      properties:
        a:
          $ref: "#/components/schemas/EntitySummary"
        a_id:
          format: int64
          type: integer
        b:
          $ref: "#/components/schemas/EntitySummary"
        b_id:
          format: int64
          type: integer
        created_at:
          format: date-time
          type: string
        decided_at:
          format: date-time
          type:
            - string
            - "null"
        decided_by:
          format: int64
          type:
            - integer
            - "null"
        entity_type:
          format: int32
          type: integer
        reason:
          format: int32
          type: integer
        score:
          format: float
          type:
            - number
            - "null"
        status:
          format: int32
          type: integer
      required:
        - a
        - b
        - entity_type
        - a_id
        - b_id
        - reason
        - score
        - status
        - created_at
        - decided_by
        - decided_at
      type: object
    CatalogSource:
      additionalProperties: false
      properties:
        id:
          format: int32
          type: integer
        is_deprecated:
          type: boolean
        key:
          type: string
        note:
          type: string
        trust_tier:
          format: int32
          type: integer
        url_template:
          type:
            - string
            - "null"
      required:
        - id
        - key
        - url_template
        - trust_tier
        - note
        - is_deprecated
      type: object
    ClaimActionResult:
      additionalProperties: false
      properties:
        event_id:
          format: int64
          type: integer
        from_state:
          type:
            - string
            - "null"
        to_state:
          type: string
        work_id:
          format: int64
          type: integer
      required:
        - work_id
        - from_state
        - to_state
        - event_id
      type: object
    DecideCandidateData:
      additionalProperties: false
      properties:
        decided:
          type: boolean
        needs_manual:
          type: boolean
        person_created:
          type: boolean
        person_id:
          format: int64
          type: integer
        proposal_id:
          description: Set when a merge-candidate accept opened a proposal
          format: int64
          type: integer
        released:
          items:
            format: int64
            type: integer
          type:
            - array
            - "null"
      required:
        - decided
      type: object
    DecideCandidateInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/DecideCandidateInputBody.json
          format: uri
          readOnly: true
          type: string
        a_id:
          format: int64
          type: integer
        action:
          enum:
            - accept
            - reject
            - defer
          type: string
        b_id:
          format: int64
          type: integer
        entity_type:
          format: int32
          type: integer
        note:
          description: "merge accept only: carried onto the opened proposal"
          type: string
        source_id:
          description: "merge accept only (non-credit_name): the entity absorbed by the merge (must be a_id or b_id)"
          format: int64
          type: integer
        target_id:
          description: "merge accept only (non-credit_name): the surviving entity"
          format: int64
          type: integer
      required:
        - entity_type
        - a_id
        - b_id
        - action
      type: object
    DetachImageReferencesData:
      additionalProperties: false
      properties:
        removed:
          additionalProperties:
            format: int64
            type: integer
          description: Rows released per kind
          type: object
        total_removed:
          format: int64
          type: integer
      required:
        - removed
        - total_removed
      type: object
    DetachImageReferencesInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/DetachImageReferencesInputBody.json
          format: uri
          readOnly: true
          type: string
        hash:
          description: The image's sha-256 (64 hex characters)
          type: string
      required:
        - hash
      type: object
    DetachNameData:
      additionalProperties: false
      properties:
        detached:
          type: boolean
      required:
        - detached
      type: object
    DetachNameInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/DetachNameInputBody.json
          format: uri
          readOnly: true
          type: string
        credit_name_id:
          description: The credit name to detach from its person (person_id → NULL); an emptied auto-linked person is removed
          format: int64
          minimum: 1
          type: integer
      required:
        - credit_name_id
      type: object
    EditPolicyAuditEntry:
      additionalProperties: false
      properties:
        actor_uid:
