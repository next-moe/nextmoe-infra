      type: object
    RefActionData:
      additionalProperties: false
      properties:
        done:
          type: boolean
      required:
        - done
      type: object
    RefKeyBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/RefKeyBody.json
          format: uri
          readOnly: true
          type: string
        entity_id:
          format: int64
          type: integer
        entity_type:
          format: int32
          type: integer
        external_id:
          minLength: 1
          type: string
        source_id:
          format: int32
          type: integer
      required:
        - entity_type
        - entity_id
        - source_id
        - external_id
      type: object
    RejectRefInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/RejectRefInputBody.json
          format: uri
          readOnly: true
          type: string
        entity_id:
          format: int64
          type: integer
        entity_type:
          format: int32
          type: integer
        external_id:
          minLength: 1
          type: string
        reason:
          description: Why the pairing is wrong — recorded as permanent negative knowledge
          minLength: 1
          type: string
        source_id:
          format: int32
          type: integer
      required:
        - entity_type
        - entity_id
        - source_id
        - external_id
        - reason
      type: object
    ReleaseWorkData:
      additionalProperties: false
      properties:
        status:
          format: int32
          type: integer
        work_id:
          format: int64
          type: integer
      required:
        - work_id
        - status
      type: object
    ReleaseWorkInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ReleaseWorkInputBody.json
          format: uri
          readOnly: true
          type: string
        note:
          type: string
        work_id:
          description: The quarantined work to release to live
          format: int64
          minimum: 1
          type: integer
      required:
        - work_id
      type: object
    StaffClaimActionRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/StaffClaimActionRequest.json
          format: uri
          readOnly: true
          type: string
        reason:
          description: Moderator note; REQUIRED for decline, recorded on the event
          type: string
      type: object
info:
  title: KUN Catalog Admin API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/admin/catalog/candidates:
    get:
      operationId: listCatalogCandidates
      parameters:
        - description: 0=pending 1=accepted 2=rejected 3=deferred; -1 = all
          explode: false
          in: query
          name: status
          schema:
            default: -1
            description: 0=pending 1=accepted 2=rejected 3=deferred; -1 = all
            format: int32
            type: integer
        - description: -1 = all
          explode: false
          in: query
          name: entity_type
          schema:
            default: -1
            description: -1 = all
            format: int32
            type: integer
        - description: 0=shared_external_id 1=name_norm_equal 2=name_fuzzy 3=importer_suggest 4=llm_suggest; -1 = all
          explode: false
          in: query
          name: reason
          schema:
            default: -1
            description: 0=shared_external_id 1=name_norm_equal 2=name_fuzzy 3=importer_suggest 4=llm_suggest; -1 = all
            format: int32
            type: integer
        - description: 1-based page number
          explode: false
          in: query
          name: page
          schema:
            description: 1-based page number
            format: int64
            type: integer
        - description: Items per page (max 200)
          explode: false
          in: query
          name: limit
          schema:
            description: Items per page (max 200)
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePageCandidateItem"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: List match candidates (the ambiguity bucket)
      tags:
        - catalog-admin
  /api/v1/admin/catalog/candidates/decide:
    post:
      operationId: decideCatalogCandidate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideCandidateInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeDecideCandidateData"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: "Decide a match candidate: accept (credit_name → link a person; else opens a merge proposal), reject (kept forever) or defer"
      tags:
        - catalog-admin
  /api/v1/admin/catalog/candidates/summary:
    get:
      operationId: catalogQueueSummary
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeQueueSummary"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: "Queue depth: candidates grouped by entity type × status, probable refs grouped by entity type"
      tags:
        - catalog-admin
  /api/v1/admin/catalog/claims/pending:
    get:
      operationId: listCatalogPendingClaims
      parameters:
        - description: Restrict to one claiming site
          explode: false
          in: query
          name: site
          schema:
            description: Restrict to one claiming site
            type: string
        - description: Items per page (max 200)
          explode: false
          in: query
          name: limit
          schema:
            description: Items per page (max 200)
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePagePendingClaimItem"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: "The claim review queue: submissions awaiting a decision, oldest submission first"
      tags:
        - catalog-admin
  /api/v1/admin/catalog/claims/{id}/{action}:
    post:
      operationId: actOnCatalogClaimAsStaff
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            minimum: 1
            type: integer
        - description: approve | decline | ban | unban
          in: path
          name: action
          required: true
          schema:
            description: approve | decline | ban | unban
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffClaimActionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeClaimActionResult"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Approve / decline / ban / unban a claim (decline and ban record the reason on the event)
      tags:
        - catalog-admin
  /api/v1/admin/catalog/edit-policy:
    get:
      operationId: getCatalogEditPolicy
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePolicyMatrixData"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: "Effective editing policy: code default, runtime override and effective rules per entity type and field"
      tags:
        - catalog-admin
  /api/v1/admin/catalog/edit-policy/audit:
    get:
      operationId: listCatalogEditPolicyAudit
      parameters:
        - description: Items per page (max 200, default 50)
          explode: false
          in: query
          name: limit
          schema:
            description: Items per page (max 200, default 50)
            format: int64
            maximum: 200
            minimum: 0
            type: integer
        - description: "Cursor: entries with a smaller id"
          explode: false
          in: query
          name: before_id
          schema:
            description: "Cursor: entries with a smaller id"
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeListEditPolicyAuditEntry"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Who changed which override, when, and from what to what (newest first)
      tags:
        - catalog-admin
  /api/v1/admin/catalog/edit-policy/overrides:
    delete:
      operationId: deleteCatalogEditPolicyOverride
      parameters:
        - explode: false
          in: query
          name: entity_type
          required: true
          schema:
            maxLength: 64
            minLength: 1
            type: string
        - explode: false
          in: query
          name: field_key
          schema:
            maxLength: 128
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStruct {}"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Remove the override on one entity type or field
      tags:
        - catalog-admin
    put:
      operationId: putCatalogEditPolicyOverride
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyOverrideBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePutEditPolicyData"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Set the override on one entity type or field (replaces it whole; applies without a restart)
      tags:
        - catalog-admin
  /api/v1/admin/catalog/image-references:
    get:
      operationId: listCatalogImageReferences
      parameters:
        - description: The image's sha-256 (64 hex characters)
          explode: false
          in: query
          name: hash
          schema:
            description: The image's sha-256 (64 hex characters)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeImageReferencesData"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: List the catalog rows that reference an image hash (the pre-delete check)
      tags:
        - catalog-admin
  /api/v1/admin/catalog/image-references/detach:
    post:
      operationId: detachCatalogImageReferences
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DetachImageReferencesInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeDetachImageReferencesData"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Release every catalog reference to an image hash (run before deleting the bytes)
      tags:
        - catalog-admin
  /api/v1/admin/catalog/names/detach:
    post:
      operationId: detachCatalogName
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DetachNameInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeDetachNameData"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Detach a credit name from its person (reverses a person link; removes the person if it empties)
      tags:
        - catalog-admin
  /api/v1/admin/catalog/proposals:
    get:
      operationId: listCatalogProposals
      parameters:
        - description: 0=open 1=approved 2=executed 3=rejected 4=withdrawn; -1 = all
          explode: false
          in: query
          name: status
          schema:
            default: -1
            description: 0=open 1=approved 2=executed 3=rejected 4=withdrawn; -1 = all
            format: int32
            type: integer
        - description: -1 = all
          explode: false
          in: query
          name: entity_type
          schema:
            default: -1
            description: -1 = all
            format: int32
            type: integer
        - explode: false
          in: query
          name: page
          schema:
            format: int64
            type: integer
        - explode: false
          in: query
          name: limit
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePageProposalItem"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: List merge proposals
      tags:
        - catalog-admin
  /api/v1/admin/catalog/proposals/{id}/{action}:
    post:
      operationId: actOnCatalogProposal
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
        - in: path
          name: action
          required: true
          schema:
            enum:
              - approve
              - reject
              - withdraw
              - execute
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposalActionInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeProposalActionData"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Approve / reject / withdraw / execute a merge proposal (execute enforces the 48h cooling-off)
      tags:
        - catalog-admin
  /api/v1/admin/catalog/refs/confirm:
    post:
      operationId: confirmCatalogRef
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefKeyBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeRefActionData"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Promote a probable external ref to exact (409 when the exact slot is taken)
      tags:
        - catalog-admin
  /api/v1/admin/catalog/refs/probable:
    get:
      operationId: listCatalogProbableRefs
      parameters:
        - description: -1 = all
          explode: false
          in: query
          name: source_id
          schema:
            default: -1
            description: -1 = all
            format: int32
            type: integer
        - description: -1 = all
          explode: false
          in: query
          name: entity_type
          schema:
            default: -1
            description: -1 = all
            format: int32
            type: integer
        - explode: false
          in: query
          name: page
          schema:
            format: int64
            type: integer
        - explode: false
          in: query
          name: limit
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePageProbableRefItem"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: List unconfirmed probable external refs (the confirmation bucket; includes merge-demoted exacts)
      tags:
        - catalog-admin
  /api/v1/admin/catalog/refs/reject:
    post:
      operationId: rejectCatalogRef
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectRefInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeRefActionData"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: "Reject a wrong external ref: deletes it and records first-class negative knowledge (reason required)"
      tags:
        - catalog-admin
  /api/v1/admin/catalog/works/release:
    post:
      operationId: releaseCatalogWork
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseWorkInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeReleaseWorkData"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Release a quarantined work to live (the reject-without-merge exit of the mint gate)
      tags:
        - catalog-admin
