          description: The override after the change; null when it was removed.
        before:
          $ref: "#/components/schemas/PolicyOverrideBody"
          description: The override before the change; null when there was none.
        created_at:
          format: date-time
          type: string
        entity_type:
          type: string
        field_key:
          type: string
        id:
          format: int64
          type: integer
      required:
        - id
        - entity_type
        - field_key
        - before
        - after
        - actor_uid
        - created_at
      type: object
