        propose_modes:
          items:
            type: string
          type:
            - array
            - "null"
        rows:
          items:
            $ref: "#/components/schemas/PolicyMatrixRow"
          type:
            - array
            - "null"
      required:
        - rows
        - propose_modes
        - automerge_modes
      type: object
    PolicyMatrixRow:
      additionalProperties: false
      properties:
        default:
          $ref: "#/components/schemas/PolicyRules"
          description: The rules the code ships.
        effective:
          $ref: "#/components/schemas/PolicyRules"
          description: "What the engine applies now: default, then the type-level override, then this row's."
        entity_type:
          type: string
        field_key:
          description: Empty on the type-level row, whose effective rules every field without an override of its own inherits.
          type: string
        override:
          $ref: "#/components/schemas/PolicyOverrideBody"
          description: The runtime override on exactly this row, or null.
      required:
        - entity_type
        - field_key
        - default
        - override
        - effective
      type: object
    PolicyOverrideBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/PolicyOverrideBody.json
          format: uri
          readOnly: true
          type: string
        automerge:
          description: Omitted inherits from below.
          type: string
        entity_type:
          description: Editing-engine type, e.g. catalog.work.
          maxLength: 64
          minLength: 1
          type: string
        field_key:
          description: Empty for the whole type; a field key overrides that field only.
          maxLength: 128
          type: string
        owner_review:
          description: Omitted inherits from below.
          type: boolean
        propose:
          description: Omitted inherits from below.
          type: string
        review:
          description: Omitted inherits from below.
          type: string
      required:
        - entity_type
      type: object
    PolicyRules:
      additionalProperties: false
      properties:
        automerge:
          description: never, trusted, always, owner, review, or trusted_or_review
          type: string
        owner_review:
          description: Whether the entity's owner may review proposals on it, with no permission.
          type: boolean
        propose:
          description: open, trusted, locked, or perm:<catalog permission key>
          type: string
        review:
          description: perm:<catalog permission key>
          type: string
      required:
        - propose
        - review
        - automerge
        - owner_review
      type: object
