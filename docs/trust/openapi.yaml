components:
  schemas:
    CheckRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/CheckRequest.json
          format: uri
          readOnly: true
          type: string
        author_id:
          description: optional content author's global id (accepted, not used in v0)
          format: int64
          type: integer
        site:
          description: optional tenant site (allowlist-gated relay path); omitted = derived from the client binding
          type: string
        text:
          description: the UGC text to check against the Tier0 word list
          type: string
      required:
        - text
      type: object
    CheckResponse:
      additionalProperties: false
      properties:
        decision:
          description: allow=no match; hold=only suspect terms matched (route to review); deny=a banned term matched (block)
          enum:
            - allow
            - deny
            - hold
          type: string
        matched:
          description: the matched normalized terms ([] when none)
          items:
            type: string
          type: array
      required:
        - decision
        - matched
      type: object
    EnsureSubjectKindItem:
      additionalProperties: false
      properties:
        callback_secret:
          description: per-kind HMAC signing secret; omit to leave unchanged
          type: string
        callback_url:
          description: enforcement callback endpoint; omit to leave unchanged / unset
          type: string
        key:
          description: stable subject-kind key (e.g. forum_topic)
          type: string
        notify_on_dismiss:
          description: emit an action:0 callback on a dismissed decision; omit to leave unchanged (false on create)
          type: boolean
      required:
        - key
      type: object
    EnsureSubjectKindResultView:
      additionalProperties: false
      properties:
        key:
          type: string
        result:
          description: per-kind convergence outcome
          enum:
            - created
            - updated
            - unchanged
            - deprecated_skipped
          type: string
      required:
        - key
        - result
      type: object
    EnsureSubjectKindsRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EnsureSubjectKindsRequest.json
          format: uri
          readOnly: true
          type: string
        kinds:
          description: declared subject kinds (≤50); converged per-kind, deprecated kinds are never revived
          items:
            $ref: "#/components/schemas/EnsureSubjectKindItem"
          type:
            - array
            - "null"
      required:
        - kinds
      type: object
    EnsureSubjectKindsResponse:
      additionalProperties: false
      properties:
        results:
          items:
            $ref: "#/components/schemas/EnsureSubjectKindResultView"
          type: array
      required:
        - results
      type: object
    EnvelopeCheckResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EnvelopeCheckResponse.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        data:
          $ref: "#/components/schemas/CheckResponse"
        message:
          type: string
      required:
        - code
        - message
      type: object
    EnvelopeEnsureSubjectKindsResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EnvelopeEnsureSubjectKindsResponse.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        data:
          $ref: "#/components/schemas/EnsureSubjectKindsResponse"
        message:
          type: string
      required:
        - code
        - message
      type: object
    EnvelopeForwardResolveResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EnvelopeForwardResolveResponse.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        data:
          $ref: "#/components/schemas/ForwardResolveResponse"
        message:
          type: string
      required:
        - code
        - message
      type: object
    EnvelopeForwardResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EnvelopeForwardResponse.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        data:
          $ref: "#/components/schemas/ForwardResponse"
        message:
          type: string
      required:
        - code
        - message
      type: object
    EnvelopeReportReasonsResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EnvelopeReportReasonsResponse.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        data:
          $ref: "#/components/schemas/ReportReasonsResponse"
        message:
          type: string
      required:
        - code
        - message
      type: object
    EnvelopeReportResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EnvelopeReportResponse.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        data:
          $ref: "#/components/schemas/ReportResponse"
        message:
          type: string
      required:
        - code
        - message
      type: object
    EnvelopeScanResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EnvelopeScanResponse.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        data:
          $ref: "#/components/schemas/ScanResponse"
        message:
          type: string
      required:
        - code
        - message
      type: object
    EnvelopeSubjectKindsResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EnvelopeSubjectKindsResponse.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        data:
          $ref: "#/components/schemas/SubjectKindsResponse"
        message:
          type: string
      required:
        - code
        - message
      type: object
    ForwardRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ForwardRequest.json
          format: uri
          readOnly: true
          type: string
        author_id:
          description: optional global id of the user who wrote the subject; the review item keeps the first one it is given as subject_author_id
          format: int64
          minimum: 1
          type: integer
        context_note:
          description: reviewer-facing evidence excerpt
          type: string
        forwarder_ref:
          description: caller-side trace ref (informational)
          type: string
        severity:
          format: int32
          type: integer
        site:
          description: tenant site the subject belongs to (allowlist-gated, not from the client binding)
          type: string
        subject_id:
          type: string
        subject_kind:
          description: registered subject kind (e.g. community_post)
          type: string
        subject_reach:
          description: optional audience the content has reached (views or nearest equivalent); ranks the review queue and re-ranks an already-open item upward as the number grows
          format: int64
          type: integer
        weight_sum:
          description: accumulated signal weight (idempotent update takes the max)
          format: float
          type: number
      required:
        - site
        - subject_kind
        - subject_id
      type: object
    ForwardResolveRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ForwardResolveRequest.json
          format: uri
          readOnly: true
          type: string
        actor_ref:
          description: site-side actor ref (recorded in the audit policy_ref)
          type: string
        outcome:
          description: approved→dismissed, rejected→actioned
          enum:
            - approved
            - rejected
          type: string
        review_item_id:
          format: int64
          type: integer
      required:
        - review_item_id
        - outcome
      type: object
    ForwardResolveResponse:
      additionalProperties: false
      properties:
        closed:
          description: false = the item was already terminal (tolerated race)
          type: boolean
      required:
        - closed
      type: object
    ForwardResponse:
      additionalProperties: false
      properties:
        created:
          description: false = an open item already existed and its signals were updated
          type: boolean
        review_item_id:
          format: int64
          type: integer
      required:
        - review_item_id
        - created
      type: object
    HouseError:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/HouseError.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        message:
          type: string
      required:
        - code
        - message
      type: object
    ReasonView:
      additionalProperties: false
      properties:
        id:
          format: int64
          type: integer
        is_deprecated:
          type: boolean
        key:
          type: string
        name_cn:
          type: string
        severity:
          format: int32
          type: integer
        site:
          type: string
      required:
        - id
        - key
        - name_cn
        - severity
        - is_deprecated
      type: object
    ReportReasonsResponse:
      additionalProperties: false
      properties:
        reasons:
          items:
            $ref: "#/components/schemas/ReasonView"
          type: array
      required:
        - reasons
      type: object
    ReportRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ReportRequest.json
          format: uri
          readOnly: true
          type: string
        author_id:
          description: optional global id of the user who wrote the reported content (for a user subject, that user); the repeat-offender key the review item carries as subject_author_id. Not the tenant, not the reporter; omit when unknown
          format: int64
          minimum: 1
          type: integer
        note:
          type: string
        reason_key:
          description: a global or per-site reason key (abuse/spam/…)
          type: string
        reporter_id:
          description: the reporting user's global id (P0 requires login)
          format: int64
          type: integer
        snapshot:
          description: reporter-carried content snapshot at report time
          type: string
        subject_id:
          description: the subject's stable id in the product
          type: string
        subject_kind:
          description: registered subject kind for this site (e.g. forum_topic)
          type: string
        subject_url:
          description: deep link to the reported content in its product context (http/https, ≤512 chars); carried by the submitter because sub-entity subjects have no page derivable from subject_id alone
          type: string
      required:
        - subject_kind
        - subject_id
        - reason_key
        - reporter_id
      type: object
    ReportResponse:
      additionalProperties: false
      properties:
        report_id:
          format: int64
          type: integer
        review_item_id:
          description: set when the report opened/linked/folded a review item
          format: int64
          type: integer
      required:
        - report_id
      type: object
    ScanRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ScanRequest.json
          format: uri
          readOnly: true
          type: string
        author_id:
          description: optional content author's global id (attribution/repeat-offender signal); not the tenant
          format: int64
          type: integer
        site:
          description: optional tenant site (allowlist-gated relay path); omitted = derived from the client binding
          type: string
        subject_id:
          description: the subject's stable id in the product
          type: string
        subject_kind:
          description: registered subject kind for this site (e.g. community_post)
          type: string
        subject_reach:
          description: optional audience the content has reached so far (views or the product's nearest equivalent); ranks the review queue — omitted or 0 contributes no boost
          format: int64
          type: integer
        text:
          description: the UGC text to scan (capped at ~8000 runes; excess is truncated and recorded)
          type: string
      required:
        - subject_kind
        - subject_id
        - text
      type: object
    ScanResponse:
      additionalProperties: false
      properties:
        scan_id:
          format: int64
          type: integer
        truncated:
          description: true = the text exceeded the cap and was truncated before storage
          type: boolean
      required:
        - scan_id
        - truncated
      type: object
    SubjectKindView:
      additionalProperties: false
      properties:
        callback_url:
          type: string
        created_at:
          format: date-time
          type: string
        has_secret:
          type: boolean
        id:
          format: int64
          type: integer
        is_deprecated:
          type: boolean
        key:
          type: string
        notify_on_dismiss:
          type: boolean
        site:
          type: string
      required:
        - id
        - site
        - key
        - has_secret
        - is_deprecated
        - notify_on_dismiss
        - created_at
      type: object
    SubjectKindsResponse:
      additionalProperties: false
      properties:
        kinds:
          items:
            $ref: "#/components/schemas/SubjectKindView"
          type: array
      required:
        - kinds
      type: object
info:
  title: KUN Trust Service
  version: 1.0.1
openapi: 3.1.0
paths:
  /api/v1/trust/check:
    post:
      operationId: checkText
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCheckResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Synchronous Tier0 word-list check (deterministic; allow/deny/hold; no state written)
      tags:
        - trust-check
  /api/v1/trust/forward:
    post:
      operationId: forwardReviewItem
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForwardRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeForwardResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Forward a product's local review signal into the unified inbox (allowlist-gated)
      tags:
        - trust-forward
  /api/v1/trust/forward/resolve:
    post:
      operationId: resolveForwardedItem
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForwardResolveRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeForwardResolveResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Close a forwarded item after a site's local decision (no disposition, no callback)
      tags:
        - trust-forward
  /api/v1/trust/report-reasons:
    get:
      operationId: listReportReasons
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeReportReasonsResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: List the calling site's usable report reasons (global base + own extensions, non-deprecated)
      tags:
        - trust-intake
  /api/v1/trust/reports:
    post:
      operationId: submitReport
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeReportResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Submit a report on a subject (dedup / rate-limit / weight / aggregate)
      tags:
        - trust-intake
  /api/v1/trust/scan:
    post:
      operationId: submitScan
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeScanResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Submit a content-scan event for async AI shadow-scoring (accept-type; site derived from the client binding)
      tags:
        - trust-intake
  /api/v1/trust/subject-kinds:
    get:
      operationId: listSubjectKinds
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeSubjectKindsResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: List the calling site's registered subject kinds
      tags:
        - trust-intake
  /api/v1/trust/subject-kinds/ensure:
    post:
      operationId: ensureSubjectKinds
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnsureSubjectKindsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeEnsureSubjectKindsResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Declaratively ensure the calling site's subject kinds (idempotent; site from the client binding; never revives deprecated)
      tags:
        - trust-intake
