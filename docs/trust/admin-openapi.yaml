components:
  schemas:
    BatchSubjectKindsRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/BatchSubjectKindsRequest.json
          format: uri
          readOnly: true
          type: string
        kinds:
          description: declared subject kinds (≤50); converged per-kind, deprecated kinds are never revived
          items:
            $ref: "#/components/schemas/EnsureSubjectKindItem"
          type:
            - array
            - "null"
        site:
          description: tenant site the kinds belong to
          type: string
      required:
        - site
        - kinds
      type: object
    CreateReasonRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/CreateReasonRequest.json
          format: uri
          readOnly: true
          type: string
        key:
          type: string
        name_cn:
          type: string
        severity:
          format: int32
          type: integer
        site:
          type: string
      required:
        - key
        - name_cn
        - severity
      type: object
    CreateSubjectKindRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/CreateSubjectKindRequest.json
          format: uri
          readOnly: true
          type: string
        callback_secret:
          type: string
        callback_url:
          type: string
        key:
          type: string
        notify_on_dismiss:
          description: emit an action:0 callback on a dismissed decision (release holds); default false
          type: boolean
        site:
          description: tenant site the kind belongs to
          type: string
      required:
        - site
        - key
      type: object
    CreateTermRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/CreateTermRequest.json
          format: uri
          readOnly: true
          type: string
        kind:
          description: 0=suspect (hold — enqueue, don't block) 1=banned (deny — the sync check rejects)
          format: int32
          type: integer
        note:
          description: optional operator memo
          type: string
        purpose:
          description: 0=abuse (default; precision-prunable against the AI classifier) 1=compliance (legal/regulatory — exempt from precision pruning, since the abuse classifier does not judge that question)
          format: int32
          type: integer
        site:
          description: tenant site; null = global (applies to every site)
          type: string
        term:
          description: the raw term (normalized server-side before storage)
          type: string
      required:
        - term
        - kind
      type: object
    DecideData:
      additionalProperties: false
      properties:
        decided:
          type: boolean
        disposition_id:
          description: set when an actioned decision wrote a disposition
          format: int64
          type: integer
      required:
        - decided
      type: object
    DecideRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/DecideRequest.json
          format: uri
          readOnly: true
          type: string
        action:
          description: "required for actioned: 0=none 1=hide 2=remove 3=warn_user 4=restrict 5=escalate_idp"
          format: int32
          type: integer
        decision:
          enum:
            - dismissed
            - actioned
          type: string
        reason_code:
          description: required for actioned
          type: string
        statement:
          description: Art.17 reason statement (optional in P0)
          type: string
      required:
        - decision
      type: object
    DispositionView:
      additionalProperties: false
      properties:
        acted_by:
          format: int64
          type: integer
        action:
          description: 0=none 1=hide 2=remove 3=warn_user 4=restrict 5=escalate_idp
          format: int32
          type: integer
        callback_attempts:
          format: int32
          type: integer
        callback_status:
          description: 0=pending 1=delivered 2=dead_letter; null=no callback
          format: int32
          type: integer
        created_at:
          format: date-time
          type: string
        delivered_at:
          format: date-time
          type: string
        id:
          format: int64
          type: integer
        next_attempt_at:
          format: date-time
          type: string
        reason_code:
          type: string
        review_item_id:
          format: int64
          type: integer
        statement:
          type: string
      required:
        - id
        - review_item_id
        - action
        - acted_by
        - reason_code
        - callback_attempts
        - created_at
      type: object
    EnsureSubjectKindItem:
      additionalProperties: false
      properties:
        callback_secret:
          description: per-kind HMAC signing secret; omit to leave unchanged
          type: string
        callback_url:
          description: enforcement callback endpoint; omit to leave unchanged / unset
          type: string
        key:
          description: stable subject-kind key (e.g. forum_topic)
          type: string
        notify_on_dismiss:
          description: emit an action:0 callback on a dismissed decision; omit to leave unchanged (false on create)
          type: boolean
      required:
        - key
      type: object
    EnsureSubjectKindResultView:
      additionalProperties: false
      properties:
        key:
          type: string
        result:
          description: per-kind convergence outcome
          enum:
            - created
            - updated
            - unchanged
            - deprecated_skipped
          type: string
      required:
        - key
        - result
      type: object
    EnsureSubjectKindsResponse:
      additionalProperties: false
      properties:
        results:
          items:
            $ref: "#/components/schemas/EnsureSubjectKindResultView"
          type: array
      required:
        - results
      type: object
    EnvelopeDecideData:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EnvelopeDecideData.json
          format: uri
          readOnly: true
          type: string
        code:
