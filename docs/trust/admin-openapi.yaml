          format: int32
          type: integer
      type: object
info:
  title: KUN Trust Admin API
  version: 1.0.1
openapi: 3.1.0
paths:
  /api/v1/admin/trust/dispositions:
    get:
      description: "Platform-staff only: a site-scoped moderator receives 403 (the registries and dead-letter surfaces are platform-ops)."
      operationId: listTrustDispositions
      parameters:
        - description: 0=pending 1=delivered 2=dead_letter; -1 = all
          explode: false
          in: query
          name: callback_status
          schema:
            default: -1
            description: 0=pending 1=delivered 2=dead_letter; -1 = all
            format: int32
            type: integer
        - explode: false
          in: query
          name: page
          schema:
            format: int64
            type: integer
        - explode: false
          in: query
          name: limit
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePageDispositionView"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: List dispositions by callback status (e.g. dead_letter)
      tags:
        - trust-admin
  /api/v1/admin/trust/dispositions/{id}/redeliver:
    post:
      description: "Platform-staff only: a site-scoped moderator receives 403 (the registries and dead-letter surfaces are platform-ops)."
      operationId: redeliverTrustDisposition
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOKResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Replay a dead-lettered callback (reset to pending)
      tags:
        - trust-admin
  /api/v1/admin/trust/report-reasons:
    get:
      description: "Platform-staff only: a site-scoped moderator receives 403 (the registries and dead-letter surfaces are platform-ops)."
      operationId: listTrustReportReasons
      parameters:
        - description: include this site's extensions alongside the global base; empty = all
          explode: false
          in: query
          name: site
          schema:
            description: include this site's extensions alongside the global base; empty = all
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeListReasonView"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: List the reason taxonomy (global base + per-site extensions)
      tags:
        - trust-admin
    post:
