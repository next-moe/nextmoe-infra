components:
  schemas:
    AgentSearchRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/AgentSearchRequest.json
          format: uri
          readOnly: true
          type: string
        pow:
          description: Solution to a challenge from /v2/agent/pow/challenge, when the site requires one.
          maxLength: 4096
          type: string
        q:
          maxLength: 300
          minLength: 1
          type: string
      required:
        - q
      type: object
    ConvOutBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ConvOutBody.json
          format: uri
          readOnly: true
          type: string
        active_run_id:
          description: A run still streaming into this conversation; resume it on /v2/agent/runs/{id}/stream.
          type:
            - string
            - "null"
        conversation:
          $ref: "#/components/schemas/ConversationBody"
        messages:
          description: The current branch, oldest first.
          items:
            $ref: "#/components/schemas/MessageBody"
          type:
            - array
            - "null"
      required:
        - conversation
        - messages
        - active_run_id
      type: object
    ConversationBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ConversationBody.json
          format: uri
          readOnly: true
          type: string
        active_run_id:
          description: A reply still streaming in this conversation.
          type:
            - string
            - "null"
        created_at:
          format: date-time
          type: string
        id:
          type: string
        mode:
          enum:
            - assistant
            - search
          type: string
        starred:
          type: boolean
        title:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - title
        - mode
        - starred
        - active_run_id
        - updated_at
        - created_at
      type: object
    CreateAgentConversationRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/CreateAgentConversationRequest.json
          format: uri
          readOnly: true
          type: string
        mode:
          enum:
            - assistant
          type: string
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    GetAgentPowChallengeResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/GetAgentPowChallengeResponse.json
          format: uri
          readOnly: true
          type: string
        token:
          type: string
      required:
        - token
      type: object
    ListOutBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ListOutBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/ConversationBody"
          type:
            - array
            - "null"
        next_cursor:
          type:
            - string
            - "null"
      required:
        - items
        - next_cursor
      type: object
    MessageBody:
      additionalProperties: false
      properties:
        feedback:
          description: The user's rating of an assistant reply.
          enum:
            - up
            - down
          type:
            - string
            - "null"
        id:
          type: string
        parent_id:
          type:
            - string
            - "null"
        parts: {}
        role:
          enum:
            - user
            - assistant
          type: string
        run_id:
          type: string
        sibling_ids:
          description: Every message under this message's parent, itself included, oldest first. Its position is the n of an n/m switcher; fetch ?head=<sibling> to show another one.
          items:
            type: string
          type:
            - array
            - "null"
        siblings:
          description: len(sibling_ids).
          format: int64
          type: integer
        status:
          enum:
            - complete
            - streaming
            - failed
            - canceled
          type: string
      required:
        - id
        - parent_id
        - role
        - parts
        - status
        - run_id
        - siblings
        - sibling_ids
        - feedback
      type: object
    Part:
      additionalProperties: false
      properties:
        data: {}
        filename:
          type: string
        id:
          type: string
        input: {}
        mediaType:
          type: string
        output: {}
        sourceId:
          type: string
        state:
          type: string
        text:
          type: string
        title:
          type: string
        toolCallId:
          type: string
        type:
          type: string
        uploadId:
          type: string
        url:
          type: string
      required:
        - type
      type: object
    PersonaBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/PersonaBody.json
          format: uri
          readOnly: true
          type: string
        avatar:
          type: string
        greetings:
          items:
            type: string
          type:
            - array
            - "null"
        name:
          type: string
        suggestions:
          description: Starter prompts for an empty conversation, grouped like the mode chips of a composer.
          items:
            $ref: "#/components/schemas/SuggestionGroup"
          type:
            - array
            - "null"
        uploads:
          $ref: "#/components/schemas/UploadsBody"
          description: What the upload menu may offer on this site, from the settings center.
        web_search_auto:
          description: The assistant searches the web by itself when a question needs it, and the surcharge is charged only when it did. The toggle then asks it to search first; without auto, only toggled questions can search.
          type: boolean
        web_search_available:
          description: Whether web_search can do anything; hide the toggle when false.
          type: boolean
      required:
        - name
        - avatar
        - greetings
        - suggestions
        - uploads
        - web_search_available
        - web_search_auto
      type: object
    PersonaInput:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/PersonaInput.json
          format: uri
          readOnly: true
          type: string
        active:
          description: Activating a persona deactivates the site's other one.
          type: boolean
        avatar:
          description: An https image URL, or empty for the site's own default.
          maxLength: 128
          type: string
        greetings:
          items:
            type: string
          maxItems: 10
          type: array
        name:
          maxLength: 64
          minLength: 1
          type: string
        prompt:
          description: Who the assistant is and how it talks. The tool and safety rules are added after it and cannot be overridden here.
          maxLength: 8000
          minLength: 1
          type: string
        site_id:
          format: int64
          minimum: 0
          type: integer
        suggestions:
          items:
            $ref: "#/components/schemas/SuggestionGroup"
          maxItems: 6
          type: array
      type: object
    PersonaList:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/PersonaList.json
          format: uri
          readOnly: true
          type: string
        builtin_suggestions:
          items:
            $ref: "#/components/schemas/SuggestionGroup"
          type:
            - array
            - "null"
        personas:
          items:
            $ref: "#/components/schemas/PersonaView"
          type:
            - array
            - "null"
      required:
        - personas
        - builtin_suggestions
      type: object
    PersonaView:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/PersonaView.json
          format: uri
          readOnly: true
          type: string
        active:
          type: boolean
        avatar:
          type: string
        greetings:
          items:
            type: string
          type:
            - array
            - "null"
        id:
          format: int64
          type: integer
        name:
          type: string
        prompt:
          type: string
        site_id:
          description: 0 is the default for every site without an active persona of its own.
          format: int64
          type: integer
        suggestions:
          description: Empty uses the built-in groups.
          items:
            $ref: "#/components/schemas/SuggestionGroup"
          type:
            - array
            - "null"
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - site_id
        - name
        - avatar
        - prompt
        - greetings
        - suggestions
        - active
        - updated_at
      type: object
    Problem:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/Problem.json
          format: uri
          readOnly: true
          type: string
        code:
          description: Machine-readable reason; branch on this, not on detail.
          pattern: ^[A-Z][A-Z0-9_]*[A-Z0-9]$
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      required:
        - code
      type: object
    QuotaBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/QuotaBody.json
          format: uri
          readOnly: true
          type: string
        free_left:
          format: int64
          type: integer
        free_per_day:
          format: int64
          type: integer
        moemoepoint_balance:
          description: The user's NextMoe moemoepoint balance; null when it could not be read.
          format: int64
          type:
            - integer
            - "null"
        paid_enabled:
          type: boolean
        price_assistant:
          format: int64
          type: integer
        price_search:
          format: int64
          type: integer
        price_web_surcharge:
          format: int64
          type: integer
      required:
        - free_left
        - free_per_day
        - price_assistant
        - price_web_surcharge
        - price_search
        - paid_enabled
        - moemoepoint_balance
      type: object
    RegenerateInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/RegenerateInputBody.json
          format: uri
          readOnly: true
          type: string
        message_id:
          description: The user message to answer again. From an assistant message, pass its parent_id.
          type: string
        web_search:
          type: boolean
      required:
        - message_id
      type: object
    RenameAgentConversationRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/RenameAgentConversationRequest.json
          format: uri
          readOnly: true
          type: string
        head_message_id:
          type: string
        starred:
          type: boolean
        title:
          maxLength: 100
          minLength: 1
          type: string
      type: object
    SearchHit:
      additionalProperties: false
      properties:
        card: {}
        id:
          type: string
      required:
        - id
        - card
      type: object
    SearchOutBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/SearchOutBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/SearchHit"
          type:
            - array
            - "null"
        search_mode:
          enum:
            - lexical
            - hybrid
          type: string
      required:
        - items
        - search_mode
      type: object
    SendInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/SendInputBody.json
          format: uri
          readOnly: true
          type: string
        parent_id:
          description: Message to answer. Absent continues from the conversation head; "0" starts a new root branch; a user message's parent regenerates or edits.
          type: string
        parts:
          items:
            $ref: "#/components/schemas/Part"
          maxItems: 6
          minItems: 1
          type:
            - array
            - "null"
        web_search:
          type: boolean
      required:
        - parts
      type: object
    SendOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/SendOutputBody.json
          format: uri
          readOnly: true
          type: string
        assistant_message_id:
          type: string
        run_id:
          type: string
        user_message_id:
          type: string
      required:
        - run_id
        - user_message_id
        - assistant_message_id
      type: object
    SetAgentFeedbackRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/SetAgentFeedbackRequest.json
          format: uri
          readOnly: true
          type: string
        rating:
          enum:
            - up
            - down
            - none
          type: string
      required:
        - rating
      type: object
    SiteToolInput:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/SiteToolInput.json
          format: uri
          readOnly: true
          type: string
        allowed:
          items:
            type: string
          maxItems: 50
          type: array
        auth:
          description: user_token forwards the asking user's access token, so the site applies its own visibility rules; such tools are skipped for signed-out searches.
          enum:
            - user_token
            - none
          type: string
        card_prefix:
          description: Cards from this server must use kinds <card_prefix>:<kind>; others are dropped.
          pattern: ^[a-z][a-z0-9_]{0,31}$
          type: string
        enabled:
          type: boolean
        name:
          description: Prefixes the tool names the model sees, as <name>__<tool>.
          pattern: ^[a-z][a-z0-9_]{0,31}$
          type: string
        site_id:
          format: int64
          minimum: 1
          type: integer
        timeout_ms:
          format: int64
          maximum: 120000
          minimum: 1000
          type: integer
        url:
          description: The site's MCP endpoint (streamable HTTP), reachable from the agent.
          maxLength: 512
          type: string
      type: object
    SiteToolListing:
      additionalProperties: false
      properties:
        allowed:
          type: boolean
        description:
          type: string
        model_name:
          description: As the model sees it.
          type: string
        name:
          description: As the server names it.
          type: string
      required:
        - name
        - model_name
        - description
        - allowed
      type: object
    SiteToolProbe:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/SiteToolProbe.json
          format: uri
          readOnly: true
          type: string
        error:
          type: string
        ok:
          type: boolean
        tools:
          items:
            $ref: "#/components/schemas/SiteToolListing"
          type:
            - array
            - "null"
      required:
        - ok
        - error
        - tools
      type: object
    SiteToolView:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/SiteToolView.json
          format: uri
          readOnly: true
          type: string
        allowed:
          description: Tool names the assistant may call; empty allows every tool the server lists.
          items:
            type: string
          type:
            - array
            - "null"
        auth:
          enum:
            - user_token
            - none
          type: string
        card_prefix:
          type: string
        enabled:
          type: boolean
        id:
          format: int64
          type: integer
        name:
          type: string
        site_id:
          format: int64
          type: integer
        timeout_ms:
          format: int64
          type: integer
        updated_at:
          format: date-time
          type: string
        url:
          type: string
      required:
        - id
        - site_id
        - name
        - url
        - auth
        - card_prefix
        - allowed
        - timeout_ms
        - enabled
        - updated_at
      type: object
    SuggestionGroup:
      additionalProperties: false
      properties:
        icon:
          description: A lucide icon name.
          type: string
        label:
          type: string
        prompts:
          description: More than a screenful; show a few and rotate.
          items:
            type: string
          type:
            - array
            - "null"
        web_search:
          description: Send this group's prompts with web_search on.
          type: boolean
      required:
        - label
        - icon
        - web_search
        - prompts
      type: object
    UploadBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/UploadBody.json
          format: uri
          readOnly: true
          type: string
        chars:
          description: Characters of text the model will read; 0 for a picture.
          format: int64
          type: integer
        filename:
          type: string
        id:
          type: string
        kind:
          enum:
            - image
            - text
            - document
          type: string
        media_type:
          type: string
        size:
          description: Bytes the user sent.
          format: int64
          type: integer
        truncated:
          description: The text was longer than one message may carry and was cut.
          type: boolean
        url:
          description: Where the file can be fetched back from the agent with the same credentials.
          type: string
      required:
        - id
        - kind
        - media_type
        - filename
        - size
        - chars
        - truncated
        - url
      type: object
    UploadOption:
      additionalProperties: false
      properties:
        accept:
          description: Ready for <input type=file accept>.
          type: string
        icon:
          description: A lucide icon name.
          type: string
        kind:
          enum:
            - image
            - text
            - document
          type: string
        label:
          type: string
        max_bytes:
          format: int64
          type: integer
      required:
        - kind
        - label
        - icon
        - accept
        - max_bytes
      type: object
    UploadsBody:
      additionalProperties: false
      properties:
        max_files:
          description: Files one message may carry; 0 means no upload button.
          format: int64
          type: integer
        options:
          description: One entry per menu item, in display order.
          items:
            $ref: "#/components/schemas/UploadOption"
          type:
            - array
            - "null"
      required:
        - max_files
        - options
      type: object
info:
  description: "The NextMoe AI assistant: conversations, streamed replies and search. Called by a site's backend with the user's access token (or the site's client credentials for signed-out search). Replies stream as the AI SDK UI message stream protocol (SSE) from GET /v2/agent/runs/{id}/stream, which honours Last-Event-ID and answers 204 when the run has no live stream."
  title: NextMoe Agent API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/admin/agent/personas:
    get:
      description: Admin console only; requires ai.agent_manage.
      operationId: listAgentPersonas
      parameters:
        - description: -1 lists every site; 0 the defaults.
          explode: false
          in: query
          name: site_id
          schema:
            default: -1
            description: -1 lists every site; 0 the defaults.
            format: int64
            minimum: -1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonaList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Personas, optionally for one site
      tags:
        - agent-admin
    post:
      description: Admin console only; requires ai.agent_manage.
      operationId: createAgentPersona
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonaInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonaView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Add a persona
      tags:
        - agent-admin
  /api/v1/admin/agent/personas/{id}:
    delete:
      description: Admin console only; requires ai.agent_manage.
      operationId: deleteAgentPersona
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Remove a persona
      tags:
        - agent-admin
    patch:
      description: Admin console only; requires ai.agent_manage.
      operationId: updateAgentPersona
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonaInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonaView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Change a persona
      tags:
        - agent-admin
  /api/v1/admin/agent/site-tools:
    get:
      description: Admin console only; requires ai.agent_manage.
      operationId: listAgentSiteTools
      parameters:
        - explode: false
          in: query
          name: site_id
          schema:
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/SiteToolView"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Site tool servers, optionally for one site
      tags:
        - agent-admin
    post:
      description: Admin console only; requires ai.agent_manage.
      operationId: createAgentSiteTool
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteToolInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteToolView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Register a site's MCP server
      tags:
        - agent-admin
  /api/v1/admin/agent/site-tools/{id}:
    delete:
      description: Admin console only; requires ai.agent_manage.
      operationId: deleteAgentSiteTool
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Remove a site tool server
      tags:
        - agent-admin
    patch:
      description: Admin console only; requires ai.agent_manage.
      operationId: updateAgentSiteTool
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteToolInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteToolView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Change a site tool server
      tags:
        - agent-admin
  /api/v1/admin/agent/site-tools/{id}/test:
    post:
      description: Admin console only; requires ai.agent_manage.
      operationId: testAgentSiteTool
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
        - in: header
          name: Authorization
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteToolProbe"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Connect to the server and list its tools, with your own token
      tags:
