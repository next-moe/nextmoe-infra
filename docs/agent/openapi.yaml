  /v2/agent/conversations:
    get:
      operationId: listAgentConversations
      parameters:
        - explode: false
          in: query
          name: cursor
          schema:
            maxLength: 64
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 30
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: Only starred (true) or only unstarred (false) conversations; absent lists both.
          explode: false
          in: query
          name: starred
          schema:
            description: Only starred (true) or only unstarred (false) conversations; absent lists both.
            enum:
              - "true"
              - "false"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListOutBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: The caller's conversations on this site, newest first
      tags:
        - agent
    post:
      operationId: createAgentConversation
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentConversationRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Start a conversation
      tags:
        - agent
  /v2/agent/conversations/{id}:
    delete:
      operationId: deleteAgentConversation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Delete a conversation and its messages
      tags:
        - agent
    get:
      operationId: getAgentConversation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: Show the branch ending at this message instead of the conversation head.
          explode: false
          in: query
          name: head
          schema:
            description: Show the branch ending at this message instead of the conversation head.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConvOutBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: A conversation and its current branch
      tags:
        - agent
    patch:
      description: Only the fields present change. head_message_id makes the branch through that message current, down to the reply last chosen (or else last created) under each message, so a reload and a return to an earlier question both show what the user last picked.
      operationId: renameAgentConversation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameAgentConversationRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Rename, star or switch the branch of a conversation
      tags:
        - agent
  /v2/agent/conversations/{id}/messages:
    post:
      description: Stores the user message, reserves its price and starts a run. Stream the reply from /v2/agent/runs/{run_id}/stream. Replaying the same Idempotency-Key with the same body returns the same run.
      operationId: sendAgentMessage
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            maxLength: 128
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendInputBody"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendOutputBody"
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Send a message and start the reply
      tags:
        - agent
  /v2/agent/conversations/{id}/regenerate:
    post:
      description: Adds another assistant reply under the same user message, so the replies become siblings the UI can switch between; no user message is added. Priced and streamed like sending a message.
      operationId: regenerateAgentReply
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            maxLength: 128
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegenerateInputBody"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendOutputBody"
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Answer a user message again
      tags:
        - agent
  /v2/agent/messages/{id}/feedback:
