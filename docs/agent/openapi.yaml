  /v2/agent/search:
    post:
      description: Ranks catalog works for a title or a free-text description. Signed-out callers (client credentials, the visitor's address in CF-Connecting-IP) are limited per address and may have to solve a proof-of-work challenge from /v2/agent/pow/challenge.
      operationId: agentSearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentSearchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchOutBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: "Search mode: find works from a description"
      tags:
        - agent
  /v2/agent/uploads:
    post:
      description: Stores one file for the caller's next message; reference it as {"type":"file","uploadId":…} in the parts. Pictures are scaled down, documents keep only their text. Unused uploads are dropped after a day.
      operationId: createAgentUpload
      requestBody:
        content:
          multipart/form-data:
            encoding:
              file:
                contentType: application/octet-stream
            schema:
              properties:
                file:
                  contentEncoding: binary
                  contentMediaType: application/octet-stream
                  format: binary
                  type: string
              required:
                - file
              type: object
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Attach a file
      tags:
        - agent
  /v2/agent/uploads/{id}:
    get:
      description: The scaled-down picture, or the text the model read for a text file or document.
      operationId: getAgentUpload
      parameters:
        - in: path
          name: id
          required: true
          schema:
            maxLength: 36
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                contentEncoding: base64
                type: string
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
            Content-Type:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Fetch an attached file back
      tags:
        - agent
