        - content_rating
        - status
        - posts_count
        - participants_count
        - highest_post_number
        - created_by
        - created_at
      type: object
    ThreadWithPosts:
      additionalProperties: false
      properties:
        next_cursor:
          description: post_number to pass as after for the next page; empty = last page
          type: string
        posts:
          items:
            $ref: "#/components/schemas/PostView"
          type:
            - array
            - "null"
        thread:
          $ref: "#/components/schemas/ThreadView"
      required:
        - thread
        - posts
      type: object
    TrustView:
      additionalProperties: false
      properties:
        days_visited:
          format: int32
          type: integer
        first_posts_held_remaining:
          format: int32
          type: integer
        flags_agreed:
          format: int32
          type: integer
        flags_disagreed:
          format: int32
          type: integer
        granted_boost:
          format: int32
          type: integer
        level:
          format: int32
          type: integer
        likes_given:
          format: int32
          type: integer
        likes_received:
          format: int32
          type: integer
        posts_read:
          format: int32
          type: integer
        read_time_s:
          format: int32
          type: integer
        topics_entered:
          format: int32
          type: integer
        user_id:
          format: int64
          type: integer
      required:
        - user_id
        - level
        - first_posts_held_remaining
      type: object
    UnreadListResponse:
      additionalProperties: false
      properties:
        next_cursor:
          type: string
        threads:
          items:
            $ref: "#/components/schemas/UnreadThreadView"
          type:
            - array
            - "null"
        total:
          description: the user's threads carrying unread posts on this site, muted excluded — the red-dot number
          format: int64
          type: integer
      required:
        - threads
        - total
      type: object
    UnreadThreadView:
      additionalProperties: false
      properties:
        state:
          $ref: "#/components/schemas/ThreadUserView"
        thread:
          $ref: "#/components/schemas/ThreadView"
      required:
        - thread
        - state
      type: object
    UpdateBoardRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/UpdateBoardRequest.json
          format: uri
          readOnly: true
          type: string
        actor_id:
          description: the site admin making the change; recorded in the audit log
          format: int64
          type: integer
        color:
          description: an empty string clears it
          maxLength: 32
          type: string
        content_rating:
          description: applies to topics opened from now on; existing topics keep theirs
          enum:
            - 0
            - 1
            - 2
          format: int32
          type: integer
        description:
          description: an empty string clears it
          maxLength: 1000
          type: string
        format:
          enum:
            - 0
            - 1
            - 2
          format: int32
          type: integer
        icon:
          description: an empty string clears it
          maxLength: 64
          type: string
        name:
          maxLength: 64
          minLength: 1
          type: string
        parent_id:
          description: move under this top-level board; 0 = move to the top level
          format: int64
          type: integer
        reply_min_trust_level:
          format: int32
          maximum: 3
          minimum: 0
          type: integer
        slug:
          maxLength: 64
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          type: string
        status:
          description: 0=active 1=archived
          enum:
            - 0
            - 1
          format: int32
          type: integer
        topic_min_trust_level:
          format: int32
          maximum: 3
          minimum: 0
          type: integer
        topic_template:
          description: an empty string clears it
          maxLength: 10000
          type: string
      required:
        - actor_id
      type: object
info:
  title: KUN Community Service
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/community/anchors/notification:
    post:
      operationId: setAnchorNotification
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnchorNotificationRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAnchorSubscriptionView"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Set a user's notification level for an anchor (0=muted 1=normal 3=watching 4=watching first post)
      tags:
        - community-engagement
  /api/v1/community/anchors/states:
    post:
      operationId: anchorStates
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnchorStatesRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAnchorStatesResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Batch stored subscription state for a user over a set of anchors
      tags:
        - community-engagement
  /api/v1/community/authors/stats:
    get:
      operationId: authorStats
      parameters:
        - description: comma-separated author ids (max 100)
          explode: false
          in: query
          name: ids
          schema:
            description: comma-separated author ids (max 100)
            type: string
        - description: thread kind filter (0=topic 1=comments 2=feedback); -1 = every kind
          explode: false
          in: query
          name: kind
          schema:
            default: -1
            description: thread kind filter (0=topic 1=comments 2=feedback); -1 = every kind
            format: int32
            type: integer
        - description: anchor kind filter (0-4); -1 = every anchor kind
          explode: false
          in: query
          name: anchor_kind
          schema:
            default: -1
            description: anchor kind filter (0-4); -1 = every anchor kind
            format: int32
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAuthorStatsResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Batch visible-post counts for a site's authors
      tags:
        - community-read
  /api/v1/community/authors/top:
    get:
      operationId: topAuthors
      parameters:
        - description: thread kind filter (0=topic 1=comments 2=feedback); -1 = every kind
          explode: false
          in: query
          name: kind
          schema:
            default: -1
            description: thread kind filter (0=topic 1=comments 2=feedback); -1 = every kind
            format: int32
            type: integer
        - description: anchor kind filter (0-4); -1 = every anchor kind
          explode: false
          in: query
          name: anchor_kind
          schema:
            default: -1
            description: anchor kind filter (0-4); -1 = every anchor kind
            format: int32
            type: integer
        - description: how many authors (default 50, max 100)
          explode: false
          in: query
          name: limit
          schema:
            description: how many authors (default 50, max 100)
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAuthorStatsResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: The site's most-posted-in authors, most first
      tags:
        - community-read
  /api/v1/community/authors/{id}/posts:
    get:
      operationId: listAuthorPosts
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
        - description: post id to read after (descending; 0 = newest first)
          explode: false
          in: query
          name: after
          schema:
            description: post id to read after (descending; 0 = newest first)
            format: int64
            type: integer
        - description: optional anchor-kind filter (0-4); -1 = all kinds
          explode: false
          in: query
          name: anchor_kind
          schema:
            default: -1
            description: optional anchor-kind filter (0-4); -1 = all kinds
            format: int32
            type: integer
        - description: page size (default 20, max 100)
          explode: false
          in: query
          name: limit
          schema:
            description: page size (default 20, max 100)
            format: int64
            type: integer
        - description: fill viewer_reacted for this user; 0 = no viewer
          explode: false
          in: query
          name: viewer_id
          schema:
            description: fill viewer_reacted for this user; 0 = no viewer
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAuthorPostsResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: List a site author's visible posts across threads (keyset by post id, newest first) with thread context
      tags:
        - community-read
  /api/v1/community/authors/{id}/purge:
    post:
      operationId: purgeAuthor
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePurgeResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: "Compliance purge: tombstone + scrub all of a site author's posts and delete their reactions (idempotent)"
      tags:
        - community-write
  /api/v1/community/authors/{id}/purge/restore:
    post:
      operationId: restoreAuthor
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeRestoreResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: "Undo this site's purges of an author from the last 30 days: give back the scrubbed posts and the deleted rows"
      tags:
        - community-write
  /api/v1/community/boards:
    get:
      operationId: listBoards
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBoardListResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: List the site's boards in display order, with their topic stats
      tags:
        - community-boards
    post:
      operationId: createBoard
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBoardRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBoardResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Create a board (top level, or under a top-level board)
      tags:
        - community-boards
  /api/v1/community/boards/by-slug/{slug}:
    get:
      operationId: getBoardBySlug
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBoardResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Get a board by its slug, with its topic stats
      tags:
        - community-boards
  /api/v1/community/boards/reorder:
    post:
      operationId: reorderBoards
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderBoardsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOKResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Set the order of one parent's boards
      tags:
        - community-boards
  /api/v1/community/boards/{id}:
    delete:
      operationId: deleteBoard
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
        - description: the site admin making the change; recorded in the audit log
          explode: false
          in: query
          name: actor_id
          schema:
            description: the site admin making the change; recorded in the audit log
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOKResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Delete a board that holds no topics and no sub-boards
      tags:
        - community-boards
    get:
      operationId: getBoard
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBoardResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Get a board by id, with its topic stats
      tags:
        - community-boards
    patch:
      operationId: updateBoard
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBoardRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBoardResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Change a board's settings, parent or status
      tags:
        - community-boards
  /api/v1/community/comments:
    get:
      operationId: getComments
      parameters:
        - description: 1=site_game 2=site_resource 3=catalog_work 4=catalog_person
          explode: false
          in: query
          name: anchor_kind
          schema:
            description: 1=site_game 2=site_resource 3=catalog_work 4=catalog_person
            format: int32
            type: integer
        - explode: false
          in: query
          name: anchor_id
          schema:
            type: string
        - description: post_number to read after (0 = from the top)
          explode: false
          in: query
          name: after
          schema:
            description: post_number to read after (0 = from the top)
            format: int32
            type: integer
        - description: page size (max 100, default 50)
          explode: false
          in: query
          name: limit
          schema:
            description: page size (max 100, default 50)
            format: int64
            type: integer
        - description: fill viewer_reacted for this user; 0 = no viewer
          explode: false
          in: query
          name: viewer_id
          schema:
            description: fill viewer_reacted for this user; 0 = no viewer
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCommentsPage"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Read an anchor's comments and its thread (both absent until the first comment)
      tags:
        - community-read
    post:
      operationId: comment
      parameters:
        - description: "Makes the call safe to retry: a later call in the same site with the same key and the same body answers with the comment the first one wrote (header Idempotency-Replayed: true) instead of writing another; the same key with a different body is 409. Keys are kept for 24 hours."
          in: header
          name: Idempotency-Key
          schema:
            description: "Makes the call safe to retry: a later call in the same site with the same key and the same body answers with the comment the first one wrote (header Idempotency-Replayed: true) instead of writing another; the same key with a different body is 409. Keys are kept for 24 hours."
            maxLength: 255
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeThreadResponse"
          description: OK
          headers:
            Idempotency-Replayed:
              schema:
                description: true when this answer replays an earlier call with the same Idempotency-Key
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Comment on an anchor; the first comment is what creates the comments thread
      tags:
        - community-write
  /api/v1/community/comments/resolve:
    post:
      deprecated: true
      operationId: resolveComments
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentsResolveRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeThreadWithPosts"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: "Deprecated: get-or-create the comments thread for an anchor. Read with GET /comments and write with POST /comments — this face mints a thread on a read"
      tags:
        - community-read
  /api/v1/community/feedback:
    post:
      operationId: openFeedback
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenFeedbackRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeThreadResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Open a feedback thread with its opening post
      tags:
        - community-write
  /api/v1/community/feedback/{id}/merge:
    post:
      operationId: mergeFeedback
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackMergeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOKResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Merge a duplicate feedback thread into another (reversible)
      tags:
        - community-write
  /api/v1/community/feedback/{id}/status:
    post:
      operationId: setFeedbackStatus
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackStatusRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOKResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Set a feedback thread's status and official response
      tags:
        - community-write
  /api/v1/community/notifications/feed:
    get:
      operationId: notificationFeed
      parameters:
        - description: return rows with seq greater than this; 0 = from the start
          explode: false
          in: query
          name: after
          schema:
            description: return rows with seq greater than this; 0 = from the start
            format: int64
            type: integer
        - description: page size (default 100, max 500)
          explode: false
          in: query
          name: limit
          schema:
            description: page size (default 100, max 500)
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeNotificationFeedResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: A site's notification feed in seq order, for a site that mirrors into its own inbox
      tags:
        - community-notifications
  /api/v1/community/posts:
    get:
      operationId: listSitePosts
      parameters:
        - description: thread kind filter (0=topic 1=comments 2=feedback); -1 = every kind
          explode: false
          in: query
          name: kind
          schema:
            default: -1
            description: thread kind filter (0=topic 1=comments 2=feedback); -1 = every kind
            format: int32
            type: integer
        - description: anchor kind filter (0-4); -1 = every anchor kind
          explode: false
          in: query
          name: anchor_kind
          schema:
            default: -1
            description: anchor kind filter (0-4); -1 = every anchor kind
            format: int32
            type: integer
        - description: "optional: narrow to a single anchor (requires anchor_kind)"
          explode: false
          in: query
          name: anchor_id
          schema:
            description: "optional: narrow to a single anchor (requires anchor_kind)"
            type: string
        - description: skip opening posts (post_number = 1), leaving only replies
          explode: false
          in: query
          name: replies_only
          schema:
            description: skip opening posts (post_number = 1), leaving only replies
            type: boolean
        - description: opaque cursor from the previous page
          explode: false
          in: query
          name: cursor
          schema:
            description: opaque cursor from the previous page
            type: string
        - description: page size (max 100, default 50)
          explode: false
          in: query
          name: limit
          schema:
            description: page size (max 100, default 50)
            format: int64
            type: integer
        - description: fill viewer_reacted for this user; 0 = no viewer
          explode: false
          in: query
          name: viewer_id
          schema:
            description: fill viewer_reacted for this user; 0 = no viewer
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePostFeedResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: List the site's newest posts across every thread (keyset by post creation time)
      tags:
        - community-read
  /api/v1/community/posts/resolve:
    post:
      operationId: resolvePosts
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostsResolveRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePostsResolveResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Resolve a batch of posts by id (visible only, request order, deduped) with thread context
      tags:
        - community-read
  /api/v1/community/posts/{id}:
    delete:
      operationId: deletePost
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
        - description: the acting user (the post author, or the moderator when as_moderator)
          explode: false
          in: query
          name: author_id
          schema:
            description: the acting user (the post author, or the moderator when as_moderator)
            format: int64
            type: integer
        - description: "mod-actor variant: skip the author match; the site vouches author_id is its moderator"
          explode: false
          in: query
          name: as_moderator
          schema:
            description: "mod-actor variant: skip the author match; the site vouches author_id is its moderator"
            type: boolean
      responses:
        "200":
          content:
            application/json:
