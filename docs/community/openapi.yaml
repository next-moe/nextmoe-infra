components:
  schemas:
    ActivityReceiptRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ActivityReceiptRequest.json
          format: uri
          readOnly: true
          type: string
        days_visited:
          format: int32
          type: integer
        posts_read:
          format: int32
          type: integer
        read_time_s:
          format: int32
          type: integer
        topics_entered:
          format: int32
          type: integer
        user_id:
          format: int64
          type: integer
        window_active_days:
          format: int32
          type: integer
      required:
        - user_id
        - topics_entered
        - posts_read
        - read_time_s
        - days_visited
      type: object
    AuthorPostView:
      additionalProperties: false
      properties:
        post:
          $ref: "#/components/schemas/PostView"
        thread:
          $ref: "#/components/schemas/PostThreadContext"
      required:
        - post
        - thread
      type: object
    AuthorPostsResponse:
      additionalProperties: false
      properties:
        next_cursor:
          description: post id to pass as after for the next (older) page; empty = last page
          type: string
        posts:
          items:
            $ref: "#/components/schemas/AuthorPostView"
          type:
            - array
            - "null"
      required:
        - posts
      type: object
    AuthorStat:
      additionalProperties: false
      properties:
        author_id:
          format: int64
          type: integer
        visible_posts:
          format: int64
          type: integer
      required:
        - author_id
        - visible_posts
      type: object
    AuthorStatsResponse:
      additionalProperties: false
      properties:
        stats:
          items:
            $ref: "#/components/schemas/AuthorStat"
          type:
            - array
            - "null"
      required:
        - stats
      type: object
    CommentsResolveRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/CommentsResolveRequest.json
          format: uri
          readOnly: true
          type: string
        anchor_id:
          type: string
        anchor_kind:
          description: 0=board 1=site_game 2=site_resource 3=catalog_work 4=catalog_person
          format: int32
          type: integer
        content_rating:
          description: 0=all 1=r15 2=r18 (inherited from the anchor)
          format: int32
          type: integer
      required:
        - anchor_kind
        - anchor_id
        - content_rating
      type: object
    EditPostRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EditPostRequest.json
          format: uri
          readOnly: true
          type: string
        as_moderator:
          description: "mod-actor variant: skip the author match; the site vouches author_id is its moderator"
          type: boolean
        author_id:
          description: the acting user (the post author, or the moderator when as_moderator)
          format: int64
          type: integer
        body:
          description: new markdown source; re-cooked + sanitized on write
          type: string
      required:
        - author_id
        - body
      type: object
    EnvelopeAuthorPostsResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EnvelopeAuthorPostsResponse.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        data:
          $ref: "#/components/schemas/AuthorPostsResponse"
        message:
          type: string
      required:
        - code
        - message
      type: object
    EnvelopeAuthorStatsResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EnvelopeAuthorStatsResponse.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        data:
