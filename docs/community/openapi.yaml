components:
  schemas:
    ActivityReceiptRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ActivityReceiptRequest.json
          format: uri
          readOnly: true
          type: string
        days_visited:
          format: int32
          type: integer
        posts_read:
          format: int32
          type: integer
        read_time_s:
          format: int32
          type: integer
        topics_entered:
          format: int32
          type: integer
        user_id:
          format: int64
          type: integer
        window_active_days:
          format: int32
          type: integer
      required:
        - user_id
        - topics_entered
        - posts_read
        - read_time_s
        - days_visited
      type: object
    AnchorNotificationRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/AnchorNotificationRequest.json
          format: uri
          readOnly: true
          type: string
        anchor_id:
          type: string
        anchor_kind:
          description: 0=board 1=site_game 2=site_resource 3=catalog_work 4=catalog_person
          format: int32
          type: integer
        level:
          description: 0=muted 1=normal 3=watching 4=watching first post; 2 (tracking) is thread-only
          format: int32
          type: integer
        user_id:
          format: int64
          type: integer
      required:
        - user_id
        - anchor_kind
        - anchor_id
        - level
      type: object
    AnchorRef:
      additionalProperties: false
      properties:
        anchor_id:
          type: string
        anchor_kind:
          description: 0=board 1=site_game 2=site_resource 3=catalog_work 4=catalog_person
          format: int32
          type: integer
      required:
        - anchor_kind
        - anchor_id
      type: object
    AnchorStatesRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/AnchorStatesRequest.json
          format: uri
          readOnly: true
          type: string
        anchors:
          description: anchors to report on (max 100); a normal (unsubscribed) anchor is simply absent from the response
          items:
            $ref: "#/components/schemas/AnchorRef"
          type:
            - array
            - "null"
        user_id:
          format: int64
          type: integer
      required:
        - user_id
        - anchors
      type: object
    AnchorStatesResponse:
      additionalProperties: false
      properties:
        states:
          items:
            $ref: "#/components/schemas/AnchorSubscriptionView"
          type:
            - array
            - "null"
      required:
        - states
      type: object
    AnchorSubscriptionListResponse:
      additionalProperties: false
      properties:
        next_cursor:
          description: id of the last row, passed as cursor for the next (older) page; empty = last page
          type: string
        subscriptions:
          items:
            $ref: "#/components/schemas/AnchorSubscriptionView"
          type:
            - array
            - "null"
      required:
        - subscriptions
      type: object
    AnchorSubscriptionView:
      additionalProperties: false
      properties:
        anchor_id:
          type: string
        anchor_kind:
          description: 0=board 1=site_game 2=site_resource 3=catalog_work 4=catalog_person
          format: int32
          type: integer
        board_id:
          description: the board this subscription names (its anchor_id as a number)
          format: int64
          type: integer
        notification_level:
          description: 0=muted 1=normal 3=watching 4=watching first post; 2 (tracking) is thread-only
          format: int32
          type: integer
        user_id:
          format: int64
          type: integer
      required:
        - user_id
        - anchor_kind
        - anchor_id
        - notification_level
      type: object
    AuthorPostView:
      additionalProperties: false
      properties:
        post:
          $ref: "#/components/schemas/PostView"
        thread:
          $ref: "#/components/schemas/PostThreadContext"
      required:
        - post
        - thread
      type: object
    AuthorPostsResponse:
      additionalProperties: false
      properties:
        next_cursor:
          description: post id to pass as after for the next (older) page; empty = last page
          type: string
        posts:
          items:
            $ref: "#/components/schemas/AuthorPostView"
          type:
            - array
            - "null"
      required:
        - posts
      type: object
    AuthorStat:
      additionalProperties: false
      properties:
        author_id:
          format: int64
          type: integer
        visible_posts:
          format: int64
          type: integer
      required:
        - author_id
        - visible_posts
      type: object
    AuthorStatsResponse:
      additionalProperties: false
      properties:
        stats:
          items:
            $ref: "#/components/schemas/AuthorStat"
          type:
            - array
            - "null"
      required:
        - stats
      type: object
    BoardListResponse:
      additionalProperties: false
      properties:
        boards:
          description: "display order: each top-level board followed by its sub-boards, each group by position"
          items:
            $ref: "#/components/schemas/BoardView"
          type:
            - array
            - "null"
      required:
        - boards
      type: object
    BoardResponse:
      additionalProperties: false
      properties:
        board:
          $ref: "#/components/schemas/BoardView"
      required:
        - board
      type: object
    BoardStats:
      additionalProperties: false
      properties:
        last_posted_at:
          format: date-time
          type: string
        last_thread_id:
          description: the most recently active of those topics
          format: int64
          type: integer
        last_thread_title:
          type: string
        posts_count:
          description: the sum of those topics' posts_count (post numbers allocated, tombstones included)
          format: int64
          type: integer
        topics_count:
          description: "topics a reader can see: live threads whose opening post is visible"
          format: int64
          type: integer
      required:
        - topics_count
        - posts_count
      type: object
    BoardView:
      additionalProperties: false
      properties:
        color:
          description: a palette token the site maps onto its theme
          type: string
        content_rating:
          description: "the floor for its topics' rating: 0=all 1=r15 2=r18"
          format: int32
          type: integer
        created_at:
          format: date-time
          type: string
        description:
          type: string
        format:
          description: 0=discussion 1=qa 2=announcement
          format: int32
          type: integer
        icon:
          description: an emoji, an icon name or an image hash; the site decides how to render it
          type: string
        id:
          format: int64
          type: integer
        name:
          type: string
        parent_id:
          description: the top-level board this one sits under; boards nest one level
          format: int64
          type: integer
        position:
          description: order among its siblings, ascending
          format: int32
          type: integer
        reply_min_trust_level:
          format: int32
          type: integer
        site:
          type: string
        slug:
          type: string
        stats:
          $ref: "#/components/schemas/BoardStats"
        status:
          description: 0=active 1=archived (readable; no new topics or replies)
          format: int32
          type: integer
        topic_min_trust_level:
          format: int32
          type: integer
        topic_template:
          description: markdown the composer starts from
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - site
        - slug
        - name
        - position
        - format
        - status
        - content_rating
        - topic_min_trust_level
        - reply_min_trust_level
        - created_at
        - updated_at
        - stats
      type: object
    CloseThreadRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/CloseThreadRequest.json
          format: uri
          readOnly: true
          type: string
        actor_id:
          description: the moderator; recorded in the audit log
          format: int64
          type: integer
        closed:
          description: true closes the thread to new posts, false reopens it
          type: boolean
      required:
        - actor_id
        - closed
      type: object
    CommentRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/CommentRequest.json
          format: uri
          readOnly: true
          type: string
        anchor_id:
          type: string
        anchor_kind:
          description: 1=site_game 2=site_resource 3=catalog_work 4=catalog_person
          format: int32
          type: integer
        author_id:
          format: int64
          type: integer
        body:
          description: markdown source
          type: string
        content_rating:
          description: 0=all 1=r15 2=r18 (inherited from the anchor); applied only when this comment is the one that creates the thread
          format: int32
          type: integer
        mention_user_ids:
          description: the site resolves @name to user ids; community only delivers
          items:
            format: int64
            type: integer
          maxItems: 20
          type:
            - array
            - "null"
        reply_to_post_id:
          format: int64
          type: integer
        root_post_id:
          format: int64
          type: integer
        target_user_id:
          format: int64
          type: integer
      required:
        - anchor_kind
        - anchor_id
        - content_rating
        - author_id
        - body
      type: object
    CommentsPage:
      additionalProperties: false
      properties:
        next_cursor:
          description: post_number to pass as after for the next page; empty = last page
          type: string
        posts:
          items:
            $ref: "#/components/schemas/PostView"
          type:
            - array
            - "null"
        thread:
          $ref: "#/components/schemas/ThreadView"
          description: absent until the anchor's first comment creates the thread; posts is then empty too
      required:
        - posts
      type: object
    CommentsResolveRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/CommentsResolveRequest.json
          format: uri
          readOnly: true
          type: string
        anchor_id:
          type: string
        anchor_kind:
          description: 0=board 1=site_game 2=site_resource 3=catalog_work 4=catalog_person
          format: int32
          type: integer
        content_rating:
          description: 0=all 1=r15 2=r18 (inherited from the anchor)
          format: int32
          type: integer
      required:
        - anchor_kind
        - anchor_id
        - content_rating
      type: object
    CreateBoardRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/CreateBoardRequest.json
          format: uri
          readOnly: true
          type: string
        actor_id:
          description: the site admin making the change; recorded in the audit log
          format: int64
          type: integer
        color:
          maxLength: 32
          type: string
        content_rating:
          description: "the floor for its topics' rating: 0=all 1=r15 2=r18"
          enum:
            - 0
            - 1
            - 2
          format: int32
          type: integer
        description:
          maxLength: 1000
          type: string
        format:
          description: 0=discussion 1=qa (a topic can mark its answer) 2=announcement (only moderators open topics)
          enum:
            - 0
            - 1
            - 2
          format: int32
          type: integer
        icon:
          maxLength: 64
          type: string
        name:
          maxLength: 64
          minLength: 1
          type: string
        parent_id:
          description: a top-level board to nest this one under; 0 = top level
          format: int64
          type: integer
        reply_min_trust_level:
          description: trust level needed to reply to its topics
          format: int32
          maximum: 3
          minimum: 0
          type: integer
        slug:
          description: "URL key, unique on the site: lowercase letters, digits and single hyphens, and not all digits"
          maxLength: 64
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          type: string
        topic_min_trust_level:
          description: trust level needed to open a topic; moderators are exempt
          format: int32
          maximum: 3
          minimum: 0
          type: integer
        topic_template:
          maxLength: 10000
          type: string
      required:
        - actor_id
        - slug
        - name
      type: object
    EditPostRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EditPostRequest.json
          format: uri
          readOnly: true
          type: string
        as_moderator:
          description: "mod-actor variant: skip the author match; the site vouches author_id is its moderator"
          type: boolean
        author_id:
          description: the acting user (the post author, or the moderator when as_moderator)
          format: int64
          type: integer
        body:
          description: new markdown source; re-cooked + sanitized on write
          type: string
      required:
        - author_id
        - body
      type: object
    EnvelopeAnchorStatesResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
