            - https://example.com/OpenFeedbackRequest.json
          format: uri
          readOnly: true
          type: string
        anchor_id:
          type: string
        anchor_kind:
          format: int32
          type: integer
        author_id:
          format: int64
          type: integer
        body:
          type: string
        content_rating:
          format: int32
          type: integer
        title:
          type: string
      required:
        - author_id
        - anchor_kind
        - anchor_id
        - title
        - content_rating
        - body
      type: object
    OpenTopicRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/OpenTopicRequest.json
          format: uri
          readOnly: true
          type: string
        anchor_id:
          description: board id
          type: string
        author_id:
          format: int64
          type: integer
        body:
          description: markdown source of the opening post
          type: string
        content_rating:
          format: int32
          type: integer
        header_image_hashes:
          items:
            type: string
          type:
            - array
            - "null"
        title:
          type: string
      required:
        - author_id
        - anchor_id
        - title
        - content_rating
        - body
      type: object
    PostFeedResponse:
      additionalProperties: false
      properties:
        next_cursor:
          description: opaque cursor for the next (older) page; empty = last page
          type: string
        posts:
          items:
            $ref: "#/components/schemas/AuthorPostView"
          type:
            - array
            - "null"
      required:
        - posts
      type: object
    PostListResponse:
      additionalProperties: false
      properties:
        next_cursor:
          type: string
        posts:
          items:
            $ref: "#/components/schemas/PostView"
          type:
            - array
            - "null"
      required:
        - posts
      type: object
    PostResponse:
      additionalProperties: false
      properties:
        post:
          $ref: "#/components/schemas/PostView"
      required:
        - post
      type: object
    PostThreadContext:
      additionalProperties: false
      properties:
        anchor_id:
          type: string
        anchor_kind:
          description: 0=board 1=site_game 2=site_resource 3=catalog_work 4=catalog_person
          format: int32
          type: integer
        thread_id:
          format: int64
          type: integer
        title:
          description: thread title (NULL for a comments thread)
          type: string
      required:
        - thread_id
        - anchor_kind
        - anchor_id
      type: object
    PostView:
      additionalProperties: false
      properties:
        author_id:
          format: int64
          type: integer
        content_html:
          type: string
        content_rating:
          format: int32
          type: integer
        content_raw:
          type: string
        created_at:
          format: date-time
          type: string
        edited_at:
          format: date-time
          type: string
        edited_by_moderator:
          description: true when the latest edit was a mod-actor edit (as_moderator)
          type: boolean
        id:
          format: int64
          type: integer
        post_number:
          format: int32
          type: integer
        reply_to_post_id:
          format: int64
          type: integer
        root_post_id:
          format: int64
          type: integer
        status:
          format: int32
          type: integer
        target_user_id:
          format: int64
          type: integer
        thread_id:
          format: int64
          type: integer
      required:
        - id
        - thread_id
        - post_number
        - author_id
        - content_raw
        - content_html
        - content_rating
        - status
        - created_at
      type: object
    PostsResolveRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/PostsResolveRequest.json
          format: uri
          readOnly: true
          type: string
        ids:
          description: post ids to hydrate (max 100; deduped; only visible posts return)
          items:
            format: int64
            type: integer
          type:
            - array
            - "null"
      required:
        - ids
      type: object
    PostsResolveResponse:
      additionalProperties: false
      properties:
        posts:
          items:
            $ref: "#/components/schemas/AuthorPostView"
          type:
            - array
            - "null"
      required:
        - posts
      type: object
    PurgeResponse:
      additionalProperties: false
      properties:
        posts_purged:
          description: posts tombstoned + content-scrubbed this run
          format: int64
          type: integer
        reactions_deleted:
          description: reaction rows the author left that were deleted this run
          format: int64
          type: integer
        read_states_deleted:
          description: read/subscription rows (which threads they opened, how far they read) deleted this run
          format: int64
          type: integer
      required:
        - posts_purged
        - reactions_deleted
        - read_states_deleted
      type: object
    ReactionToggleRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ReactionToggleRequest.json
          format: uri
          readOnly: true
          type: string
        kind:
          description: reaction kind (0=like)
          format: int32
          type: integer
        user_id:
          format: int64
          type: integer
      required:
        - user_id
        - kind
      type: object
    ReactionToggleResponse:
      additionalProperties: false
      properties:
        added:
          type: boolean
        anchor_id:
          type: string
        anchor_kind:
          format: int32
          type: integer
        author_id:
          description: the post's author (the like-notification recipient)
          format: int64
          type: integer
        thread_id:
          format: int64
          type: integer
      required:
        - added
        - author_id
        - thread_id
        - anchor_kind
        - anchor_id
      type: object
    ReplyRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ReplyRequest.json
          format: uri
          readOnly: true
          type: string
        author_id:
          format: int64
          type: integer
        body:
          type: string
        reply_to_post_id:
          format: int64
          type: integer
        root_post_id:
          format: int64
          type: integer
        target_user_id:
          format: int64
          type: integer
      required:
        - author_id
        - body
      type: object
    ReviewDecisionRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ReviewDecisionRequest.json
          format: uri
          readOnly: true
          type: string
        decided_by:
          format: int64
          type: integer
      required:
        - decided_by
      type: object
    ReviewItemView:
      additionalProperties: false
      properties:
        author_id:
          description: the subject post's author
          format: int64
          type: integer
        decided_by:
          format: int64
          type: integer
        id:
          format: int64
          type: integer
        post_id:
          format: int64
          type: integer
        site:
          type: string
        source:
          description: 0=flags 1=first_post_hold 2=suspect_words 3=external
          format: int32
          type: integer
        status:
          description: 0=pending 1=approved 2=rejected
          format: int32
          type: integer
        thread_id:
          description: the subject post's thread (deep-link target)
          format: int64
          type: integer
      required:
        - id
        - status
      type: object
    ReviewListResponse:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/ReviewItemView"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    SetBoostRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/SetBoostRequest.json
          format: uri
          readOnly: true
          type: string
        boost:
          description: 0=none 1=veteran 2=creator 3=staff
          format: int32
          type: integer
        user_id:
          format: int64
          type: integer
      required:
        - user_id
        - boost
      type: object
    ThreadListResponse:
      additionalProperties: false
      properties:
        next_cursor:
          type: string
        threads:
          items:
            $ref: "#/components/schemas/ThreadView"
          type:
            - array
            - "null"
      required:
        - threads
      type: object
    ThreadNotificationRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ThreadNotificationRequest.json
          format: uri
          readOnly: true
          type: string
        level:
          description: 0=muted 1=normal 2=tracking 3=watching
          format: int32
          type: integer
        user_id:
          format: int64
          type: integer
      required:
        - user_id
        - level
      type: object
    ThreadReadRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ThreadReadRequest.json
          format: uri
          readOnly: true
          type: string
        last_read_post_number:
          description: how far the user has read; clamped to the thread's highest post number and never walked backwards
          format: int32
          type: integer
        user_id:
          format: int64
          type: integer
      required:
        - user_id
        - last_read_post_number
      type: object
    ThreadResponse:
      additionalProperties: false
      properties:
        post:
          $ref: "#/components/schemas/PostView"
          description: the opening post, for open-topic/feedback
        thread:
          $ref: "#/components/schemas/ThreadView"
      required:
        - thread
      type: object
    ThreadStatesRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ThreadStatesRequest.json
          format: uri
          readOnly: true
          type: string
        thread_ids:
          description: threads to report on (max 100); a thread the user never touched carries no row and is simply absent from the response
          items:
            format: int64
            type: integer
          type:
            - array
            - "null"
        user_id:
          format: int64
          type: integer
      required:
        - user_id
        - thread_ids
      type: object
    ThreadStatesResponse:
      additionalProperties: false
      properties:
        states:
          items:
            $ref: "#/components/schemas/ThreadUserView"
          type:
            - array
            - "null"
      required:
        - states
      type: object
    ThreadUserView:
      additionalProperties: false
      properties:
        highest_post_number:
          format: int32
          type: integer
        last_read_post_number:
          format: int32
          type: integer
        notification_level:
          description: 0=muted 1=normal 2=tracking 3=watching
          format: int32
          type: integer
        thread_id:
          format: int64
          type: integer
        unread_count:
          description: highest_post_number - last_read_post_number; a tombstone keeps its number, so a deleted post still counts as unread
          format: int32
          type: integer
        user_id:
          format: int64
          type: integer
      required:
        - thread_id
        - user_id
        - last_read_post_number
        - highest_post_number
        - unread_count
        - notification_level
      type: object
    ThreadView:
      additionalProperties: false
      properties:
        anchor_id:
          type: string
        anchor_kind:
          format: int32
          type: integer
        answer_post_id:
          format: int64
          type: integer
        content_rating:
          format: int32
          type: integer
        created_at:
          format: date-time
          type: string
        created_by:
          format: int64
          type: integer
        fb_response:
          type: string
        fb_status:
          format: int32
          type: integer
        header_image_hashes:
          description: Header image hashes as accepted at topic creation; empty for none
          items:
            type: string
          type:
            - array
            - "null"
        highest_post_number:
          format: int32
          type: integer
        id:
          format: int64
          type: integer
        kind:
          format: int32
          type: integer
        last_posted_at:
          format: date-time
          type: string
        merged_into_id:
          format: int64
          type: integer
        opening_author_id:
          format: int64
          type: integer
        opening_status:
          format: int32
          type: integer
        participants_count:
          format: int32
          type: integer
        posts_count:
          format: int32
          type: integer
        site:
          type: string
        status:
          format: int32
          type: integer
        title:
          type: string
      required:
        - id
        - site
        - kind
        - anchor_kind
        - anchor_id
        - content_rating
        - status
        - posts_count
        - participants_count
        - highest_post_number
        - created_by
        - created_at
      type: object
    ThreadWithPosts:
      additionalProperties: false
      properties:
        next_cursor:
          description: post_number to pass as after for the next page; empty = last page
          type: string
        posts:
          items:
            $ref: "#/components/schemas/PostView"
          type:
            - array
            - "null"
        thread:
          $ref: "#/components/schemas/ThreadView"
      required:
        - thread
        - posts
      type: object
    TrustView:
      additionalProperties: false
      properties:
        days_visited:
          format: int32
          type: integer
        first_posts_held_remaining:
          format: int32
          type: integer
        flags_agreed:
          format: int32
          type: integer
        flags_disagreed:
          format: int32
          type: integer
        granted_boost:
          format: int32
          type: integer
        level:
          format: int32
          type: integer
        likes_given:
          format: int32
          type: integer
        likes_received:
          format: int32
          type: integer
        posts_read:
          format: int32
          type: integer
        read_time_s:
          format: int32
          type: integer
        topics_entered:
          format: int32
          type: integer
        user_id:
          format: int64
          type: integer
      required:
        - user_id
        - level
        - first_posts_held_remaining
      type: object
    UnreadListResponse:
      additionalProperties: false
      properties:
        next_cursor:
          type: string
        threads:
          items:
            $ref: "#/components/schemas/UnreadThreadView"
          type:
            - array
            - "null"
        total:
          description: the user's threads carrying unread posts on this site, muted excluded — the red-dot number
          format: int64
          type: integer
      required:
        - threads
        - total
      type: object
    UnreadThreadView:
      additionalProperties: false
      properties:
        state:
          $ref: "#/components/schemas/ThreadUserView"
        thread:
          $ref: "#/components/schemas/ThreadView"
      required:
        - thread
        - state
      type: object
info:
  title: KUN Community Service
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/community/authors/stats:
    get:
      operationId: authorStats
      parameters:
        - description: comma-separated author ids (max 100)
          explode: false
          in: query
          name: ids
          schema:
            description: comma-separated author ids (max 100)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAuthorStatsResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Batch visible-post counts for a site's authors
      tags:
        - community-read
  /api/v1/community/authors/{id}/posts:
    get:
      operationId: listAuthorPosts
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
        - description: post id to read after (descending; 0 = newest first)
          explode: false
          in: query
          name: after
          schema:
            description: post id to read after (descending; 0 = newest first)
            format: int64
            type: integer
        - description: optional anchor-kind filter (0-4); -1 = all kinds
          explode: false
          in: query
          name: anchor_kind
          schema:
            default: -1
            description: optional anchor-kind filter (0-4); -1 = all kinds
            format: int32
            type: integer
        - description: page size (default 20, max 100)
          explode: false
          in: query
          name: limit
          schema:
            description: page size (default 20, max 100)
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAuthorPostsResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: List a site author's visible posts across threads (keyset by post id, newest first) with thread context
      tags:
        - community-read
  /api/v1/community/authors/{id}/purge:
    post:
      operationId: purgeAuthor
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePurgeResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: "Compliance purge: tombstone + scrub all of a site author's posts and delete their reactions (idempotent)"
      tags:
        - community-write
  /api/v1/community/comments/resolve:
    post:
      operationId: resolveComments
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentsResolveRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeThreadWithPosts"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Get-or-create the comments thread for an anchor and return its first page of posts
      tags:
        - community-read
  /api/v1/community/feedback:
    post:
      operationId: openFeedback
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenFeedbackRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeThreadResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Open a feedback thread with its opening post
      tags:
        - community-write
  /api/v1/community/feedback/{id}/merge:
    post:
      operationId: mergeFeedback
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackMergeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOKResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Merge a duplicate feedback thread into another (reversible)
      tags:
        - community-write
  /api/v1/community/feedback/{id}/status:
    post:
      operationId: setFeedbackStatus
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackStatusRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOKResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Set a feedback thread's status and official response
      tags:
        - community-write
  /api/v1/community/posts:
    get:
      operationId: listSitePosts
      parameters:
        - description: thread kind filter (0=topic 1=comments 2=feedback); -1 = every kind
          explode: false
          in: query
          name: kind
          schema:
            default: -1
            description: thread kind filter (0=topic 1=comments 2=feedback); -1 = every kind
            format: int32
            type: integer
        - description: anchor kind filter (0-4); -1 = every anchor kind
          explode: false
          in: query
          name: anchor_kind
          schema:
            default: -1
            description: anchor kind filter (0-4); -1 = every anchor kind
            format: int32
            type: integer
        - description: "optional: narrow to a single anchor (requires anchor_kind)"
          explode: false
          in: query
          name: anchor_id
          schema:
            description: "optional: narrow to a single anchor (requires anchor_kind)"
            type: string
        - description: skip opening posts (post_number = 1), leaving only replies
          explode: false
          in: query
          name: replies_only
          schema:
            description: skip opening posts (post_number = 1), leaving only replies
            type: boolean
        - description: opaque cursor from the previous page
          explode: false
          in: query
          name: cursor
          schema:
            description: opaque cursor from the previous page
            type: string
        - description: page size (max 100, default 50)
          explode: false
          in: query
          name: limit
          schema:
            description: page size (max 100, default 50)
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePostFeedResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: List the site's newest posts across every thread (keyset by post creation time)
      tags:
        - community-read
  /api/v1/community/posts/resolve:
    post:
      operationId: resolvePosts
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostsResolveRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePostsResolveResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Resolve a batch of posts by id (visible only, request order, deduped) with thread context
      tags:
        - community-read
  /api/v1/community/posts/{id}:
    delete:
      operationId: deletePost
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
        - description: the acting user (the post author, or the moderator when as_moderator)
          explode: false
          in: query
          name: author_id
          schema:
            description: the acting user (the post author, or the moderator when as_moderator)
            format: int64
            type: integer
        - description: "mod-actor variant: skip the author match; the site vouches author_id is its moderator"
          explode: false
          in: query
          name: as_moderator
          schema:
            description: "mod-actor variant: skip the author match; the site vouches author_id is its moderator"
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOKResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Delete a post (author self-delete, or a site moderator via as_moderator; tombstone, post_number preserved)
      tags:
        - community-write
    patch:
      operationId: editPost
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditPostRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePostResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Edit a post (author, or a site moderator via as_moderator; re-sanitized, stamps edited_at)
      tags:
        - community-write
  /api/v1/community/posts/{id}/flag:
    post:
      operationId: submitFlag
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlagRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOKResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Report a post
      tags:
        - community-write
  /api/v1/community/posts/{id}/reaction:
    post:
      operationId: toggleReaction
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactionToggleRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeReactionToggleResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Toggle a reaction on a post
      tags:
        - community-write
  /api/v1/community/review:
    get:
      operationId: listReview
      parameters:
        - description: filter to one source; -1 = all
          explode: false
          in: query
          name: source
          schema:
            default: -1
            description: filter to one source; -1 = all
            format: int32
            type: integer
        - explode: false
          in: query
          name: limit
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeReviewListResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: List the site's pending moderation-queue items
      tags:
        - community-review
  /api/v1/community/review/{id}/approve:
    post:
      operationId: approveReview
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecisionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOKResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Approve a queue item (keep the content; restore the post)
      tags:
        - community-review
  /api/v1/community/review/{id}/reject:
    post:
      operationId: rejectReview
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecisionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOKResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Reject a queue item (remove the content; tombstone the post)
      tags:
        - community-review
  /api/v1/community/search/posts:
    get:
      operationId: searchPosts
      parameters:
        - description: substring to look for, 2-100 characters; matched case-insensitively against the markdown source (posts) or the title (threads)
          explode: false
          in: query
          name: q
          schema:
            description: substring to look for, 2-100 characters; matched case-insensitively against the markdown source (posts) or the title (threads)
            type: string
        - description: thread kind filter (0=topic 1=comments 2=feedback); -1 = every kind
          explode: false
          in: query
          name: kind
          schema:
            default: -1
            description: thread kind filter (0=topic 1=comments 2=feedback); -1 = every kind
            format: int32
            type: integer
        - description: opaque cursor from the previous page
          explode: false
          in: query
          name: cursor
          schema:
            description: opaque cursor from the previous page
            type: string
        - description: page size (max 100, default 50)
          explode: false
          in: query
          name: limit
          schema:
            description: page size (max 100, default 50)
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePostFeedResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Search the site's visible posts by substring of their markdown source
      tags:
        - community-read
  /api/v1/community/search/threads:
    get:
      operationId: searchThreads
      parameters:
        - description: substring to look for, 2-100 characters; matched case-insensitively against the markdown source (posts) or the title (threads)
          explode: false
          in: query
          name: q
          schema:
            description: substring to look for, 2-100 characters; matched case-insensitively against the markdown source (posts) or the title (threads)
            type: string
        - description: thread kind filter (0=topic 1=comments 2=feedback); -1 = every kind
          explode: false
          in: query
          name: kind
          schema:
            default: -1
            description: thread kind filter (0=topic 1=comments 2=feedback); -1 = every kind
            format: int32
            type: integer
        - description: opaque cursor from the previous page
          explode: false
          in: query
          name: cursor
          schema:
            description: opaque cursor from the previous page
            type: string
        - description: page size (max 100, default 50)
          explode: false
          in: query
          name: limit
          schema:
            description: page size (max 100, default 50)
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeThreadListResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Search the site's threads by substring of their title
      tags:
        - community-read
  /api/v1/community/threads:
    get:
      operationId: listThreads
      parameters:
        - description: 0=topic 1=comments 2=feedback
          explode: false
          in: query
          name: kind
          schema:
            description: 0=topic 1=comments 2=feedback
            format: int32
            type: integer
        - description: anchor kind for the optional anchor filter (only used when anchor_id is set)
          explode: false
          in: query
          name: anchor_kind
          schema:
            description: anchor kind for the optional anchor filter (only used when anchor_id is set)
            format: int32
            type: integer
        - description: "optional: narrow to a single anchor (e.g. a resource's feedback wall); empty = the whole site"
          explode: false
          in: query
          name: anchor_id
          schema:
            description: "optional: narrow to a single anchor (e.g. a resource's feedback wall); empty = the whole site"
            type: string
        - description: activity (newest activity) | created (newest thread) | posts (most replies; a mutable key, so a row can move between pages)
          explode: false
          in: query
          name: sort
          schema:
            default: activity
            description: activity (newest activity) | created (newest thread) | posts (most replies; a mutable key, so a row can move between pages)
            enum:
              - activity
              - created
              - posts
            type: string
        - description: only threads that hold at least one post; a comments thread is created on first view, so most carry none
          explode: false
          in: query
          name: has_posts
          schema:
            description: only threads that hold at least one post; a comments thread is created on first view, so most carry none
            type: boolean
        - description: opaque cursor from the previous page; it is bound to the sort that minted it
          explode: false
          in: query
          name: cursor
          schema:
            description: opaque cursor from the previous page; it is bound to the sort that minted it
            type: string
        - description: page size (max 100, default 50)
          explode: false
          in: query
          name: limit
          schema:
            description: page size (max 100, default 50)
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeThreadListResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: List a site's threads of a kind (keyset, newest activity first)
      tags:
        - community-read
  /api/v1/community/threads/states:
    post:
      operationId: threadStates
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThreadStatesRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeThreadStatesResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Batch read/subscription state for a user over a set of threads
      tags:
        - community-engagement
  /api/v1/community/threads/{id}:
    get:
      operationId: getThread
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
        - description: post_number to read after (0 = from the top)
          explode: false
          in: query
          name: after
          schema:
            description: post_number to read after (0 = from the top)
            format: int32
            type: integer
        - explode: false
          in: query
          name: limit
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeThreadWithPosts"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Get a thread with a page of posts
      tags:
        - community-read
  /api/v1/community/threads/{id}/notification:
    post:
      operationId: setThreadNotification
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThreadNotificationRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeThreadUserView"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Set a user's notification level for a thread (0=muted 1=normal 2=tracking 3=watching)
      tags:
        - community-engagement
  /api/v1/community/threads/{id}/posts:
    get:
      operationId: listPosts
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
        - description: post_number to read after (0 = from the top)
          explode: false
          in: query
          name: after
          schema:
