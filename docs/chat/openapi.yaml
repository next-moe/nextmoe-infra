components:
  schemas:
    ClearInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://api.nextmoe.dev/ClearInputBody.json
          format: uri
          readOnly: true
          type: string
        remove:
          description: also take the conversation out of the caller's lists until the next message
          type: boolean
      type: object
    ContextCard:
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          description: what the card points at on that site, e.g. patch, resource, topic
          type: string
        site:
          type: string
        title:
          type: string
        url:
          type: string
      required:
        - site
        - kind
        - id
        - title
        - url
      type: object
    ContextInput:
      additionalProperties: false
      properties:
        id:
          maxLength: 64
          type: string
        kind:
          maxLength: 64
          type: string
        title:
          maxLength: 400
          type: string
        url:
          description: an https URL on the calling site's own host
          maxLength: 2048
          type: string
      required:
        - kind
        - id
        - title
        - url
      type: object
    Conversation:
      additionalProperties: false
      properties:
        about:
          type:
            - string
            - "null"
        created_at:
          format: date-time
          type: string
        id:
          type: string
        kind:
          enum:
            - direct
            - group
          type: string
        last_message:
          $ref: "#/components/schemas/Message"
          description: the newest message the caller can see
        last_seq:
          format: int64
          type: integer
        me:
          $ref: "#/components/schemas/DialogState"
        member_count:
          format: int32
          type: integer
        object:
          enum:
            - conversation
          type: string
        peer_id:
          description: "direct only: the other person"
          type:
            - string
            - "null"
        peer_read_seq:
          description: "how far the others have read: direct = the peer's position (0 while the caller's request is pending), group = the furthest any other member has read"
          format: int64
          type: integer
        photo_image_hash:
          type:
            - string
            - "null"
        title:
          type:
            - string
            - "null"
      required:
        - object
        - id
        - kind
        - title
        - about
        - photo_image_hash
        - peer_id
        - member_count
        - last_seq
        - peer_read_seq
        - created_at
        - me
        - last_message
      type: object
    ConversationBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://api.nextmoe.dev/ConversationBody.json
          format: uri
          readOnly: true
          type: string
        about:
          type:
            - string
            - "null"
        created_at:
          format: date-time
          type: string
        id:
          type: string
        kind:
          enum:
            - direct
            - group
          type: string
        last_message:
          $ref: "#/components/schemas/Message"
          description: the newest message the caller can see
        last_seq:
          format: int64
          type: integer
        me:
          $ref: "#/components/schemas/DialogState"
        member_count:
          format: int32
          type: integer
        members:
          items:
            $ref: "#/components/schemas/Member"
          type:
            - array
            - "null"
        object:
          enum:
            - conversation
          type: string
        peer_id:
          description: "direct only: the other person"
          type:
            - string
            - "null"
        peer_read_seq:
          description: "how far the others have read: direct = the peer's position (0 while the caller's request is pending), group = the furthest any other member has read"
          format: int64
          type: integer
        photo_image_hash:
          type:
            - string
            - "null"
        pinned_seqs:
          description: pinned messages, most recently pinned first
          items:
            format: int64
            type: integer
          type:
            - array
            - "null"
        title:
          type:
            - string
            - "null"
        users:
          items:
            $ref: "#/components/schemas/User"
          type:
            - array
            - "null"
      required:
        - users
        - members
        - pinned_seqs
        - object
        - id
        - kind
        - title
        - about
        - photo_image_hash
        - peer_id
        - member_count
        - last_seq
        - peer_read_seq
        - created_at
        - me
        - last_message
      type: object
    ConversationListBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://api.nextmoe.dev/ConversationListBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/Conversation"
          type:
            - array
            - "null"
        next_cursor:
          type: string
        object:
          enum:
            - list
          type: string
        users:
          items:
            $ref: "#/components/schemas/User"
          type:
            - array
            - "null"
      required:
        - object
        - items
        - users
      type: object
    DeleteInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://api.nextmoe.dev/DeleteInputBody.json
          format: uri
          readOnly: true
          type: string
        for_everyone:
          description: "true: delete the caller's own messages for everyone; false: hide the messages from the caller alone"
          type: boolean
        seqs:
          items:
            format: int64
            type: integer
          maxItems: 100
          minItems: 1
          type:
            - array
            - "null"
      required:
        - seqs
        - for_everyone
      type: object
    DeletedBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://api.nextmoe.dev/DeletedBody.json
          format: uri
          readOnly: true
          type: string
        for_everyone:
          type: boolean
        object:
          enum:
            - deleted_messages
          type: string
        seqs:
          description: the messages actually deleted or hidden; ones already gone are left out
          items:
            format: int64
            type: integer
          type:
            - array
            - "null"
      required:
        - object
        - seqs
        - for_everyone
      type: object
    DialogBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://api.nextmoe.dev/DialogBody.json
          format: uri
          readOnly: true
          type: string
        accepted:
          description: false = this conversation is in the caller's message requests
          type: boolean
        archived:
          type: boolean
        cleared_through_seq:
          format: int64
          type: integer
        draft:
          $ref: "#/components/schemas/Draft"
        last_read_seq:
          format: int64
          type: integer
        marked_unread:
          type: boolean
        muted_until:
          description: null = not muted; 9999-12-31 = muted until unmuted
          format: date-time
          type:
            - string
            - "null"
        object:
          enum:
            - dialog_state
          type: string
        pinned_rank:
          description: null = not pinned; a higher rank sits higher
          format: int32
          type:
            - integer
            - "null"
        role:
          enum:
            - owner
            - admin
            - member
          type: string
        unread_count:
          format: int32
          type: integer
        visible_from_seq:
          format: int64
          type: integer
      required:
        - object
        - role
        - accepted
        - last_read_seq
        - unread_count
        - marked_unread
        - cleared_through_seq
        - visible_from_seq
        - muted_until
        - archived
        - pinned_rank
        - draft
      type: object
    DialogInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://api.nextmoe.dev/DialogInputBody.json
          format: uri
          readOnly: true
          type: string
        archived:
          type: boolean
        marked_unread:
          type: boolean
        muted:
          description: true mutes, false unmutes
          type: boolean
        muted_until:
          description: "with muted=true: until when; omit to mute until unmuted"
          format: date-time
          type: string
        pinned:
          description: at most 5 conversations can be pinned
          type: boolean
      type: object
    DialogState:
      additionalProperties: false
      properties:
        accepted:
          description: false = this conversation is in the caller's message requests
          type: boolean
        archived:
          type: boolean
        cleared_through_seq:
          format: int64
          type: integer
        draft:
          $ref: "#/components/schemas/Draft"
        last_read_seq:
          format: int64
          type: integer
        marked_unread:
          type: boolean
        muted_until:
          description: null = not muted; 9999-12-31 = muted until unmuted
          format: date-time
          type:
            - string
            - "null"
        pinned_rank:
          description: null = not pinned; a higher rank sits higher
          format: int32
          type:
            - integer
            - "null"
        role:
          enum:
            - owner
            - admin
            - member
          type: string
        unread_count:
          format: int32
          type: integer
        visible_from_seq:
          format: int64
          type: integer
      required:
        - role
        - accepted
        - last_read_seq
        - unread_count
        - marked_unread
        - cleared_through_seq
        - visible_from_seq
        - muted_until
        - archived
        - pinned_rank
        - draft
      type: object
    Draft:
      additionalProperties: false
      properties:
        entities:
          items:
            $ref: "#/components/schemas/Entity"
          type:
            - array
            - "null"
        reply_to_seq:
          format: int64
          type:
            - integer
            - "null"
        text:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - text
        - entities
        - reply_to_seq
        - updated_at
      type: object
    DraftBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://api.nextmoe.dev/DraftBody.json
          format: uri
          readOnly: true
          type: string
        draft:
          $ref: "#/components/schemas/Draft"
          description: null when the draft was cleared
        object:
          enum:
            - draft
          type: string
      required:
        - object
        - draft
      type: object
    DraftInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://api.nextmoe.dev/DraftInputBody.json
          format: uri
          readOnly: true
          type: string
        entities:
          items:
            $ref: "#/components/schemas/Entity"
          maxItems: 100
          type:
            - array
            - "null"
        reply_to_seq:
          format: int64
          minimum: 1
          type: integer
        text:
          maxLength: 16384
          type: string
      required:
        - text
      type: object
    EditInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://api.nextmoe.dev/EditInputBody.json
          format: uri
          readOnly: true
          type: string
        entities:
          items:
            $ref: "#/components/schemas/Entity"
          maxItems: 100
          type:
            - array
            - "null"
        text:
          maxLength: 16384
          type: string
      required:
        - text
      type: object
    Entity:
      additionalProperties: false
      properties:
        language:
          description: "pre only: the code block's language"
          type: string
        length:
          description: length, in UTF-16 code units
          format: int64
          minimum: 1
          type: integer
        offset:
          description: start, in UTF-16 code units
          format: int64
          minimum: 0
          type: integer
        type:
          description: url entities are added by the server; one sent by a client is dropped
          enum:
            - bold
            - italic
            - underline
            - strikethrough
            - spoiler
            - code
            - pre
            - blockquote
            - text_link
            - mention
            - url
          type: string
        url:
          description: "text_link only: an absolute http or https URL"
          type: string
        user_id:
          description: "mention only: the mentioned user"
          pattern: ^[0-9]+$
          type: string
      required:
        - type
        - offset
        - length
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://api.nextmoe.dev/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    ImageBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://api.nextmoe.dev/ImageBody.json
          format: uri
          readOnly: true
          type: string
        height:
          format: int64
          type: integer
        image_hash:
          description: the image service hash
          type: string
        object:
          enum:
            - chat_image
          type: string
        thumbhash:
          type: string
        type:
          description: photo for now; sticker and file follow
          enum:
            - photo
          type: string
        url:
          description: where the stored image is served
          type: string
        width:
          format: int64
          type: integer
      required:
        - object
        - url
        - type
        - image_hash
        - width
        - height
      type: object
    Media:
      additionalProperties: false
      properties:
        height:
          format: int64
          type: integer
        image_hash:
          description: the image service hash
          type: string
        thumbhash:
          type: string
        type:
          description: photo for now; sticker and file follow
          enum:
            - photo
          type: string
        width:
          format: int64
          type: integer
      required:
        - type
        - image_hash
        - width
        - height
      type: object
    MediaInput:
      additionalProperties: false
      properties:
        image_hash:
          description: an image already uploaded to the image service
          pattern: ^[0-9a-f]{64}$
          type: string
        type:
          enum:
            - photo
          type: string
      required:
        - type
        - image_hash
      type: object
    Member:
      additionalProperties: false
      properties:
        joined_at:
          format: date-time
          type: string
        role:
          enum:
            - owner
            - admin
            - member
          type: string
        user_id:
          type: string
      required:
        - user_id
        - role
        - joined_at
      type: object
    Message:
      additionalProperties: false
      properties:
        client_message_id:
          description: the sender's own idempotency key; null on anyone else's messages
          type:
            - string
            - "null"
        context:
          $ref: "#/components/schemas/ContextCard"
        conversation_id:
          type: string
        created_at:
          format: date-time
          type: string
        edited_at:
          format: date-time
          type:
            - string
            - "null"
        entities:
          items:
            $ref: "#/components/schemas/Entity"
          type:
            - array
            - "null"
        id:
          type: string
        kind:
          enum:
            - message
            - service
          type: string
        media:
          $ref: "#/components/schemas/Media"
        media_group_id:
          description: "an album: the messages sent together share it"
          type:
            - string
            - "null"
        object:
          enum:
            - message
          type: string
        pinned_at:
          format: date-time
          type:
            - string
            - "null"
        reactions:
          description: count descending, then first reacted first
          items:
            $ref: "#/components/schemas/ReactionCount"
          type:
            - array
            - "null"
        reply_quote:
          $ref: "#/components/schemas/Quote"
        reply_to:
          $ref: "#/components/schemas/ReplyPreview"
        sender_id:
          type: string
        seq:
          description: position in the conversation, from 1 with no gaps; a deleted message keeps its number
          format: int64
          type: integer
        service_action:
          $ref: "#/components/schemas/ServiceAction"
        silent:
          type: boolean
        text:
          type: string
      required:
        - object
        - id
        - conversation_id
        - seq
        - sender_id
        - kind
        - text
        - entities
        - media
        - media_group_id
        - reply_to
        - reply_quote
        - service_action
        - context
        - reactions
        - client_message_id
        - silent
        - pinned_at
        - edited_at
        - created_at
      type: object
    MessageBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://api.nextmoe.dev/MessageBody.json
          format: uri
          readOnly: true
          type: string
        client_message_id:
          description: the sender's own idempotency key; null on anyone else's messages
          type:
            - string
            - "null"
        context:
          $ref: "#/components/schemas/ContextCard"
        conversation_id:
          type: string
        created_at:
          format: date-time
          type: string
        edited_at:
          format: date-time
          type:
            - string
            - "null"
        entities:
          items:
            $ref: "#/components/schemas/Entity"
          type:
            - array
            - "null"
        id:
          type: string
        kind:
          enum:
            - message
            - service
          type: string
        media:
          $ref: "#/components/schemas/Media"
        media_group_id:
          description: "an album: the messages sent together share it"
          type:
            - string
            - "null"
        object:
          enum:
            - message
          type: string
        pinned_at:
          format: date-time
          type:
            - string
            - "null"
        reactions:
          description: count descending, then first reacted first
          items:
            $ref: "#/components/schemas/ReactionCount"
          type:
            - array
            - "null"
        reply_quote:
          $ref: "#/components/schemas/Quote"
        reply_to:
          $ref: "#/components/schemas/ReplyPreview"
        sender_id:
          type: string
        seq:
          description: position in the conversation, from 1 with no gaps; a deleted message keeps its number
          format: int64
          type: integer
        service_action:
          $ref: "#/components/schemas/ServiceAction"
        silent:
          type: boolean
        text:
          type: string
        users:
          items:
            $ref: "#/components/schemas/User"
          type:
            - array
            - "null"
      required:
        - users
        - object
        - id
        - conversation_id
        - seq
        - sender_id
        - kind
        - text
        - entities
        - media
        - media_group_id
        - reply_to
        - reply_quote
        - service_action
        - context
        - reactions
        - client_message_id
        - silent
        - pinned_at
        - edited_at
        - created_at
      type: object
    MessageListBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://api.nextmoe.dev/MessageListBody.json
          format: uri
          readOnly: true
          type: string
        has_more_after:
          type: boolean
        has_more_before:
          type: boolean
        items:
          items:
            $ref: "#/components/schemas/Message"
          type:
            - array
            - "null"
        object:
          enum:
            - list
          type: string
        users:
          items:
            $ref: "#/components/schemas/User"
          type:
            - array
            - "null"
      required:
        - object
        - items
        - users
        - has_more_before
        - has_more_after
      type: object
    Quote:
      additionalProperties: false
      properties:
        entities:
          items:
            $ref: "#/components/schemas/Entity"
          type:
            - array
            - "null"
        offset:
          description: where the quote starts in the replied message, in UTF-16 code units
          format: int64
          type: integer
        text:
          type: string
      required:
        - text
        - entities
        - offset
      type: object
    QuoteInput:
      additionalProperties: false
      properties:
        offset:
          description: where it starts in the replied message, in UTF-16 code units
          format: int64
          minimum: 0
          type: integer
        text:
          description: the quoted part, exactly as it appears in the replied message
          minLength: 1
          type: string
      required:
        - text
        - offset
      type: object
    ReactInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://api.nextmoe.dev/ReactInputBody.json
          format: uri
          readOnly: true
          type: string
        reaction:
          description: a key from GET /v2/chat/reactions; null removes the caller's reaction
          type:
            - string
            - "null"
      required:
        - reaction
      type: object
    ReactionCount:
      additionalProperties: false
      properties:
        count:
          format: int64
          type: integer
        reacted:
          description: the caller is one of the reactors
          type: boolean
        reaction:
          type: string
      required:
        - reaction
        - count
        - reacted
      type: object
    ReactionListBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://api.nextmoe.dev/ReactionListBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/ReactionOption"
          type:
            - array
            - "null"
        object:
          enum:
            - list
          type: string
      required:
        - object
        - items
      type: object
    ReactionOption:
      additionalProperties: false
      properties:
        emoji:
          type: string
        key:
          type: string
        label:
          type: string
      required:
        - key
        - emoji
        - label
      type: object
    ReactionsBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://api.nextmoe.dev/ReactionsBody.json
          format: uri
          readOnly: true
          type: string
        message_id:
          type: string
        object:
          enum:
            - message_reactions
          type: string
        reactions:
          items:
            $ref: "#/components/schemas/ReactionCount"
          type:
            - array
            - "null"
      required:
        - object
        - message_id
        - reactions
      type: object
    ReadBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://api.nextmoe.dev/ReadBody.json
          format: uri
          readOnly: true
          type: string
        conversation_id:
          type: string
        last_read_seq:
          format: int64
          type: integer
        object:
          enum:
            - read_state
          type: string
        unread_count:
          format: int32
          type: integer
      required:
        - object
        - conversation_id
        - last_read_seq
        - unread_count
      type: object
    ReadInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://api.nextmoe.dev/ReadInputBody.json
          format: uri
          readOnly: true
          type: string
        max_seq:
          description: the newest message the caller has seen; a position behind the current one changes nothing
          format: int64
          minimum: 0
          type: integer
      required:
        - max_seq
      type: object
    RealtimeTokenBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://api.nextmoe.dev/RealtimeTokenBody.json
          format: uri
          readOnly: true
          type: string
        expires_at:
          format: date-time
          type: string
        object:
          enum:
            - realtime_token
          type: string
        token:
          type: string
        url:
          description: the Centrifugo WebSocket endpoint
          type: string
      required:
        - object
        - token
        - expires_at
        - url
      type: object
    ReplyPreview:
      additionalProperties: false
      properties:
        deleted:
          description: "the replied message is gone for the caller: deleted for everyone, or hidden or cleared by the caller; text is empty"
          type: boolean
        entities:
          description: only the entities that fall entirely inside text
          items:
            $ref: "#/components/schemas/Entity"
          type:
            - array
            - "null"
        media_type:
          type:
            - string
            - "null"
        sender_id:
          type: string
        seq:
          format: int64
          type: integer
        text:
          description: cut to 120 UTF-16 code units
          type: string
      required:
        - seq
        - sender_id
        - text
        - entities
        - media_type
        - deleted
      type: object
    ReportBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://api.nextmoe.dev/ReportBody.json
          format: uri
          readOnly: true
          type: string
        created:
          description: false when the caller had already reported this message
          type: boolean
        id:
          type: string
        object:
          enum:
            - report
          type: string
      required:
        - object
        - id
        - created
      type: object
    ReportInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://api.nextmoe.dev/ReportInputBody.json
          format: uri
          readOnly: true
          type: string
        note:
          description: at most 500 characters
          maxLength: 2000
          type: string
        reason:
          enum:
            - spam
            - harassment
            - sexual
            - violence
            - illegal
            - other
          type: string
      required:
        - reason
      type: object
    SendBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://api.nextmoe.dev/SendBody.json
          format: uri
          readOnly: true
          type: string
        client_message_id:
          description: a UUID the client makes up; resending it returns the first attempt's message
          type: string
        context:
          $ref: "#/components/schemas/ContextInput"
          description: a card pointing at the page the conversation is about
        entities:
          items:
            $ref: "#/components/schemas/Entity"
          maxItems: 100
          type:
            - array
            - "null"
        media:
          $ref: "#/components/schemas/MediaInput"
        media_group_id:
          description: the same value on every photo of one album
          maxLength: 20
          pattern: ^[0-9]+$
          type: string
        reply_quote:
          $ref: "#/components/schemas/QuoteInput"
          description: quote only part of the replied message
        reply_to_seq:
          format: int64
          minimum: 1
          type: integer
        silent:
          description: deliver without a notification sound
          type: boolean
        text:
          description: at most 4096 UTF-16 code units after trimming; may be empty on a media message
          maxLength: 16384
          type: string
      type: object
    ServiceAction:
      additionalProperties: false
      properties:
        seq:
          format: int64
          type: integer
        title:
          type: string
        type:
          enum:
            - group_created
            - members_added
            - member_left
            - member_removed
            - title_changed
            - photo_changed
            - message_pinned
            - joined_by_link
          type: string
        user_id:
          type: string
        user_ids:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - type
      type: object
    Settings:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://api.nextmoe.dev/Settings.json
          format: uri
          readOnly: true
          type: string
        accept_requests:
          description: whether people outside allow_incoming may send a message request
          type: boolean
        allow_group_invites:
          description: who may add the user to a group directly; others' invites become requests
          enum:
            - all
            - following
            - none
          type: string
        allow_incoming:
          description: "whose direct messages go straight to the inbox: anyone, only people the user follows, or nobody"
          enum:
            - all
            - following
            - none
          type: string
        object:
          enum:
            - chat_settings
          type: string
      required:
        - object
        - allow_incoming
        - accept_requests
        - allow_group_invites
      type: object
    SettingsInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://api.nextmoe.dev/SettingsInputBody.json
          format: uri
          readOnly: true
          type: string
        accept_requests:
          type: boolean
        allow_group_invites:
          enum:
            - all
            - following
            - none
          type: string
        allow_incoming:
          enum:
            - all
            - following
            - none
          type: string
      type: object
    State:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://api.nextmoe.dev/State.json
          format: uri
          readOnly: true
          type: string
        last_update_seq:
          format: int64
          type: integer
        object:
          enum:
            - chat_state
          type: string
        request_count:
          description: conversations waiting in message requests
          format: int64
          type: integer
        unread_conversation_count:
          description: accepted, unmuted conversations with anything unread
          format: int64
          type: integer
        unread_message_count:
          description: unread messages across accepted, unmuted conversations
          format: int64
          type: integer
      required:
        - object
        - last_update_seq
        - unread_conversation_count
        - unread_message_count
        - request_count
      type: object
    Update:
      additionalProperties: false
      properties:
        conversation_id:
          type: string
        created_at:
          format: date-time
          type: string
        data:
          description: kind-specific; see the chat contract
        kind:
          enum:
            - new_message
            - edit_message
            - delete_messages
            - read_inbox
            - read_outbox
            - message_reactions
            - pinned_messages
            - dialog
            - hide_messages
            - clear_history
            - member
            - conversation
          type: string
        object:
          enum:
            - update
          type: string
        update_seq:
          description: position in the caller's own update stream, from 1 with no gaps
          format: int64
          type: integer
      required:
        - object
        - update_seq
        - kind
        - conversation_id
        - data
        - created_at
      type: object
    UpdatesBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://api.nextmoe.dev/UpdatesBody.json
          format: uri
          readOnly: true
          type: string
        conversations:
          description: the conversations the updates name
          items:
            $ref: "#/components/schemas/Conversation"
          type:
            - array
            - "null"
        has_more:
          description: more updates follow; ask again after the last one
          type: boolean
        last_update_seq:
          format: int64
          type: integer
        messages:
          description: the messages new_message and edit_message updates name, as the caller sees them now
          items:
            $ref: "#/components/schemas/Message"
          type:
            - array
            - "null"
        object:
          enum:
            - update_list
          type: string
        too_long:
          description: "the position is older than the kept stream: reload instead"
          type: boolean
        updates:
          items:
            $ref: "#/components/schemas/Update"
          type:
            - array
            - "null"
        users:
          items:
            $ref: "#/components/schemas/User"
          type:
            - array
            - "null"
      required:
        - object
        - updates
        - messages
        - conversations
        - users
        - last_update_seq
        - has_more
        - too_long
      type: object
    User:
      additionalProperties: false
      properties:
        avatar:
          type: string
        deleted:
          description: the account was deleted; name and avatar are empty, show a placeholder
          type: boolean
        id:
          type: string
        name:
          type: string
        object:
          enum:
            - user
          type: string
      required:
        - object
        - id
        - name
        - avatar
        - deleted
      type: object
info:
  description: "Direct messages and groups shared by every NextMoe site and app. First-party clients only: a user access token with chat:read (reads) or chat:write (everything; also grants reads)."
  title: NextMoe Chat API
  version: 1.0.0
openapi: 3.1.0
paths:
  /v2/chat/conversations:
    get:
      operationId: listChatConversations
      parameters:
        - description: default inbox
          explode: false
          in: query
          name: folder
          schema:
            description: default inbox
            enum:
              - inbox
              - archive
              - requests
            type: string
        - description: next_cursor from the previous page
          explode: false
          in: query
          name: cursor
          schema:
            description: next_cursor from the previous page
            maxLength: 512
            type: string
        - description: page size, default 50
          explode: false
          in: query
          name: limit
          schema:
            description: page size, default 50
            format: int64
            maximum: 100
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationListBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: One folder of the caller's conversations, newest activity first; the inbox's first page starts with the pinned ones
      tags:
        - chat
  /v2/chat/conversations/{id}:
    get:
      operationId: getChatConversation
      parameters:
        - description: Conversation id.
          in: path
          name: id
          required: true
          schema:
            description: Conversation id.
            maxLength: 20
            pattern: ^[0-9]+$
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: One conversation with its members and pinned messages
      tags:
        - chat
  /v2/chat/conversations/{id}/accept:
    post:
      operationId: acceptChatRequest
      parameters:
        - description: Conversation id.
          in: path
          name: id
          required: true
          schema:
            description: Conversation id.
            maxLength: 20
            pattern: ^[0-9]+$
            type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Move a message request into the inbox
      tags:
        - chat
  /v2/chat/conversations/{id}/clear-history:
    post:
      operationId: clearChatHistory
      parameters:
        - description: Conversation id.
          in: path
          name: id
          required: true
          schema:
            description: Conversation id.
            maxLength: 20
            pattern: ^[0-9]+$
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClearInputBody"
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Hide everything so far from the caller alone; with remove, the conversation also leaves the caller's lists until the next message (this is also how a request is deleted)
      tags:
        - chat
  /v2/chat/conversations/{id}/draft:
    put:
      operationId: saveChatDraft
      parameters:
        - description: Conversation id.
          in: path
          name: id
          required: true
          schema:
            description: Conversation id.
            maxLength: 20
            pattern: ^[0-9]+$
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Save what the caller is typing for their other devices; empty text and no reply clears it
      tags:
        - chat
  /v2/chat/conversations/{id}/me:
    patch:
      operationId: updateChatDialog
      parameters:
        - description: Conversation id.
          in: path
          name: id
          required: true
          schema:
            description: Conversation id.
            maxLength: 20
            pattern: ^[0-9]+$
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DialogInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DialogBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: "Change the caller's own state of a conversation: mute, archive, pin, mark unread"
      tags:
        - chat
  /v2/chat/conversations/{id}/messages:
    get:
      operationId: listChatMessages
      parameters:
        - description: Conversation id.
          in: path
          name: id
          required: true
          schema:
            description: Conversation id.
            maxLength: 20
            pattern: ^[0-9]+$
            type: string
        - description: messages before this seq
          explode: false
          in: query
          name: before_seq
          schema:
            description: messages before this seq
            format: int64
            minimum: 0
            type: integer
        - description: messages after this seq
          explode: false
          in: query
          name: after_seq
          schema:
            description: messages after this seq
            format: int64
            minimum: 0
            type: integer
        - description: a page centred on this seq, for jumping to a reply or a mention
          explode: false
          in: query
          name: around_seq
          schema:
            description: a page centred on this seq, for jumping to a reply or a mention
            format: int64
            minimum: 0
            type: integer
        - description: page size, default 50
          explode: false
          in: query
          name: limit
          schema:
            description: page size, default 50
            format: int64
            maximum: 100
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageListBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: A page of the messages the caller can see, oldest first within the page; the newest page when no position is given
      tags:
        - chat
    post:
      operationId: sendChatMessage
      parameters:
        - description: Conversation id.
          in: path
          name: id
          required: true
          schema:
            description: Conversation id.
            maxLength: 20
            pattern: ^[0-9]+$
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageBody"
          description: Created
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Send a message; resending the same client_message_id returns the first attempt's message and writes nothing
      tags:
        - chat
  /v2/chat/conversations/{id}/messages/delete:
    post:
      operationId: deleteChatMessages
      parameters:
        - description: Conversation id.
          in: path
          name: id
          required: true
          schema:
            description: Conversation id.
            maxLength: 20
            pattern: ^[0-9]+$
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Too Many Requests
