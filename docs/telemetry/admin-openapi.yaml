info:
  title: KUN Telemetry Admin API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/admin/telemetry/alert-channels:
    get:
      operationId: listTelemetryAlertChannels
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeListAlertChannelView"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: List telemetry alert channels
      tags:
        - telemetry-admin
    post:
      operationId: createTelemetryAlertChannel
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAlertChannelRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAlertChannelView"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Create an alert channel
      tags:
        - telemetry-admin
  /api/v1/admin/telemetry/alert-channels/{id}:
    delete:
      operationId: deleteTelemetryAlertChannel
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeMapStringInterface {}"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Delete an alert channel
      tags:
        - telemetry-admin
    patch:
      operationId: updateTelemetryAlertChannel
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAlertChannelRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAlertChannelView"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Update an alert channel
      tags:
        - telemetry-admin
  /api/v1/admin/telemetry/alert-channels/{id}/test:
    post:
      operationId: testTelemetryAlertChannel
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAlertChannelTestResult"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Send a test email to an alert channel
      tags:
        - telemetry-admin
  /api/v1/admin/telemetry/alerts:
    get:
      operationId: listTelemetryAlerts
      parameters:
        - explode: false
          in: query
          name: app_id
          schema:
            type: string
        - explode: false
          in: query
          name: status
          schema:
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            type: integer
        - explode: false
          in: query
          name: offset
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeListAlertView"
          description: OK
