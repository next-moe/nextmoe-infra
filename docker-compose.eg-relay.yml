# ErogameScape relay — the mirror image of the DLsite relay, pointing the other
# way. Deployed as its own Dokploy Compose app on the PROD host (kungal-neo),
# and called by the erogamescape crawler on nextmoe-crawler.
#
# WHY it exists: the two hosts' egress is exactly complementary. DLsite answers
# Tokyo and redirects prod to google.com; ErogameScape answers prod and drops
# Tokyo at the IP layer — ICMP and TCP 80/443 alike, measured 2026-09-15, so no
# header, UA or scheme changes it. A Japanese IP is not the qualification: this
# is an abuse-list block on the hosting range, and the Tokyo box is on it.
#
# The crawler reaches it by setting ERO_BASE_URL to
# https://eg-relay.nextmoe.dev/~ap2/ero/toukei_kaiseki — config.BaseURL is
# already documented as "the directory that hosts sql_for_erogamer_form.php,
# possibly behind a reverse proxy".
#
# `$$` is compose-interpolation escaping for nginx's `$` — keep it.
name: nextmoe-eg-relay
services:
  eg-relay:
    image: nginx:1.29-alpine
    restart: unless-stopped
    networks:
      - dokploy-network
    configs:
      - source: eg-relay-conf
        target: /etc/nginx/conf.d/default.conf
    labels:
      - traefik.enable=true
      - traefik.http.routers.eg-relay.rule=Host(`eg-relay.nextmoe.dev`)
      - traefik.http.routers.eg-relay.entrypoints=websecure
      - traefik.http.routers.eg-relay.tls.certresolver=letsencrypt
      - traefik.http.routers.eg-relay.middlewares=eg-allow
      # nginx sits behind the dokploy overlay and cannot see the real client IP,
      # so the allowlist has to be at the traefik layer. Only the Tokyo crawler
      # box may use this; it is an open proxy to a third party otherwise.
      - traefik.http.middlewares.eg-allow.ipallowlist.sourcerange=43.230.161.212/32
      - traefik.http.services.eg-relay.loadbalancer.server.port=80

configs:
  eg-relay-conf:
    content: |
      server {
          listen 80;
          server_name eg-relay.nextmoe.dev;

          resolver 127.0.0.11 ipv6=off valid=300s;
          set $$eg https://erogamescape.dyndns.org;

          # The mirror POSTs one SELECT to exactly this endpoint and reads the
          # whole result set back; nothing else on the origin is proxied.
          location = /~ap2/ero/toukei_kaiseki/sql_for_erogamer_form.php {
              proxy_pass              $$eg;
              proxy_http_version      1.1;
              proxy_set_header        Host erogamescape.dyndns.org;
              proxy_ssl_server_name   on;
              proxy_ssl_name          erogamescape.dyndns.org;
              # A keyset page of a large table takes the origin tens of seconds;
              # nginx's 60s default would turn that into a 504 the crawler reads
              # as an upstream failure.
              proxy_read_timeout      300s;
              proxy_send_timeout      300s;
          }
          location / { return 404; }
      }

networks:
  dokploy-network:
    external: true
