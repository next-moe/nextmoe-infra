name: openapi-types

# Drift gate for the TypeScript arm of the OpenAPI contracts. The committed
# generated *.ts must equal a fresh openapi-typescript run against the committed
# spec — this catches "the spec changed but the generated types weren't
# regenerated" and any hand-edit to a generated file. Types live in the app that
# consumes them: artifact-* / catalog-admin / trust-* in apps/admin. (The galgame-*
# pairing retired with apps/wiki at E3b; the wiki-era galgame_wiki read/calendar
# specs retired with the bridge read face at route-B W5, and the galgame /v1
# public projection spec followed when that face was delisted at wave 146 on
# 2026-07-30 — no galgame spec ever had a TS pairing here, so that delisting
# changed nothing in this file. The galgame spec's ONE generated consumer was
# the developer portal's docs model, regenerated by
# `pnpm --filter developer sync:specs`. The catalog S2S arm went at wave R3 on
# 2026-08-27 with the /api/v1/catalog face; apps/admin never called it, so only
# the generated catalog-api.ts went with it.)
#
# Scope: spec -> TS only. The spec-vs-Go-code side is covered separately
# (`go run ./cmd/gen-openapi` re-exports the spec from the Huma code; a future
# oasdiff step flags breaking changes). Together they close the loop
# code -> spec -> TS.

on:
  push:
    paths: &paths
      - "docs/artifact/openapi.yaml"
      - "docs/artifact/admin-openapi.yaml"
      - "docs/catalog/admin-openapi.yaml"
      - "docs/trust/admin-openapi.yaml"
      - "docs/ai/admin-openapi.yaml"
      - "apps/admin/shared/types/generated/**"
      - "apps/admin/package.json"
      - ".github/workflows/openapi-types.yml"
  pull_request:
    paths: *paths

permissions:
  contents: read

jobs:
  drift:
    name: generated TS types match the spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The script uses `pnpm dlx openapi-typescript@<pinned>`, so no install /
      # lockfile entry is needed — it fetches the pinned generator on the fly.
      - name: Regenerate TS types from the committed specs
        run: |
          pnpm -F "./apps/admin" run gen:types:artifact
          pnpm -F "./apps/admin" run gen:types:artifact-admin
          pnpm -F "./apps/admin" run gen:types:catalog-admin
          pnpm -F "./apps/admin" run gen:types:trust-admin
          # ai-admin had a gen:types script and a committed ai-admin-api.ts, but
          # was in neither this list nor the spec-export list in test.yml — the
          # types could go stale against the spec, and the spec against the Go
          # code, with both gates reporting green.
          pnpm -F "./apps/admin" run gen:types:ai-admin
      - name: Fail if the generated types are stale vs the specs
        run: git diff --exit-code -- apps/admin/shared/types/generated/
