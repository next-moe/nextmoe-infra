name: test

# CI test gate for the Go module under apps/api. Two jobs:
#   unit        — build + vet + `go test ./...` with NO external services.
#                 Pure unit tests run; every service-gated test skips cleanly
#                 (they're written to Skip when their env var is unset). This is
#                 the always-green day-one gate: it catches "compiles but the
#                 unit logic is wrong". A DB-backed suite that FAILS here instead
#                 of skipping is a bug in the suite, not a missing service — see
#                 internal/testsupport/dbtest, which is where that decision lives.
#   integration — spins Postgres + OpenSearch and re-runs the suite with the
#                 env vars the integration tests look for, so the catalog /
#                 search / refping tests (which self-migrate) actually execute
#                 instead of skipping. Auth and image tests still skip here
#                 (they need a pre-migrated infra DB / MinIO — a later
#                 follow-up). Required as of 2026-07-01 (first CI run was
#                 green): a failure now fails the workflow.
#
# Independent of build.yml on purpose — this is a merge/PR signal, not a deploy
# gate (build.yml is a separate workflow; deploys aren't blocked on it).

on:
  push:
    paths:
      - "apps/api/**"
      - "apps/developer/app/generated/mcp-tools.mjs"
      - "apps/developer/app/generated/problems.ts"
      - "apps/developer/app/generated/vocabularies.ts"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/developer/app/generated/mcp-tools.mjs"
      - "apps/developer/app/generated/problems.ts"
      - "apps/developer/app/generated/vocabularies.ts"
      - ".github/workflows/test.yml"

permissions:
  contents: read
  packages: read # pull the pinned infra-opensearch image in the integration job

defaults:
  run:
    working-directory: apps/api

jobs:
  unit:
    name: unit (build · vet · test, no services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      # The image processor imports go-webp (cgo → libwebp), so a whole-module
      # build/test needs the headers + pkg-config (matches docker/cgo.Dockerfile).
      - name: Install CGO deps (libwebp)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebp-dev pkg-config
      # `go vet` says nothing about layout, so 30 files had drifted out of
      # gofmt shape before anything checked. gofmt is the toolchain's own
      # formatter and the CI toolchain is pinned by go.mod, so this cannot
      # disagree with a contributor running gofmt from the same version.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean -- run: gofmt -w $unformatted" >&2
            exit 1
          fi
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # code -> spec: the committed OpenAPI specs are exported from the Huma Go
      # code, so they must never drift from it. Re-export and diff. (spec -> TS is
      # covered by openapi-types.yml.)
      - name: OpenAPI specs are in sync with the Go code
        run: |
          go run ./cmd/gen-openapi -o ../../docs/artifact/openapi.yaml
          go run ./cmd/gen-openapi -downgrade -o ../../docs/artifact/openapi-3.0.yaml
          go run ./cmd/gen-openapi -admin -o ../../docs/artifact/admin-openapi.yaml
          go run ./cmd/gen-openapi -catalog-admin -o ../../docs/catalog/admin-openapi.yaml
          go run ./cmd/gen-openapi -catalog-v2 -o ../../docs/catalog/v2-openapi.yaml
          go run ./cmd/gen-openapi -community -o ../../docs/community/openapi.yaml
          go run ./cmd/gen-openapi -trust -o ../../docs/trust/openapi.yaml
          go run ./cmd/gen-openapi -trust-admin -o ../../docs/trust/admin-openapi.yaml
          go run ./cmd/gen-openapi -ai -o ../../docs/ai/openapi.yaml
          # -ai-admin was missing from this list while docs/ai/admin-openapi.yaml
          # was committed, so that spec could drift from the Go code with the gate
          # still green. Every gen-openapi flag that has a committed output belongs
          # here — an ungated spec is worse than an absent one, because it looks checked.
          go run ./cmd/gen-openapi -ai-admin -o ../../docs/ai/admin-openapi.yaml
          # Same trap as -ai-admin, different generator: cmd/gen-v2-portal writes
          # the portal's problems.ts / vocabularies.ts / mcp-tools.mjs from the Go
          # registries and the v2 document, and no gate ran it — a new problem code
          # without the regen left the code's type URI pointing at a portal page
          # that 404s. docs-model.yml cannot cover this (sync-specs.mjs never
          # writes these files), so the code -> generated arm lives here with the
          # other Go-side exports. Every file this generator writes belongs in the
          # diff below.
          go run ./cmd/gen-v2-portal -o ../developer/app/generated
          git diff --exit-code -- ../../docs/artifact/ ../../docs/catalog/ ../../docs/community/ ../../docs/trust/ ../../docs/ai/ ../developer/app/generated/mcp-tools.mjs ../developer/app/generated/problems.ts ../developer/app/generated/vocabularies.ts

  integration:
    name: integration (postgres + opensearch)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Prod's major (docker-compose.prod.yml). Community's activity writes
        # read the pre-update row through RETURNING old.*, which is PG18-only.
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: galtest
        ports:
          - 5432:5432
        # pg_isready ships in the postgres image, so the container-level health
        # check is reliable — the job waits until Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The galgame service + jobs (refping) tests read TEST_DATABASE_DSN and
      # self-AutoMigrate into it; an empty DB is all they need.
      TEST_DATABASE_DSN: "host=localhost port=5432 user=postgres password=postgres dbname=galtest sslmode=disable"
      # Assert that the DB-backed suites RAN. Without it, losing the DSN above
      # (a typo, a renamed service container) makes every such suite skip and
      # still print `ok` — a green job that tested nothing. internal/testsupport/
      # dbtest turns a missing DSN into a hard failure when this is set, which is
      # exactly the case where a missing DSN means the job is broken rather than
      # a service being legitimately absent (the unit job above).
      REQUIRE_DB_TESTS: "1"
      # Live search suites (catalog/search, catalog/service, reindex-catalog,
      # osengine/recall_test.go) bind this host and are hard-failed by
      # REQUIRE_SEARCH_TESTS below, so a missing or unbootable engine container
      # turns the job red instead of skip-green.
      KUN_OPENSEARCH_TEST_HOST: "http://127.0.0.1:19200"
      # Same assertion for the search-backed suites, and it is not hypothetical:
      # the W4 wave shipped a filter that returned zero hits for every query,
      # and catalog/service still printed `ok` because every test touching the
      # index had skipped itself.
      REQUIRE_SEARCH_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      # go-webp (cgo → libwebp) is compiled by the whole-module test run.
      - name: Install CGO deps (libwebp)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebp-dev pkg-config
      # Not a `services:` container: the image is our own GHCR build (OS +
      # icu/kuromoji/pinyin analysis plugins) and may not exist yet on a branch
      # that just changed docker/opensearch/** — pull the pinned tag, else build
      # it from the Dockerfile in-job. The tag comes from the Dockerfile's ARG,
      # the single source of the OS↔pinyin version lock.
      - name: Start OpenSearch
        working-directory: .
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          VER=$(sed -n 's/^ARG OS_VERSION=//p' docker/opensearch/Dockerfile)
          IMG=ghcr.io/${{ github.repository_owner }}/infra-opensearch:$VER
          docker pull "$IMG" || docker build -t "$IMG" docker/opensearch
          docker run -d --name opensearch-test -p 127.0.0.1:19200:9200 \
            -e discovery.type=single-node \
            -e DISABLE_SECURITY_PLUGIN=true \
            -e DISABLE_INSTALL_DEMO_CONFIG=true \
            -e DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI=true \
            -e "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m" \
            "$IMG"
      - name: Wait for OpenSearch
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:19200/_cluster/health && exit 0
            sleep 2
          done
          echo "opensearch did not become healthy" >&2
          docker logs opensearch-test | tail -50 >&2
          exit 1
      # -p 1 serializes package test binaries: the service and jobs packages
      # share TEST_DATABASE_DSN and both AutoMigrate/TRUNCATE the same tables, so
      # running their binaries concurrently against the single CI Postgres would
      # be racy. Within a package tests already run serially.
      - run: go test -p 1 ./...
