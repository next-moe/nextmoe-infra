# Build the catalog search engine image (OpenSearch + icu/kuromoji/pinyin
# analysis plugins) and push it to GHCR. Deliberately NOT part of build.yml's
# per-push matrix: the image changes only when docker/opensearch/** does, and
# it deploys by version tag, never :latest — the infinilabs pinyin plugin is
# built per OpenSearch PATCH version, so the tag IS the compatibility pin and
# compose files reference it explicitly (refs/plans/15-opensearch).
name: opensearch-image

on:
  push:
    branches: [main]
    paths:
      - "docker/opensearch/**"
      - ".github/workflows/opensearch-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: opensearch-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: echo "version=$(sed -n 's/^ARG OS_VERSION=//p' docker/opensearch/Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: docker/opensearch
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/infra-opensearch:${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/next-moe/nextmoe-infra
          cache-from: type=gha,scope=infra-opensearch
          cache-to: type=gha,mode=max,scope=infra-opensearch
