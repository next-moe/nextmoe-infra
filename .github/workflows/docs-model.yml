name: docs-model

# Drift gate for the developer portal's API reference. `app/generated/docs-model.ts`
# is a committed build artifact derived from the frozen public OpenAPI spec, and
# nothing rebuilt it in CI: public specs live under docs/**, which does not even
# trigger the developer image build, so a spec edit that forgot the regen was
# only ever caught by the next human who happened to run the script. It sat stale
# through the whole A2 canonical track that way.
#
# Two failure modes, one job:
#   1. the coverage guard in sync-specs.mjs disagrees with the spec — the script
#      throws and the step fails;
#   2. the guard still matches but the model content moved (a param, a summary,
#      an enum) — the script succeeds and `git diff --exit-code` fails.
#
# Since 2026-08-18 the same script also writes the LLM-facing artifacts into
# apps/developer/public (llms.txt, llms-full.txt, a Markdown twin per docs
# route). They are covered by the same diff on purpose: an agent reading
# /docs/v2.md must not be told a different *contract* from the one the page
# renders. The HTML pages overlay Chinese (i18n/docs-zh.json) onto that same
# English model; the Markdown twins stay English. The overlay is asserted
# inside sync-specs.mjs, so a new description without a translation fails
# this job the same way a stale docs-model.ts does.
#
# Since 2026-08-31 it also compiles the hand-written guides (apps/developer/docs
# /*.md -> app/generated/guides/*.json) through the same entry point, and each
# guide's Markdown twin in public/ is the same source file the HTML came from.
# One run, one truth: a guide edit that skipped the regen fails the diff here.
#
# The same run writes the Chinese twins of the two Go-generated registries —
# RFC 9457 problems (app/generated/problems.ts + i18n/problems-zh.json) and the
# /v2/vocabularies members (app/generated/vocabularies.ts +
# i18n/vocabularies-zh.json) — plus an English Markdown twin per /problems and
# /docs/vocabularies route. A new problem code or vocabulary member with no
# translation therefore fails this job rather than shipping an English string
# into a Chinese page.
#
# Sibling gate: openapi-types.yml does the same for the spec -> TS arm in
# apps/web. This one is the spec -> portal-docs-model arm.
#
# No step consumes event-supplied text (titles, branch names, commit messages),
# so there is no injection surface in the run: blocks below.

on:
  push:
    paths: &paths
      # v2-openapi.yaml was missing here while faces.mjs already built the
      # portal model from it, so a commit touching only the v2 spec skipped
      # this gate and the drift landed on whoever next touched a listed path.
      - "docs/catalog/v2-openapi.yaml"
      # Same failure shape for the vendored downstream specs: a re-copy that
      # forgets sync:specs would skip this gate, and public/specs/ is the
      # served copy of the same files.
      - "docs/downstream/*.yaml"
      - "apps/developer/public/specs/**"
      - "apps/developer/scripts/sync-specs.mjs"
      - "apps/developer/scripts/docs-i18n.mjs"
      - "apps/developer/scripts/faces.mjs"
      - "apps/developer/scripts/gen-llms.mjs"
      # The ⌘K palette's haystack: built from every other artifact this job
      # produces, so it drifts whenever any of them moves.
      - "apps/developer/scripts/search-index.mjs"
      - "apps/developer/app/generated/search-index.ts"
      # The hand-written guides: their Markdown sources, the compiler that turns
      # them into pre-highlighted HTML, and the file that orders them.
      - "apps/developer/docs/**/*.md"
      - "apps/developer/scripts/build-guides.mjs"
      - "apps/developer/scripts/guides.mjs"
      - "apps/developer/i18n/docs-zh.json"
      # The problem registry is Go-generated and stays English; its Chinese twin
      # for the /problems pages is compiled from this overlay by the same run.
      - "apps/developer/scripts/problems-i18n.mjs"
      - "apps/developer/i18n/problems-zh.json"
      - "apps/developer/app/generated/problems.ts"
      - "apps/developer/app/generated/problems-zh.ts"
      # Same arrangement for the /v2/vocabularies registry.
      - "apps/developer/scripts/vocabularies-i18n.mjs"
      - "apps/developer/i18n/vocabularies-zh.json"
      - "apps/developer/app/generated/vocabularies.ts"
      - "apps/developer/app/generated/vocabularies-zh.ts"
      - "apps/developer/shared/brand.mjs"
      - "apps/developer/shared/mcp-tools.mjs"
      # The generated half of the MCP roster. shared/mcp-tools.mjs only adds the
      # Chinese descriptions to it, so a regenerated roster moves docs/mcp.md
      # without any listed source file changing.
      - "apps/developer/app/generated/mcp-tools.mjs"
      - "apps/developer/app/generated/docs-model.ts"
      - "apps/developer/app/generated/guides-nav.ts"
      - "apps/developer/app/generated/guides/**"
      - "apps/developer/public/llms.txt"
      - "apps/developer/public/llms-full.txt"
      - "apps/developer/public/**/*.md"
      - ".github/workflows/docs-model.yml"
  pull_request:
    paths: *paths

permissions:
  contents: read

jobs:
  drift:
    name: generated docs model matches the public specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No version input: action-setup reads the repo's packageManager pin.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The script needs `yaml` plus the Markdown toolchain the guide compiler
      # uses (markdown-it, shiki, gray-matter) out of the developer workspace,
      # so install that project only. --ignore-scripts skips the `nuxt prepare`
      # postinstall: nothing here builds the app.
      - name: Install the developer workspace
        run: pnpm install --filter developer --frozen-lockfile --ignore-scripts
      # Run the script by path rather than `pnpm -F developer sync:specs`: bare
      # specifiers resolve from the script's own directory, so the working
      # directory does not matter and the pnpm run indirection buys nothing.
      - name: Rebuild the docs model from the committed specs
        run: node apps/developer/scripts/sync-specs.mjs
      # public/ also holds hand-placed assets (favicons); the script never
      # touches those, so diffing the whole directory is free coverage for the
      # llms.txt / llms-full.txt / route-Markdown half of the same generator.
      - name: Fail if the committed model is stale vs the specs
        run: git diff --exit-code -- apps/developer/app/generated apps/developer/public
