# Build infra images and push to GHCR, then trigger a Dokploy redeploy.
# See docs/deploy/13-registry-ci.md.
#
# COST CONTROL — GitHub bills each matrix job rounded UP to a whole minute, so
# rebuilding every image on each push burned billed minutes even fully cached.
# This workflow builds ONLY the images whose inputs changed (path-filtered
# dynamic matrix):
#   - go images (oauth/image/artifact/catalog/community/trust/ai + migrate)  ← apps/api/** + Dockerfiles
#   - account / admin                              ← apps/account/** / apps/admin/** + root manifests + nuxt.Dockerfile
#   - tools (infra-tools)                          ← apps/api/** + docker/tools.Dockerfile
# A docs-only push therefore builds nothing and costs ~1 min (the `changes` job).
#
# `infra-migrate` and `infra-tools` build in LOCKSTEP with the go services (same
# apps/api source + sha). migrate is REQUIRED because prod auto-applies migrations
# on deploy (compose `depends_on: migrate`), so the migrate image must never lag
# the code. It is ONE image for every database: the compose migrate-* services all
# run it and pass the target as an argument (`command: ["catalog"]`), so there is
# no per-domain image to keep in sync. `infra-tools` packs every `cmd/*` binary,
# so a push that changes a job must rebuild it or prod keeps running the old one.
# `tools` is the only group Dokploy does not deploy, so a `tools`-only build does
# not trigger a redeploy; Actions → Run workflow → scope=tools rebuilds it alone.
#
# Images publish to ghcr.io/<repo owner>/* (today: next-moe). The first push
# creates the package and links it to this repo — that is how GHCR "new
# package" works; there is no UI create button. The KunMoe user packages
# stayed behind after the git transfer (unlinked) and are not the pull path
# any more. compose / cron / doctor must use the same owner namespace.
#
# account and admin BAKE their browser-facing public config from build-args here.
name: build-and-push

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: 'What to build (all = every image incl. migrate/tools; tools = only infra-tools)'
        type: choice
        options: [all, tools]
        default: all

permissions:
  contents: read
  packages: write            # required to push to GHCR

concurrency:                 # a newer push on the same ref cancels the older build
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide which images to build. On push: only the groups whose paths changed.
  # On workflow_dispatch: all images, or just the on-demand ones (scope input).
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      any: ${{ steps.set.outputs.any }}        # is there anything to build?
      deploy: ${{ steps.set.outputs.deploy }}  # did a *deployable* (non-tool) image change?
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            go:
              - 'apps/api/**'
              - 'docker/go.Dockerfile'
              - 'docker/cgo.Dockerfile'
              - '.github/workflows/build.yml'
            account:
              - 'apps/account/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'docker/nuxt.Dockerfile'
              - '.github/workflows/build.yml'
            admin:
              - 'apps/admin/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'docker/nuxt.Dockerfile'
              - '.github/workflows/build.yml'
            developer:
              - 'apps/developer/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.github/workflows/build.yml'
            tools:
              - 'apps/api/**'
              - 'docker/tools.Dockerfile'
              - '.github/workflows/build.yml'
      - id: set
        env:
          EVENT: ${{ github.event_name }}
          SCOPE: ${{ github.event.inputs.scope }}
          GO: ${{ steps.filter.outputs.go }}
          ACCOUNT: ${{ steps.filter.outputs.account }}
          ADMIN: ${{ steps.filter.outputs.admin }}
          DEV: ${{ steps.filter.outputs.developer }}
          TOOLS: ${{ steps.filter.outputs.tools }}
        run: |
          set -euo pipefail
          # Auto-built on push (path-filtered). account/admin args are baked at build.
          push_catalog='[
            {"name":"infra-oauth","file":"docker/cgo.Dockerfile","args":"CMD=oauth","group":"go"},
            {"name":"infra-image","file":"docker/cgo.Dockerfile","args":"CMD=image","group":"go"},
            {"name":"infra-artifact","file":"docker/go.Dockerfile","args":"CMD=artifact","group":"go"},
            {"name":"infra-migrate","file":"docker/go.Dockerfile","args":"CMD=migrate","group":"go"},
            {"name":"infra-catalog","file":"docker/go.Dockerfile","args":"CMD=catalog","group":"go"},
            {"name":"infra-community","file":"docker/go.Dockerfile","args":"CMD=community","group":"go"},
            {"name":"infra-trust","file":"docker/go.Dockerfile","args":"CMD=trust","group":"go"},
            {"name":"infra-ai","file":"docker/go.Dockerfile","args":"CMD=ai","group":"go"},
            {"name":"infra-mcp","file":"docker/go.Dockerfile","args":"CMD=mcp","group":"go"},
            {"name":"infra-account","file":"docker/nuxt.Dockerfile","args":"APP=account\nPUBLIC_API_BASE=https://account.nextmoe.com/api/v1\nPUBLIC_IMAGE_CDN_BASE=https://image.kungal.iloveren.link","group":"account"},
            {"name":"infra-admin","file":"docker/nuxt.Dockerfile","args":"APP=admin\nPUBLIC_API_BASE=https://admin.nextmoe.dev/api/v1\nPUBLIC_IMAGE_CDN_BASE=https://image.kungal.iloveren.link","group":"admin"},
            {"name":"infra-developer","file":"apps/developer/Dockerfile","args":"","group":"developer"},
            {"name":"infra-tools","file":"docker/tools.Dockerfile","args":"","group":"tools"}
          ]'
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$SCOPE" = "tools" ]; then
              sel=$(jq -cn --argjson c "$push_catalog" '$c | map(select(.group == "tools"))')
            else
              sel=$(jq -cn --argjson c "$push_catalog" '$c')
            fi
          else
            sel=$(jq -cn --argjson c "$push_catalog" --arg go "$GO" --arg account "$ACCOUNT" --arg admin "$ADMIN" --arg dev "$DEV" --arg tools "$TOOLS" \
              '([{g:"go",v:$go},{g:"account",v:$account},{g:"admin",v:$admin},{g:"developer",v:$dev},{g:"tools",v:$tools}] | map(select(.v=="true") | .g)) as $grp
               | $c | map(select(.group as $x | $grp | index($x)))')
          fi
          n=$(jq -n --argjson s "$sel" '$s | length')
          echo "any=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "deploy=$(jq -n --argjson s "$sel" '$s | any(.[]; .group != "tools")')" >> "$GITHUB_OUTPUT"
          printf 'matrix={"include":%s}\n' "$sel" >> "$GITHUB_OUTPUT"
          echo "Selected $n image(s) to build:"
          jq -rn --argjson s "$sel" '$s[].name' | sed 's/^/  - /'

  build:
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/next-moe/nextmoe-infra
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:                    # only when a deployable (non-tool) image was built
    needs: [changes, build]
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy redeploy
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK_INFRA }}
          TITLE: ${{ github.event.head_commit.message || github.sha }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DOKPLOY_WEBHOOK_INFRA not set — images pushed to GHCR, skipping redeploy trigger."
            exit 0
          fi
          # Dokploy's compose webhook is not a bare trigger: the compose is
          # sourceType=github, so the handler branch-matches the request as if it
          # were a GitHub push event. A bodyless `curl -X POST` gets 301 "Branch
          # Not Match" — which `curl -f` treats as success, silently skipping the
          # deploy (and 400 here means the compose's Auto Deploy toggle is off,
          # not a bad token — a bad token would be 404). Masquerade as a push and
          # require an actual 200.
          body=$(jq -n --arg ref "$GITHUB_REF" --arg sha "$GITHUB_SHA" --arg title "$TITLE" \
            '{ref: $ref, head_commit: {id: $sha, message: $title}}')
          code=$(curl -sS -o response.json -w '%{http_code}' -X POST "$WEBHOOK" \
            -H 'content-type: application/json' -H 'x-github-event: push' \
            --data-raw "$body")
          cat response.json; echo
          [ "$code" = "200" ]
