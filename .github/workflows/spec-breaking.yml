name: spec-breaking

# Breaking-change gate for the published OpenAPI contracts. The v2 document and
# the artifact specs have external consumers — downstream repos and any
# third-party generated client fetch them from the docs portals — so a breaking
# change to a spec must not land silently. (The wiki-era galgame-wiki
# read/calendar specs were retired with the bridge read face at route-B W5; the
# galgame /v1 public projection spec followed when that face was delisted at
# wave 146 on 2026-07-30; wave R3 on 2026-08-27 retired the whole v1 surface —
# catalog public + S2S, news, store — leaving /v2 as the only public projection
# under this gate.) oasdiff compares the spec BEFORE this
# change (the PR base, or the pre-push commit) against the new version and fails
# on any breaking (ERR) difference.
#
# The specs are code-first (exported by cmd/gen-openapi), so a breaking spec diff
# means a breaking CODE change — this catches it at the contract boundary,
# complementing test.yml (code -> spec is in sync) and openapi-types.yml
# (spec -> TS is in sync). A spec that is new in this change (absent in the base)
# is skipped, not failed.
#
# A deliberate retirement is not a silent one: a spec may carry a sibling
# <spec>-breaking-ignore.txt naming the changes it means to make, which turns
# the gate from "never break" into "never break by accident".
#
# docs/catalog/v2-openapi.yaml sat in the trigger paths but not in the specs
# list below through the whole v2 preview — deliberate then (preview allowed
# breaking changes), but it looked checked while it wasn't. It joined the list
# at GA on 2026-08-25; both lists must stay in step from here on.

on:
  push:
    branches: [main]
    paths: &specs
      - "docs/artifact/openapi.yaml"
      - "docs/artifact/admin-openapi.yaml"
      - "docs/catalog/admin-openapi.yaml"
      - "docs/catalog/v2-openapi.yaml"
      - "docs/community/openapi.yaml"
      - "docs/trust/openapi.yaml"
      - "docs/trust/admin-openapi.yaml"
      - "docs/ai/openapi.yaml"
      - "docs/ai/admin-openapi.yaml"
      - "docs/**/*-breaking-ignore.txt"
      - ".github/workflows/spec-breaking.yml"
  pull_request:
    paths: *specs

permissions:
  contents: read

env:
  # Pin the checker; bump deliberately. Release assets:
  # github.com/oasdiff/oasdiff/releases
  OASDIFF_VERSION: "1.21.0"

jobs:
  breaking:
    name: OpenAPI specs have no undeclared breaking changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need history to diff against the base version
      - name: Install oasdiff (pinned)
        run: |
          curl -fsSL -o /tmp/oasdiff.tar.gz \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/oasdiff.tar.gz -C /tmp oasdiff
          sudo install /tmp/oasdiff /usr/local/bin/oasdiff
          oasdiff --version
      - name: Diff each spec against its base version
        # github.* inputs go through env (never interpolated into run:) so a
        # crafted ref/sha can't be injected into the shell.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_BRANCH: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --quiet origin "$BASE_BRANCH"
            BASE_REF="origin/$BASE_BRANCH"
          else
            BASE_REF="$PUSH_BEFORE"
          fi
          echo "base ref: $BASE_REF"
          # A new branch / initial push has an all-zero before-sha → nothing to diff.
          if ! git rev-parse --verify --quiet "${BASE_REF}^{commit}" >/dev/null; then
            echo "base ref not resolvable (new branch / first push) — nothing to compare"
            exit 0
          fi
          specs="
            docs/artifact/openapi.yaml
            docs/artifact/admin-openapi.yaml
            docs/catalog/admin-openapi.yaml
            docs/catalog/v2-openapi.yaml
            docs/community/openapi.yaml
            docs/trust/openapi.yaml
            docs/trust/admin-openapi.yaml
            docs/ai/openapi.yaml
            docs/ai/admin-openapi.yaml
          "
          rc=0
          for spec in $specs; do
            base="/tmp/base-$(echo "$spec" | tr '/' '_')"
            if ! git show "${BASE_REF}:${spec}" > "$base" 2>/dev/null; then
              echo "::notice::$spec is new in this change (absent in base) — skipping breaking check"
              continue
            fi
            echo "── $spec ──"
            # A spec may DECLARE breaking changes in a sibling
            # <spec>-breaking-ignore.txt: one entry per intended removal, each
            # containing oasdiff's own error text. Nothing else is exempt — an
            # undeclared breaking change still fails, and the declaration lives
            # in the diff for a reviewer to argue with.
            ignore="${spec%.yaml}-breaking-ignore.txt"
            if [ -f "$ignore" ]; then
              echo "::notice::$spec has declared breaking changes in $ignore — they are ignored by this gate"
              oasdiff breaking "$base" "$spec" --fail-on ERR --err-ignore "$ignore" --format githubactions || rc=1
            else
              oasdiff breaking "$base" "$spec" --fail-on ERR --format githubactions || rc=1
            fi
          done
          exit $rc
